<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="713.5" viewBox="0 0 1000 713.5" role="img" aria-labelledby="title desc"><title id="title">Conceptual Diagram of Alert Beep Preservation and Audio Description Placement (12–16s)</title><desc id="desc">Timeline conceptual diagram comparing the original track above and the proposed track below. The original plays two alert beeps around 12s followed by a silent pause before dialogue resumes at 16s; the proposed track preserves the two beeps without masking them, places audio description in the pause, and notes that duration must be re-measured so it does not overlap the 16s dialogue.</desc><style>text{font-family:'Noto Sans KR',Arial,sans-serif}</style><rect width="1000" height="713.5" fill="#fafaf8"/><text x="40" y="60" fill="#252525" font-size="28" font-weight="700"><tspan x="40" dy="0">Conceptual Diagram of Alert Beep Preservation and Aud</tspan><tspan x="40" dy="42">io Description Placement (12–16s)</tspan></text><text x="40" y="125" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">Original Audio (Observed)</tspan></text><rect x="50" y="155" width="190" height="188" rx="6" fill="#d9ccc9" stroke="#999"/><text x="65" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="65" dy="0">2 Alert Beep</tspan><tspan x="65" dy="34.5">s (Must Pres</tspan><tspan x="65" dy="34.5">erve)</tspan></text><rect x="250" y="155" width="470" height="188" rx="6" fill="white" stroke="#999"/><text x="265" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="265" dy="0">Pause after beeps to ~16s next di</tspan><tspan x="265" dy="34.5">alogue (exact length and suitabil</tspan><tspan x="265" dy="34.5">ity unverified)</tspan></text><rect x="730" y="155" width="220" height="188" rx="6" fill="#dfdfda" stroke="#999"/><text x="745" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="745" dy="0">16s+ Next Dial</tspan><tspan x="745" dy="34.5">ogue (Re-authe</tspan><tspan x="745" dy="34.5">ntication comp</tspan><tspan x="745" dy="34.5">lete)</tspan></text><text x="40" y="408" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">Proposed Placement (Concept · Draft)</tspan></text><rect x="50" y="467" width="900" height="112.5" rx="10" fill="#f0ebe5" stroke="#b8aaa1"/><text x="70" y="507" fill="#7a4039" font-size="25" font-weight="400"><tspan x="70" dy="0">Audio Description Insertion Window (Proposed)</tspan></text><text x="45" y="619.5" fill="#555" font-size="23" font-weight="400"><tspan x="45" dy="0">No fixed 2s threshold · Do not mask alert beeps · Re-measure speech d</tspan><tspan x="45" dy="34.5">uration after actual recording</tspan></text></svg>