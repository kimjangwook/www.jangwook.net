<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1033" viewBox="0 0 1000 1033" role="img" aria-labelledby="title desc"><title id="title">SC 1.2.3（A）、SC 1.2.5（AA）与 G203 适用路径对比</title><desc id="desc">由三张卡片组成的对比图示。第一张卡片说明 SC 1.2.3（A 级）可选择文本替代或音频描述；第二张卡片说明 SC 1.2.5（AA 级）以音频描述为基本要求，并列出 G78、G173、G226 路径；第三张卡片说明 G203 仅为单人讲话、固定背景且无随时间变化的重要视觉信息时才允许使用的限定路径。</desc><style>text{font-family:'Noto Sans KR',Arial,sans-serif}</style><rect width="1000" height="1033" fill="#fafaf8"/><text x="40" y="60" fill="#252525" font-size="28" font-weight="700"><tspan x="40" dy="0">SC 1.2.3（A）、SC 1.2.5（AA）与 G203 适用路径对比</tspan></text><rect x="40" y="160" width="920" height="254" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="195" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">A 级 · SC 1.2.3</tspan></text><text x="65" y="235" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">文本替代或音频描述二选一</tspan></text><text x="65" y="301" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">提供包含画面、对白、重要声音及必要交互的充分文本替代，或提供音频描述，二</tspan><tspan x="65" dy="36">者满足其一即可。</tspan></text><rect x="40" y="434" width="920" height="254" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="469" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">AA 级 · SC 1.2.5</tspan></text><text x="65" y="509" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">提供音频描述为基本原则</tspan></text><text x="65" y="575" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">仅靠常规文本替代并不足够。如果默认语音未包含全部重要视觉信息，需通过 G7</tspan><tspan x="65" dy="36">8 或 G173 与 G226 组合等方式提供音频描述。</tspan></text><rect x="40" y="708" width="920" height="290" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="743" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">限定路径 · G203</tspan></text><text x="65" y="783" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">静态信息的限定文本补充</tspan></text><text x="65" y="849" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">仅在单人讲话、固定背景且不存在随时间变化的重要视觉信息时，才可通过与视频</tspan><tspan x="65" dy="36">程序化关联的静态文本补充原声中缺失的语境、讲话者姓名、演职员表等信息。若</tspan><tspan x="65" dy="36">重要画面状态发生变化则不适用。</tspan></text></svg>