<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="644.5" viewBox="0 0 1000 644.5" role="img" aria-labelledby="title desc"><title id="title">12~16 秒区间的提示音保留与音频描述排布概念图</title><desc id="desc">上下对比原始音轨与建议音轨的时间轴概念图。原始音轨在 12 秒附近播放两声提示音后经过无对白间隙，衔接 16 秒的重新验证对白；建议方案保留两声提示音不被掩盖，在其后的间隙区间安排音频描述，并标注需重新测量时长以避免与 16 秒的下一句对白重叠。</desc><style>text{font-family:'Noto Sans KR',Arial,sans-serif}</style><rect width="1000" height="644.5" fill="#fafaf8"/><text x="40" y="60" fill="#252525" font-size="28" font-weight="700"><tspan x="40" dy="0">12~16 秒区间的提示音保留与音频描述排布概念图</tspan></text><text x="40" y="125" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">原始语音（观察）</tspan></text><rect x="50" y="155" width="190" height="153.5" rx="6" fill="#d9ccc9" stroke="#999"/><text x="65" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="65" dy="0">提示音 2 声（</tspan><tspan x="65" dy="34.5">必须保留）</tspan></text><rect x="250" y="155" width="470" height="153.5" rx="6" fill="white" stroke="#999"/><text x="265" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="265" dy="0">提示音结束后至约 16 秒下一句对白前的</tspan><tspan x="265" dy="34.5">间隙（精确时长与可用性未验证）</tspan></text><rect x="730" y="155" width="220" height="153.5" rx="6" fill="#dfdfda" stroke="#999"/><text x="745" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="745" dy="0">16 秒起 下一句</tspan><tspan x="745" dy="34.5">对白（重新验证完</tspan><tspan x="745" dy="34.5">成）</tspan></text><text x="40" y="373.5" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">改进方案排布（概念、建议）</tspan></text><rect x="50" y="432.5" width="900" height="112.5" rx="10" fill="#f0ebe5" stroke="#b8aaa1"/><text x="70" y="472.5" fill="#7a4039" font-size="25" font-weight="400"><tspan x="70" dy="0">音频描述插入区间（建议）</tspan></text><text x="45" y="585" fill="#555" font-size="23" font-weight="400"><tspan x="45" dy="0">无固定 2 秒阈值 · 禁止掩盖提示音 · 实际录音后需重新测量发声时长</tspan></text></svg>