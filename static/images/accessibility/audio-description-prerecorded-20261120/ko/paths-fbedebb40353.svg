<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1069" viewBox="0 0 1000 1069" role="img" aria-labelledby="title desc"><title id="title">SC 1.2.3(A), SC 1.2.5(AA), G203 적용 경로 비교</title><desc id="desc">세 개의 카드로 구성된 비교 도식. 첫째 카드는 SC 1.2.3 수준 A로 텍스트 대안 또는 오디오 설명 선택 가능, 둘째 카드는 SC 1.2.5 수준 AA로 오디오 설명 필수 및 G78·G173·G226 경로, 셋째 카드는 G203으로 단일 화자·고정 배경·시간 의존 시각 정보 부재 시에만 허용되는 한정 경로임을 설명함.</desc><style>text{font-family:'Noto Sans KR',Arial,sans-serif}</style><rect width="1000" height="1069" fill="#fafaf8"/><text x="40" y="60" fill="#252525" font-size="28" font-weight="700"><tspan x="40" dy="0">SC 1.2.3(A), SC 1.2.5(AA), G203 적용 경로 비교</tspan></text><rect x="40" y="160" width="920" height="254" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="195" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">수준 A · SC 1.2.3</tspan></text><text x="65" y="235" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">텍스트 대안 또는 오디오 설명 선택</tspan></text><text x="65" y="301" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">화면·대사·중요한 소리와 필요한 상호작용을 담은 충분한 텍스트 대안이나 </tspan><tspan x="65" dy="36">오디오 설명 중 하나를 제공하면 충족합니다.</tspan></text><rect x="40" y="434" width="920" height="290" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="469" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">수준 AA · SC 1.2.5</tspan></text><text x="65" y="509" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">오디오 설명 제공이 기본 원칙</tspan></text><text x="65" y="575" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">일반 텍스트 대안만으로 충분하지 않습니다. 기본 음성에 중요한 시각 정보</tspan><tspan x="65" dy="36">가 모두 포함되지 않았다면 G78 또는 G173과 G226의 조합 등으로 오디오 </tspan><tspan x="65" dy="36">설명을 제공합니다.</tspan></text><rect x="40" y="744" width="920" height="290" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="779" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">한정 경로 · G203</tspan></text><text x="65" y="819" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">정적 정보의 한정적 텍스트 보완</tspan></text><text x="65" y="885" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">단일 화자·고정 배경이며 중요한 시간 의존 시각 정보가 없을 때만 원음에 </tspan><tspan x="65" dy="36">없는 맥락·화자명·크레디트 등을 영상과 프로그램적으로 연결된 정적 텍스트</tspan><tspan x="65" dy="36">로 보완합니다. 중요한 화면 상태가 변하면 적용할 수 없습니다.</tspan></text></svg>