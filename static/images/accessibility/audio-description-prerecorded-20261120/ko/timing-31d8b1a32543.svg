<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">12~16초 구간의 경고음 보존과 오디오 설명 배치 개념도</title><desc id="desc">원본 트랙과 제안 트랙을 위아래로 비교한 타임라인 개념도. 원본은 12초 부근 경고음 두 번 뒤 무대사 공백을 거쳐 16초 재인증 대사로 이어지며, 제안안은 경고음 두 번을 가리지 않고 보존한 뒤 공백 구간에 오디오 설명을 배치하고 16초 다음 대사와 겹치지 않도록 길이 재측정이 필요함을 표시함.</desc><style>text{font-family:'Noto Sans KR',Arial,sans-serif}</style><rect width="1000" height="610" fill="#fafaf8"/><text x="40" y="60" fill="#252525" font-size="28" font-weight="700"><tspan x="40" dy="0">12~16초 구간의 경고음 보존과 오디오 설명 배치 개념도</tspan></text><text x="40" y="125" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">원본 음성 (관찰)</tspan></text><rect x="50" y="155" width="190" height="119" rx="6" fill="#d9ccc9" stroke="#999"/><text x="65" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="65" dy="0">경고음 2회 (</tspan><tspan x="65" dy="34.5">보존 필수)</tspan></text><rect x="250" y="155" width="470" height="119" rx="6" fill="white" stroke="#999"/><text x="265" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="265" dy="0">경고음 종료 후~약 16초 다음 대사 전 </tspan><tspan x="265" dy="34.5">공백 (정확한 길이·사용 적절성 미검증)</tspan></text><rect x="730" y="155" width="220" height="119" rx="6" fill="#dfdfda" stroke="#999"/><text x="745" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="745" dy="0">16초~ 다음 대사</tspan><tspan x="745" dy="34.5"> (재인증 완료)</tspan></text><text x="40" y="339" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">개선안 배치 (개념·제안)</tspan></text><rect x="50" y="398" width="900" height="112.5" rx="10" fill="#f0ebe5" stroke="#b8aaa1"/><text x="70" y="438" fill="#7a4039" font-size="25" font-weight="400"><tspan x="70" dy="0">오디오 설명 삽입 구간 (제안)</tspan></text><text x="45" y="550.5" fill="#555" font-size="23" font-weight="400"><tspan x="45" dy="0">고정 2초 문턱 없음 · 경고음 가림 금지 · 실제 녹음 후 발화 길이 재측정 필요</tspan></text></svg>