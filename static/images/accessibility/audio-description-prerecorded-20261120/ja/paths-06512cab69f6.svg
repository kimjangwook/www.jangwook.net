<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1069" viewBox="0 0 1000 1069" role="img" aria-labelledby="title desc"><title id="title">SC 1.2.3（A）、SC 1.2.5（AA）、G203の適用経路比較</title><desc id="desc">3枚のカードで構成された比較図式。1枚目はSC 1.2.3レベルAでテキスト代替または音声解説を選択可能、2枚目はSC 1.2.5レベルAAで音声解説必須およびG78・G173・G226経路、3枚目はG203で単一話者・固定背景・時間依存視覚情報の不在時のみ許容される限定経路であることを説明している。</desc><style>text{font-family:'Noto Sans KR',Arial,sans-serif}</style><rect width="1000" height="1069" fill="#fafaf8"/><text x="40" y="60" fill="#252525" font-size="28" font-weight="700"><tspan x="40" dy="0">SC 1.2.3（A）、SC 1.2.5（AA）、G203の適用経路比較</tspan></text><rect x="40" y="160" width="920" height="254" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="195" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">レベルA・SC 1.2.3</tspan></text><text x="65" y="235" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">テキスト代替または音声解説を選択</tspan></text><text x="65" y="301" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">画面・セリフ・重要な音と必要なインタラクションを含む十分なテキスト代替、</tspan><tspan x="65" dy="36">または音声解説のいずれかを提供すれば満たせます。</tspan></text><rect x="40" y="434" width="920" height="290" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="469" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">レベルAA・SC 1.2.5</tspan></text><text x="65" y="509" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">音声解説の提供が基本原則</tspan></text><text x="65" y="575" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">一般的なテキスト代替だけでは不十分です。基本音声に重要な視覚情報がすべて</tspan><tspan x="65" dy="36">含まれていない場合、G78、またはG173とG226の組み合わせなどで音声解説を</tspan><tspan x="65" dy="36">提供します。</tspan></text><rect x="40" y="744" width="920" height="290" rx="12" fill="white" stroke="#d0d0cb"/><text x="65" y="779" fill="#7a4039" font-size="21" font-weight="700"><tspan x="65" dy="0">限定経路・G203</tspan></text><text x="65" y="819" fill="#252525" font-size="28" font-weight="700"><tspan x="65" dy="0">静的情報の限定的なテキスト補完</tspan></text><text x="65" y="885" fill="#252525" font-size="24" font-weight="400"><tspan x="65" dy="0">単一話者・固定背景で重要な時間依存視覚情報がない場合のみ、原音にない文脈</tspan><tspan x="65" dy="36">・話者名・クレジットなどを動画とプログラムで関連づけた静的テキストで補い</tspan><tspan x="65" dy="36">ます。重要な画面状態が変化する場合は適用できません。</tspan></text></svg>