<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">12〜16秒区間の警告音保持と音声解説配置の概念図</title><desc id="desc">原音トラックと提案トラックを上下で比較したタイムライン概念図。原音は12秒付近の警告音2回のあと無セリフの空白を経て16秒の再認証セリフへ続き、提案案は警告音2回を覆わず保持したうえで空白区間に音声解説を配置し、16秒の次のセリフと重ならないよう長さの再測定が必要であることを示している。</desc><style>text{font-family:'Noto Sans KR',Arial,sans-serif}</style><rect width="1000" height="610" fill="#fafaf8"/><text x="40" y="60" fill="#252525" font-size="28" font-weight="700"><tspan x="40" dy="0">12〜16秒区間の警告音保持と音声解説配置の概念図</tspan></text><text x="40" y="125" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">原音（観察）</tspan></text><rect x="50" y="155" width="190" height="119" rx="6" fill="#d9ccc9" stroke="#999"/><text x="65" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="65" dy="0">警告音2回（保</tspan><tspan x="65" dy="34.5">持必須）</tspan></text><rect x="250" y="155" width="470" height="119" rx="6" fill="white" stroke="#999"/><text x="265" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="265" dy="0">警告音終了後〜約16秒の次セリフ前の空</tspan><tspan x="265" dy="34.5">白（正確な長さ・使用適切性は未検証）</tspan></text><rect x="730" y="155" width="220" height="119" rx="6" fill="#dfdfda" stroke="#999"/><text x="745" y="190" fill="#252525" font-size="23" font-weight="400"><tspan x="745" dy="0">16秒〜 次のセリ</tspan><tspan x="745" dy="34.5">フ（再認証完了）</tspan></text><text x="40" y="339" fill="#252525" font-size="26" font-weight="700"><tspan x="40" dy="0">改善案の配置（概念・提案）</tspan></text><rect x="50" y="398" width="900" height="112.5" rx="10" fill="#f0ebe5" stroke="#b8aaa1"/><text x="70" y="438" fill="#7a4039" font-size="25" font-weight="400"><tspan x="70" dy="0">音声解説の挿入区間（提案）</tspan></text><text x="45" y="550.5" fill="#555" font-size="23" font-weight="400"><tspan x="45" dy="0">固定2秒しきい値なし・警告音の遮蔽禁止・実録音後の発話長再測定が必要</tspan></text></svg>