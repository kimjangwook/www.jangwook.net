<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">The same dialogue is read at different times in captions and transcripts</title><desc id="desc">On the left, the relevant dialogue appears at the same time as the video image. On the right, users must read the full transcript separately from the video, making it difficult to connect it immediately to the dialogue during playback.</desc><rect width="1200" height="700" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">Figure 01 / Can you read it while watching?</text><rect x="42" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="136" font-size="27" font-weight="650" style="fill:#252525">Synchronized captions</text><rect x="64" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="90" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="110" y="244" font-size="27" font-weight="650" style="fill:#252525">Before discarding codes</text><text x="110" y="289" font-size="21" font-weight="400" style="fill:#252525">Check that the new codes are saved.</text><text x="64" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="618" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="640" y="136" font-size="27" font-weight="650" style="fill:#252525">Static full transcript</text><rect x="640" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="666" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="686" y="244" font-size="27" font-weight="650" style="fill:#252525">Before discarding codes</text><text x="686" y="289" font-size="21" font-weight="400" style="fill:#252525">Check that the new codes are saved.</text><text x="640" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="64" y="465" width="496" height="125" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="83" y="500" font-size="23" font-weight="400" style="fill:#fafaf8">Guide: No. Do not discard them</text><text x="83" y="537" font-size="23" font-weight="400" style="fill:#fafaf8">before saving the new recovery codes.</text><text x="64" y="676" font-size="23" font-weight="400" style="fill:#252525">Read it with the current answer.</text><rect x="640" y="465" width="496" height="125" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="657" y="497" font-size="21" font-weight="400" style="fill:#252525">Select Security in Settings. Can I</text><text x="657" y="534" font-size="21" font-weight="400" style="fill:#252525">discard the old codes now? No. New…</text><text x="640" y="676" font-size="23" font-weight="400" style="fill:#252525">Find it in the full transcript.</text></svg>