<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Decision sequence for 1.2.2 applicability and the media-alternative-for-text exception</title><desc id="desc">Check dialogue and sounds needed for understanding in prerecorded synchronized media. If there is no target content, separate it under other relevant criteria. If both exception conditions for a media alternative for text are verified, the criterion does not apply. If a condition is absent, evaluate captions. If evidence is insufficient, the decision is inconclusive.</desc><rect width="1200" height="920" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">Figure 02 / Set the scope before checking captions</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#73736b"/></marker></defs><rect x="290" y="95" width="860" height="110" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="320" y="141" font-size="25" font-weight="400" style="fill:#252525">Prerecorded synchronized media?</text><text x="320" y="181" font-size="25" font-weight="400" style="fill:#252525">Dialogue or sounds needed to understand?</text><path d="M720,205 L720,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="744" y="254" font-size="21" font-weight="400" style="fill:#252525">Target verified</text><path d="M290,148 L162,148 L162,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="255" font-size="20" font-weight="400" style="fill:#252525">Absence confirmed</text><rect x="42" y="315" width="245" height="140" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="357" font-size="21" font-weight="400" style="fill:#252525">Outside this criterion</text><text x="64" y="391" font-size="21" font-weight="400" style="fill:#252525">Other media types:</text><text x="64" y="425" font-size="21" font-weight="400" style="fill:#252525">use relevant criteria</text><rect x="330" y="315" width="820" height="146" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="360" y="359" font-size="24" font-weight="400" style="fill:#252525">A media alternative for text?</text><text x="360" y="397" font-size="24" font-weight="400" style="fill:#252525">① No information beyond the text</text><text x="360" y="435" font-size="24" font-weight="400" style="fill:#252525">② Actually clearly labeled as such</text><path d="M500,461 L500,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><path d="M938,461 L938,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="514" font-size="21" font-weight="400" style="fill:#252525">Both verified</text><rect x="764" y="480" width="381" height="45" rx="10" fill="#fafaf8" stroke="#fafaf8"/><text x="778" y="514" font-size="21" font-weight="400" style="fill:#252525">A condition not met</text><rect x="300" y="565" width="408" height="100" rx="10" fill="#e6ebe3" stroke="#c8c8bf"/><text x="327" y="603" font-size="23" font-weight="400" style="fill:#252525">Verified exception</text><text x="327" y="639" font-size="23" font-weight="400" style="fill:#252525">Criterion does not apply</text><rect x="758" y="565" width="392" height="100" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="784" y="603" font-size="23" font-weight="400" style="fill:#252525">Evaluate captions</text><text x="784" y="639" font-size="23" font-weight="400" style="fill:#252525">Check delivery, content, timing</text><rect x="42" y="734" width="1108" height="124" rx="10" fill="#fff" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="68" y="775" font-size="23" font-weight="400" style="fill:#252525">Insufficient comparison evidence at any step → Inconclusive</text><text x="68" y="815" font-size="23" font-weight="400" style="fill:#252525">Record what more is needed: inventory, original, text, or label.</text><text x="42" y="903" font-size="22" font-weight="400" style="fill:#252525">Missing evidence is not proof of no target or an exception.</text></svg>