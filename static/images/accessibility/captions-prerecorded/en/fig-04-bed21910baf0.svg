<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Omitting important warning sounds from captions removes their meaning</title><desc id="desc">Two warning sounds in the original from 12.20 to 12.82 seconds indicate a failed security check. Sufficient captions show the sounds and their meaning from 12.20 to 15.82 seconds; dialogue-only captions leave that interval empty.</desc><rect width="1200" height="710" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">Figure 04 / Information exists without dialogue</text><rect x="42" y="95" width="1116" height="155" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="68" y="133" font-size="24" font-weight="650" style="fill:#252525">Original / 12.20–12.82 s: two warning sounds → security check failed</text><text x="68" y="184" font-size="24" font-weight="400" style="fill:#252525">Caption / 12.20–15.82 s: time to read the sound's meaning</text><text x="68" y="225" font-size="21" font-weight="400" style="fill:#252525">The sound ends before the caption disappears.</text><rect x="42" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="66" y="326" font-size="25" font-weight="650" style="fill:#252525">Sufficient captions</text><rect x="66" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="88" y="394" font-size="27" font-weight="650" style="fill:#252525">Security check result</text><text x="88" y="426" font-size="19" font-weight="400" style="fill:#252525">Check the result and proceed to the next step.</text><rect x="618" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="642" y="326" font-size="25" font-weight="650" style="fill:#252525">Warning sounds omitted</text><rect x="642" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="664" y="394" font-size="27" font-weight="650" style="fill:#252525">Security check result</text><text x="664" y="426" font-size="19" font-weight="400" style="fill:#252525">Check the result and proceed to the next step.</text><rect x="66" y="471" width="492" height="72" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="84" y="515" font-size="22" font-weight="400" style="fill:#fafaf8">[Two warning sounds: security check failed]</text><rect x="642" y="471" width="492" height="72" rx="10" fill="#fafaf8" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="660" y="515" font-size="22" font-weight="400" style="fill:#252525">No caption displayed in this interval</text><text x="42" y="652" font-size="25" font-weight="400" style="fill:#252525">The page's sound description alone does not show when failure occurs during playback.</text></svg>