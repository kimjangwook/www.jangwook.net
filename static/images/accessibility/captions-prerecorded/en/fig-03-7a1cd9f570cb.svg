<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc"><title id="title">Changing display timing can hinder use even when the caption sentence is unchanged</title><desc id="desc">The caption aligned with the actual answer is shown from 7.6 to 11.6 seconds. The caption delayed by 5 seconds appears from 12.6 to 16.6 seconds, causing users to read the previous answer on the security check result and recheck screens.</desc><rect width="1200" height="735" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">Figure 03 / Same sentence, different timing</text><text x="290" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">7 s</text><path d="M290,130 L290,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="410" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">9 s</text><path d="M410,130 L410,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="530" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">11 s</text><path d="M530,130 L530,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="650" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">13 s</text><path d="M650,130 L650,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="770" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">15 s</text><path d="M770,130 L770,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="890" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">17 s</text><path d="M890,130 L890,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="1010" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">19 s</text><path d="M1010,130 L1010,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="42" y="174" font-size="24" font-weight="650" style="fill:#252525">Current screen</text><rect x="290" y="141" width="297" height="70" rx="10" fill="#e8e8e1" stroke="#c8c8bf"/><text x="304" y="184" font-size="22" font-weight="400" style="fill:#252525">Before discarding codes</text><rect x="587" y="141" width="253" height="70" rx="10" fill="#efe4da" stroke="#c8c8bf"/><text x="601" y="169" font-size="18" font-weight="400" style="fill:#252525">Security check</text><text x="601" y="197" font-size="18" font-weight="400" style="fill:#252525">result</text><rect x="840" y="141" width="170" height="70" rx="10" fill="#e8e8e1" stroke="#c8c8bf"/><text x="852" y="184" font-size="19" font-weight="400" style="fill:#252525">Recheck</text><text x="42" y="281" font-size="23" font-weight="400" style="fill:#252525">Answer interval</text><text x="42" y="313" font-size="23" font-weight="400" style="fill:#252525">(design timing)</text><rect x="326.0" y="245" width="240" height="100" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="338.0" y="280" font-size="22" font-weight="400" style="fill:#fafaf8">7.6–11.6 s</text><text x="338.0" y="316" font-size="22" font-weight="400" style="fill:#fafaf8">“Do not discard”</text><text x="42" y="418" font-size="24" font-weight="650" style="fill:#252525">Caption A / Aligned</text><rect x="326.0" y="370" width="240" height="90" rx="10" fill="#e6ebe3" stroke="#c8c8bf"/><text x="338.0" y="404" font-size="22" font-weight="400" style="fill:#252525">7.6–11.6 s</text><text x="338.0" y="438" font-size="22" font-weight="400" style="fill:#252525">Answer read in sync</text><text x="42" y="545" font-size="24" font-weight="650" style="fill:#252525">Caption B / 5 s late</text><rect x="626.0" y="495" width="240" height="90" rx="10" fill="#efe4da" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="638.0" y="529" font-size="21" font-weight="400" style="fill:#252525">12.6–16.6 s</text><text x="638.0" y="563" font-size="21" font-weight="400" style="fill:#252525">Answer on next screen</text><path d="M326.0,472 L626.0,472" fill="none" stroke="#9e6b52" stroke-width="3"/><path d="M326.0,465 L326.0,480" fill="none" stroke="#9e6b52" stroke-width="3"/><path d="M626.0,465 L626.0,480" fill="none" stroke="#9e6b52" stroke-width="3"/><text x="416.0" y="487" font-size="18" font-weight="400" style="fill:#252525">+5.0 s</text><text x="310" y="649" font-size="23" font-weight="400" style="fill:#252525">Same sentence, but a different screen and context when users read it.</text><text x="310" y="692" font-size="22" font-weight="400" style="fill:#252525">5 seconds is this example's delay, not a fixed WCAG pass threshold.</text></svg>