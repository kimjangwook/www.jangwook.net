<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">同じ台詞でも、字幕と書き起こしでは読む時点が異なります</title><desc id="desc">左は映像の画面と同時に当該の台詞が表示されます。右は映像とは別に全文の書き起こしを読む必要があるため、再生中にどの台詞なのかをすぐに結び付けることが難しくなります。</desc><rect width="1200" height="700" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">図01 / 画面を見ながらすぐ読めるか</text><rect x="42" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="136" font-size="27" font-weight="650" style="fill:#252525">同期した字幕</text><rect x="64" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="90" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="110" y="244" font-size="27" font-weight="650" style="fill:#252525">コードを捨てる前に</text><text x="110" y="289" font-size="21" font-weight="400" style="fill:#252525">まず保存状態を確認してください。</text><text x="64" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="618" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="640" y="136" font-size="27" font-weight="650" style="fill:#252525">静的な全文の書き起こし</text><rect x="640" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="666" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="686" y="244" font-size="27" font-weight="650" style="fill:#252525">コードを捨てる前に</text><text x="686" y="289" font-size="21" font-weight="400" style="fill:#252525">まず保存状態を確認してください。</text><text x="640" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="64" y="465" width="496" height="125" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="83" y="500" font-size="23" font-weight="400" style="fill:#fafaf8">案内役：いいえ。新しい復旧コードを</text><text x="83" y="537" font-size="23" font-weight="400" style="fill:#fafaf8">保存するまでは捨てないでください。</text><text x="64" y="676" font-size="23" font-weight="400" style="fill:#252525">今聞こえる回答とともに読みます。</text><rect x="640" y="465" width="496" height="125" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="657" y="497" font-size="21" font-weight="400" style="fill:#252525">設定でセキュリティを選択します。以前のコードを</text><text x="657" y="534" font-size="21" font-weight="400" style="fill:#252525">今捨ててもよいですか？いいえ。新しい復旧…</text><text x="640" y="676" font-size="23" font-weight="400" style="fill:#252525">全体の内容を探して読む必要があります。</text></svg>