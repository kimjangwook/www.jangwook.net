<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">重要な警告音が字幕から欠けると、案内の意味が失われます</title><desc id="desc">原本の12.20秒から12.82秒の間の2回の警告音は、セキュリティ確認の失敗を知らせます。十分な字幕は12.20秒から15.82秒まで音と意味を表示し、台詞だけの字幕はその区間を空白にしています。</desc><rect width="1200" height="710" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">図04 / 台詞のない瞬間にも情報があります</text><rect x="42" y="95" width="1116" height="155" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="68" y="133" font-size="24" font-weight="650" style="fill:#252525">原本の音 / 12.20–12.82秒：警告音2回 → セキュリティ確認失敗</text><text x="68" y="184" font-size="24" font-weight="400" style="fill:#252525">字幕表示 / 12.20–15.82秒：音の意味を読む時間を確保</text><text x="68" y="225" font-size="21" font-weight="400" style="fill:#252525">音が終わる時刻と字幕が消える時刻は異なります。</text><rect x="42" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="66" y="326" font-size="25" font-weight="650" style="fill:#252525">十分な字幕</text><rect x="66" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="88" y="394" font-size="27" font-weight="650" style="fill:#252525">セキュリティ確認の結果</text><text x="88" y="426" font-size="19" font-weight="400" style="fill:#252525">結果を確認し、次の手順に進んでください。</text><rect x="618" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="642" y="326" font-size="25" font-weight="650" style="fill:#252525">警告音を省いた字幕</text><rect x="642" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="664" y="394" font-size="27" font-weight="650" style="fill:#252525">セキュリティ確認の結果</text><text x="664" y="426" font-size="19" font-weight="400" style="fill:#252525">結果を確認し、次の手順に進んでください。</text><rect x="66" y="471" width="492" height="72" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="84" y="515" font-size="22" font-weight="400" style="fill:#fafaf8">[セキュリティ確認失敗を知らせる警告音2回]</text><rect x="642" y="471" width="492" height="72" rx="10" fill="#fafaf8" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="660" y="515" font-size="22" font-weight="400" style="fill:#252525">当該区間に表示される字幕なし</text><text x="42" y="652" font-size="25" font-weight="400" style="fill:#252525">ページの音の説明だけでは、映像の再生中にいつ失敗したかは分かりません。</text></svg>