<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">1.2.2の適用と本文の代替に関する例外の判断順序</title><desc id="desc">事前制作の同期したメディアの台詞と、理解に必要な音を確認します。対象がなければ、他の関連基準に分けます。本文の代替に関する二つの例外条件をともに確認できれば適用除外、条件がなければ字幕評価、資料が不足していれば判断保留です。</desc><rect width="1200" height="920" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">図02 / 字幕検査の前に適用範囲を決めます</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#73736b"/></marker></defs><rect x="290" y="95" width="860" height="110" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="320" y="141" font-size="25" font-weight="400" style="fill:#252525">事前制作の同期したメディアですか？</text><text x="320" y="181" font-size="25" font-weight="400" style="fill:#252525">台詞や理解に必要な音がありますか？</text><path d="M720,205 L720,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="744" y="254" font-size="21" font-weight="400" style="fill:#252525">対象を確認</text><path d="M290,148 L162,148 L162,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="255" font-size="20" font-weight="400" style="fill:#252525">対象なしを確認</text><rect x="42" y="315" width="245" height="140" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="357" font-size="21" font-weight="400" style="fill:#252525">この基準の対象外</text><text x="64" y="391" font-size="21" font-weight="400" style="fill:#252525">他のメディア形式は</text><text x="64" y="425" font-size="21" font-weight="400" style="fill:#252525">関連基準に分ける</text><rect x="330" y="315" width="820" height="146" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="360" y="359" font-size="24" font-weight="400" style="fill:#252525">本文のメディアによる代替ですか？</text><text x="360" y="397" font-size="24" font-weight="400" style="fill:#252525">① 本文にない情報を追加しない</text><text x="360" y="435" font-size="24" font-weight="400" style="fill:#252525">② その事実を実際に明確に表示</text><path d="M500,461 L500,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><path d="M938,461 L938,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="514" font-size="21" font-weight="400" style="fill:#252525">両条件を確認</text><rect x="764" y="480" width="381" height="45" rx="10" fill="#fafaf8" stroke="#fafaf8"/><text x="778" y="514" font-size="21" font-weight="400" style="fill:#252525">条件が成立しない</text><rect x="300" y="565" width="408" height="100" rx="10" fill="#e6ebe3" stroke="#c8c8bf"/><text x="327" y="603" font-size="23" font-weight="400" style="fill:#252525">検証済みの例外</text><text x="327" y="639" font-size="23" font-weight="400" style="fill:#252525">この基準は適用除外</text><rect x="758" y="565" width="392" height="100" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="784" y="603" font-size="23" font-weight="400" style="fill:#252525">通常の字幕要求を評価</text><text x="784" y="639" font-size="23" font-weight="400" style="fill:#252525">提供・内容・時間を確認</text><rect x="42" y="734" width="1108" height="124" rx="10" fill="#fff" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="68" y="775" font-size="23" font-weight="400" style="fill:#252525">どの段階でも比較資料が不足する場合 → 判断保留</text><text x="68" y="815" font-size="23" font-weight="400" style="fill:#252525">一覧・原本・本文・表示文で、追加確認が必要な事項を記録します。</text><text x="42" y="903" font-size="22" font-weight="400" style="fill:#252525">資料不足を対象なしや例外に置き換えません。</text></svg>