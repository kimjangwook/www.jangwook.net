<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">같은 대사도 자막과 전사문은 읽는 시점이 다릅니다</title><desc id="desc">왼쪽은 영상 화면과 동시에 해당 대사가 보입니다. 오른쪽은 영상과 별도로 전체 전사문을 읽어야 하므로 재생 중 어떤 대사인지 즉시 연결하기 어렵습니다.</desc><rect width="1200" height="700" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">그림 01 / 화면을 보면서 바로 읽을 수 있는가</text><rect x="42" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="136" font-size="27" font-weight="650" style="fill:#252525">동기화 자막</text><rect x="64" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="90" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="110" y="244" font-size="27" font-weight="650" style="fill:#252525">코드를 버리기 전에</text><text x="110" y="289" font-size="21" font-weight="400" style="fill:#252525">저장 상태를 먼저 확인하세요.</text><text x="64" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="618" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="640" y="136" font-size="27" font-weight="650" style="fill:#252525">정적인 전체 전사문</text><rect x="640" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="666" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="686" y="244" font-size="27" font-weight="650" style="fill:#252525">코드를 버리기 전에</text><text x="686" y="289" font-size="21" font-weight="400" style="fill:#252525">저장 상태를 먼저 확인하세요.</text><text x="640" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="64" y="465" width="496" height="125" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="83" y="500" font-size="23" font-weight="400" style="fill:#fafaf8">안내자: 아니요. 새 복구 코드를</text><text x="83" y="537" font-size="23" font-weight="400" style="fill:#fafaf8">저장하기 전에는 버리지 마세요.</text><text x="64" y="676" font-size="23" font-weight="400" style="fill:#252525">지금 들리는 답변과 함께 읽습니다.</text><rect x="640" y="465" width="496" height="125" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="657" y="497" font-size="21" font-weight="400" style="fill:#252525">설정에서 보안을 선택합니다. 이전 코드를</text><text x="657" y="534" font-size="21" font-weight="400" style="fill:#252525">지금 버려도 되나요? 아니요. 새 복구…</text><text x="640" y="676" font-size="23" font-weight="400" style="fill:#252525">전체 내용을 찾아 읽어야 합니다.</text></svg>