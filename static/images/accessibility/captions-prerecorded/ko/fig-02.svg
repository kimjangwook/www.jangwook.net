<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">1.2.2 적용과 본문 대안 예외 판단 순서</title><desc id="desc">사전 제작 동기화 매체의 대사와 이해에 필요한 소리를 확인합니다. 대상이 없으면 다른 관련 기준으로 분리합니다. 본문 대안의 두 예외 조건을 모두 확인하면 적용 제외, 조건이 없으면 자막 평가, 자료가 부족하면 판단 유보입니다.</desc><rect width="1200" height="920" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">그림 02 / 자막 검사 전에 적용 범위를 정합니다</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#73736b"/></marker></defs><rect x="290" y="95" width="860" height="110" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="320" y="141" font-size="25" font-weight="400" style="fill:#252525">사전 제작 동기화 매체인가요?</text><text x="320" y="181" font-size="25" font-weight="400" style="fill:#252525">대사나 이해에 필요한 소리가 있나요?</text><path d="M720,205 L720,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="744" y="254" font-size="21" font-weight="400" style="fill:#252525">대상 확인</text><path d="M290,148 L162,148 L162,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="255" font-size="20" font-weight="400" style="fill:#252525">대상 없음 확인</text><rect x="42" y="315" width="245" height="140" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="357" font-size="21" font-weight="400" style="fill:#252525">이 기준의 대상 아님</text><text x="64" y="391" font-size="21" font-weight="400" style="fill:#252525">다른 매체 유형은</text><text x="64" y="425" font-size="21" font-weight="400" style="fill:#252525">관련 기준으로 분리</text><rect x="330" y="315" width="820" height="146" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="360" y="359" font-size="24" font-weight="400" style="fill:#252525">본문의 매체 대안인가요?</text><text x="360" y="397" font-size="24" font-weight="400" style="fill:#252525">① 본문에 없는 정보를 추가하지 않음</text><text x="360" y="435" font-size="24" font-weight="400" style="fill:#252525">② 그 사실을 실제로 명확하게 표시함</text><path d="M500,461 L500,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><path d="M938,461 L938,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="514" font-size="21" font-weight="400" style="fill:#252525">두 조건 모두 확인</text><rect x="764" y="480" width="381" height="45" rx="10" fill="#fafaf8" stroke="#fafaf8"/><text x="778" y="514" font-size="21" font-weight="400" style="fill:#252525">조건이 성립하지 않음</text><rect x="300" y="565" width="408" height="100" rx="10" fill="#e6ebe3" stroke="#c8c8bf"/><text x="327" y="603" font-size="23" font-weight="400" style="fill:#252525">검증된 예외</text><text x="327" y="639" font-size="23" font-weight="400" style="fill:#252525">이 기준 적용 제외</text><rect x="758" y="565" width="392" height="100" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="784" y="603" font-size="23" font-weight="400" style="fill:#252525">일반 자막 요구를 평가</text><text x="784" y="639" font-size="23" font-weight="400" style="fill:#252525">제공·내용·시간 확인</text><rect x="42" y="734" width="1108" height="124" rx="10" fill="#fff" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="68" y="775" font-size="23" font-weight="400" style="fill:#252525">어느 단계든 비교 자료가 부족하면 → 판단 유보</text><text x="68" y="815" font-size="23" font-weight="400" style="fill:#252525">목록·원본·본문·표시 문구에서 무엇을 더 확인해야 하는지 기록합니다.</text><text x="42" y="903" font-size="22" font-weight="400" style="fill:#252525">자료 부족을 대상 없음이나 예외로 바꾸지 않습니다.</text></svg>