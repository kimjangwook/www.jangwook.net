<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc"><title id="title">같은 자막 문장도 표시 시간이 바뀌면 이용에 지장이 생깁니다</title><desc id="desc">실제 답변과 맞는 자막은 7.6초부터 11.6초까지입니다. 5초 늦은 자막은 12.6초부터 16.6초까지 나타나 보안 확인 결과와 재확인 화면에서 이전 답변을 읽게 됩니다.</desc><rect width="1200" height="735" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">그림 03 / 같은 문장, 다른 표시 시간</text><text x="290" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">7초</text><path d="M290,130 L290,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="410" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">9초</text><path d="M410,130 L410,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="530" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">11초</text><path d="M530,130 L530,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="650" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">13초</text><path d="M650,130 L650,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="770" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">15초</text><path d="M770,130 L770,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="890" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">17초</text><path d="M890,130 L890,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="1010" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">19초</text><path d="M1010,130 L1010,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="42" y="174" font-size="24" font-weight="650" style="fill:#252525">현재 화면</text><rect x="290" y="141" width="297" height="70" rx="10" fill="#e8e8e1" stroke="#c8c8bf"/><text x="304" y="184" font-size="22" font-weight="400" style="fill:#252525">코드를 버리기 전에</text><rect x="587" y="141" width="253" height="70" rx="10" fill="#efe4da" stroke="#c8c8bf"/><text x="601" y="169" font-size="18" font-weight="400" style="fill:#252525">보안 확인</text><text x="601" y="197" font-size="18" font-weight="400" style="fill:#252525">결과</text><rect x="840" y="141" width="170" height="70" rx="10" fill="#e8e8e1" stroke="#c8c8bf"/><text x="852" y="184" font-size="19" font-weight="400" style="fill:#252525">다시 확인하기</text><text x="42" y="281" font-size="23" font-weight="400" style="fill:#252525">답변 구간</text><text x="42" y="313" font-size="23" font-weight="400" style="fill:#252525">(설계 기준)</text><rect x="326.0" y="245" width="240" height="100" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="338.0" y="280" font-size="22" font-weight="400" style="fill:#fafaf8">7.6–11.6초</text><text x="338.0" y="316" font-size="22" font-weight="400" style="fill:#fafaf8">“버리지 마세요”</text><text x="42" y="418" font-size="24" font-weight="650" style="fill:#252525">자막 A / 시간 일치</text><rect x="326.0" y="370" width="240" height="90" rx="10" fill="#e6ebe3" stroke="#c8c8bf"/><text x="338.0" y="404" font-size="22" font-weight="400" style="fill:#252525">7.6–11.6초</text><text x="338.0" y="438" font-size="22" font-weight="400" style="fill:#252525">같은 때 읽는 답변</text><text x="42" y="545" font-size="24" font-weight="650" style="fill:#252525">자막 B / 5초 지연</text><rect x="626.0" y="495" width="240" height="90" rx="10" fill="#efe4da" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="638.0" y="529" font-size="21" font-weight="400" style="fill:#252525">12.6–16.6초</text><text x="638.0" y="563" font-size="21" font-weight="400" style="fill:#252525">다음 화면에서 읽는 답변</text><path d="M326.0,472 L626.0,472" fill="none" stroke="#9e6b52" stroke-width="3"/><path d="M326.0,465 L326.0,480" fill="none" stroke="#9e6b52" stroke-width="3"/><path d="M626.0,465 L626.0,480" fill="none" stroke="#9e6b52" stroke-width="3"/><text x="416.0" y="487" font-size="18" font-weight="400" style="fill:#252525">+5.0초</text><text x="310" y="649" font-size="23" font-weight="400" style="fill:#252525">문장은 같아도, 이용자가 답변을 읽는 순간의 화면과 상황이 달라집니다.</text><text x="310" y="692" font-size="22" font-weight="400" style="fill:#252525">5초는 이 사례의 지연입니다. WCAG의 고정 합격선이 아닙니다.</text></svg>