<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">중요한 경고음이 자막에서 빠지면 안내의 의미가 사라집니다</title><desc id="desc">원본의 12.20초부터 12.82초 사이 두 번의 경고음은 보안 확인 실패를 알립니다. 충분한 자막은 12.20초부터 15.82초까지 소리와 의미를 표시하며 대사만 있는 자막은 그 구간을 비워 둡니다.</desc><rect width="1200" height="710" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">그림 04 / 대사가 없는 순간에도 정보가 있습니다</text><rect x="42" y="95" width="1116" height="155" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="68" y="133" font-size="24" font-weight="650" style="fill:#252525">원본 소리 / 12.20–12.82초: 경고음 두 번 → 보안 확인 실패</text><text x="68" y="184" font-size="24" font-weight="400" style="fill:#252525">자막 표시 / 12.20–15.82초: 소리의 의미를 읽을 시간 확보</text><text x="68" y="225" font-size="21" font-weight="400" style="fill:#252525">소리가 끝나는 시각과 자막이 사라지는 시각은 다릅니다.</text><rect x="42" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="66" y="326" font-size="25" font-weight="650" style="fill:#252525">충분한 자막</text><rect x="66" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="88" y="394" font-size="27" font-weight="650" style="fill:#252525">보안 확인 결과</text><text x="88" y="426" font-size="19" font-weight="400" style="fill:#252525">결과를 확인하고 다음 단계로 이동하세요.</text><rect x="618" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="642" y="326" font-size="25" font-weight="650" style="fill:#252525">경고음을 빠뜨린 자막</text><rect x="642" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="664" y="394" font-size="27" font-weight="650" style="fill:#252525">보안 확인 결과</text><text x="664" y="426" font-size="19" font-weight="400" style="fill:#252525">결과를 확인하고 다음 단계로 이동하세요.</text><rect x="66" y="471" width="492" height="72" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="84" y="515" font-size="22" font-weight="400" style="fill:#fafaf8">[보안 확인 실패를 알리는 경고음 두 번]</text><rect x="642" y="471" width="492" height="72" rx="10" fill="#fafaf8" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="660" y="515" font-size="22" font-weight="400" style="fill:#252525">해당 구간에 표시되는 자막이 없음</text><text x="42" y="652" font-size="25" font-weight="400" style="fill:#252525">페이지의 소리 설명만으로는, 영상 재생 중 언제 실패했는지 알 수 없습니다.</text></svg>