<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" role="img" aria-labelledby="title desc"><title id="title">相同字幕句子的显示时间改变，也会影响使用</title><desc id="desc">与实际回答对应的字幕时间为 7.6 秒至 11.6 秒。晚 5 秒的字幕在 12.6 秒至 16.6 秒出现，导致用户在安全验证结果和重新验证画面中阅读上一段回答。</desc><rect width="1200" height="735" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">图 03 / 相同句子，不同显示时间</text><text x="290" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">7 秒</text><path d="M290,130 L290,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="410" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">9 秒</text><path d="M410,130 L410,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="530" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">11 秒</text><path d="M530,130 L530,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="650" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">13 秒</text><path d="M650,130 L650,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="770" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">15 秒</text><path d="M770,130 L770,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="890" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">17 秒</text><path d="M890,130 L890,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="1010" y="111" text-anchor="middle" font-size="22" font-weight="400" style="fill:#252525">19 秒</text><path d="M1010,130 L1010,573" fill="none" stroke="#deded6" stroke-width="3"/><text x="42" y="174" font-size="24" font-weight="650" style="fill:#252525">当前画面</text><rect x="290" y="141" width="297" height="70" rx="10" fill="#e8e8e1" stroke="#c8c8bf"/><text x="304" y="184" font-size="22" font-weight="400" style="fill:#252525">丢弃代码之前</text><rect x="587" y="141" width="253" height="70" rx="10" fill="#efe4da" stroke="#c8c8bf"/><text x="601" y="169" font-size="18" font-weight="400" style="fill:#252525">安全验证</text><text x="601" y="197" font-size="18" font-weight="400" style="fill:#252525">结果</text><rect x="840" y="141" width="170" height="70" rx="10" fill="#e8e8e1" stroke="#c8c8bf"/><text x="852" y="184" font-size="19" font-weight="400" style="fill:#252525">重新验证</text><text x="42" y="281" font-size="23" font-weight="400" style="fill:#252525">回答区间</text><text x="42" y="313" font-size="23" font-weight="400" style="fill:#252525">（设计基准）</text><rect x="326.0" y="245" width="240" height="100" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="338.0" y="280" font-size="22" font-weight="400" style="fill:#fafaf8">7.6–11.6 秒</text><text x="338.0" y="316" font-size="22" font-weight="400" style="fill:#fafaf8">“请不要丢弃”</text><text x="42" y="418" font-size="24" font-weight="650" style="fill:#252525">字幕 A / 时间一致</text><rect x="326.0" y="370" width="240" height="90" rx="10" fill="#e6ebe3" stroke="#c8c8bf"/><text x="338.0" y="404" font-size="22" font-weight="400" style="fill:#252525">7.6–11.6 秒</text><text x="338.0" y="438" font-size="22" font-weight="400" style="fill:#252525">同时阅读的回答</text><text x="42" y="545" font-size="24" font-weight="650" style="fill:#252525">字幕 B / 延迟 5 秒</text><rect x="626.0" y="495" width="240" height="90" rx="10" fill="#efe4da" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="638.0" y="529" font-size="21" font-weight="400" style="fill:#252525">12.6–16.6 秒</text><text x="638.0" y="563" font-size="21" font-weight="400" style="fill:#252525">下一画面阅读的回答</text><path d="M326.0,472 L626.0,472" fill="none" stroke="#9e6b52" stroke-width="3"/><path d="M326.0,465 L326.0,480" fill="none" stroke="#9e6b52" stroke-width="3"/><path d="M626.0,465 L626.0,480" fill="none" stroke="#9e6b52" stroke-width="3"/><text x="416.0" y="487" font-size="18" font-weight="400" style="fill:#252525">+5.0 秒</text><text x="310" y="649" font-size="23" font-weight="400" style="fill:#252525">即使句子相同，用户阅读回答时的画面和情境也不同。</text><text x="310" y="692" font-size="22" font-weight="400" style="fill:#252525">5 秒是本案例的延迟，不是 WCAG 的固定合格线。</text></svg>