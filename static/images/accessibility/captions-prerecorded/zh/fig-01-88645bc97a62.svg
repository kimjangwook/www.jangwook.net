<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">相同台词，字幕与转写文本的阅读时机不同</title><desc id="desc">左侧在视频画面播放的同时显示对应台词。右侧需要另行阅读完整转写文本，因此播放时难以立即关联当前台词。</desc><rect width="1200" height="700" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">图 01 / 能否在观看画面时直接阅读</text><rect x="42" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="136" font-size="27" font-weight="650" style="fill:#252525">同步字幕</text><rect x="64" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="90" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="110" y="244" font-size="27" font-weight="650" style="fill:#252525">丢弃代码之前</text><text x="110" y="289" font-size="21" font-weight="400" style="fill:#252525">请先确认保存状态。</text><text x="64" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="618" y="95" width="540" height="540" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="640" y="136" font-size="27" font-weight="650" style="fill:#252525">静态完整转写</text><rect x="640" y="160" width="496" height="242" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><rect x="666" y="204" width="444" height="152" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="686" y="244" font-size="27" font-weight="650" style="fill:#252525">丢弃代码之前</text><text x="686" y="289" font-size="21" font-weight="400" style="fill:#252525">请先确认保存状态。</text><text x="640" y="437" font-size="21" font-weight="400" style="fill:#252525">▶  00:09 / 00:31     ━━━━━━━</text><rect x="64" y="465" width="496" height="125" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="83" y="500" font-size="23" font-weight="400" style="fill:#fafaf8">引导员：不可以。在保存</text><text x="83" y="537" font-size="23" font-weight="400" style="fill:#fafaf8">新的恢复码之前，请不要丢弃。</text><text x="64" y="676" font-size="23" font-weight="400" style="fill:#252525">与当前听到的回答一起阅读。</text><rect x="640" y="465" width="496" height="125" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="657" y="497" font-size="21" font-weight="400" style="fill:#252525">在设置中选择安全。现在可以</text><text x="657" y="534" font-size="21" font-weight="400" style="fill:#252525">丢弃旧代码吗？不可以。新的恢复…</text><text x="640" y="676" font-size="23" font-weight="400" style="fill:#252525">需要查找并阅读完整内容。</text></svg>