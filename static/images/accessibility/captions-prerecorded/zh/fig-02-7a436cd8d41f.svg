<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">1.2.2 适用性与正文替代形式例外的判断顺序</title><desc id="desc">确认预先制作的同步媒体中的台词和理解所需的声音。没有适用对象时，单独按其他相关准则处理。正文替代形式的两个例外条件都确认后为不适用；条件不成立时评估字幕；资料不足时暂无法判定。</desc><rect width="1200" height="920" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">图 02 / 检查字幕前先确定适用范围</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#73736b"/></marker></defs><rect x="290" y="95" width="860" height="110" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="320" y="141" font-size="25" font-weight="400" style="fill:#252525">是预录同步媒体吗？</text><text x="320" y="181" font-size="25" font-weight="400" style="fill:#252525">有台词或理解所需的声音吗？</text><path d="M720,205 L720,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="744" y="254" font-size="21" font-weight="400" style="fill:#252525">确认有对象</text><path d="M290,148 L162,148 L162,300" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="255" font-size="20" font-weight="400" style="fill:#252525">确认无对象</text><rect x="42" y="315" width="245" height="140" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="64" y="357" font-size="21" font-weight="400" style="fill:#252525">不属于本准则对象</text><text x="64" y="391" font-size="21" font-weight="400" style="fill:#252525">其他媒体类型</text><text x="64" y="425" font-size="21" font-weight="400" style="fill:#252525">按相关准则处理</text><rect x="330" y="315" width="820" height="146" rx="10" fill="#f0f0eb" stroke="#c8c8bf"/><text x="360" y="359" font-size="24" font-weight="400" style="fill:#252525">是正文的媒体替代形式吗？</text><text x="360" y="397" font-size="24" font-weight="400" style="fill:#252525">① 未增加正文中没有的信息</text><text x="360" y="435" font-size="24" font-weight="400" style="fill:#252525">② 实际明确标明这一事实</text><path d="M500,461 L500,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><path d="M938,461 L938,553" fill="none" stroke="#73736b" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="514" font-size="21" font-weight="400" style="fill:#252525">两个条件均确认</text><rect x="764" y="480" width="381" height="45" rx="10" fill="#fafaf8" stroke="#fafaf8"/><text x="778" y="514" font-size="21" font-weight="400" style="fill:#252525">条件不成立</text><rect x="300" y="565" width="408" height="100" rx="10" fill="#e6ebe3" stroke="#c8c8bf"/><text x="327" y="603" font-size="23" font-weight="400" style="fill:#252525">已验证的例外</text><text x="327" y="639" font-size="23" font-weight="400" style="fill:#252525">本准则不适用</text><rect x="758" y="565" width="392" height="100" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="784" y="603" font-size="23" font-weight="400" style="fill:#252525">评估一般字幕要求</text><text x="784" y="639" font-size="23" font-weight="400" style="fill:#252525">检查提供、内容、时间</text><rect x="42" y="734" width="1108" height="124" rx="10" fill="#fff" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="68" y="775" font-size="23" font-weight="400" style="fill:#252525">任一步骤缺少比较资料 → 暂无法判定</text><text x="68" y="815" font-size="23" font-weight="400" style="fill:#252525">记录列表、原始媒体、正文、标示文字还需确认什么。</text><text x="42" y="903" font-size="22" font-weight="400" style="fill:#252525">不要把资料不足转为无对象或例外。</text></svg>