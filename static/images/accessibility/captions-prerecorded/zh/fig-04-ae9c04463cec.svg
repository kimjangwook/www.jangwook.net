<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">字幕遗漏重要警告音，会丢失说明的含义</title><desc id="desc">原始媒体在 12.20 秒至 12.82 秒之间的两次警告音表示安全验证失败。充分的字幕在 12.20 秒至 15.82 秒显示声音及其含义，而仅有台词的字幕让这一区间留空。</desc><rect width="1200" height="710" fill="#fafaf8"/><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#252525}.sub{fill:#575751}</style><text x="42" y="54" font-size="32" font-weight="650" style="fill:#252525">图 04 / 没有台词的时刻也有信息</text><rect x="42" y="95" width="1116" height="155" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="68" y="133" font-size="24" font-weight="650" style="fill:#252525">原始声音 / 12.20–12.82 秒：两次警告音 → 安全验证失败</text><text x="68" y="184" font-size="24" font-weight="400" style="fill:#252525">字幕显示 / 12.20–15.82 秒：留出阅读声音含义的时间</text><text x="68" y="225" font-size="21" font-weight="400" style="fill:#252525">声音结束与字幕消失的时刻不同。</text><rect x="42" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="66" y="326" font-size="25" font-weight="650" style="fill:#252525">充分的字幕</text><rect x="66" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="88" y="394" font-size="27" font-weight="650" style="fill:#252525">安全验证结果</text><text x="88" y="426" font-size="19" font-weight="400" style="fill:#252525">请查看结果并进入下一步。</text><rect x="618" y="285" width="540" height="292" rx="10" fill="#fff" stroke="#c8c8bf"/><text x="642" y="326" font-size="25" font-weight="650" style="fill:#252525">遗漏警告音的字幕</text><rect x="642" y="352" width="492" height="97" rx="10" fill="#fafaf8" stroke="#c8c8bf"/><text x="664" y="394" font-size="27" font-weight="650" style="fill:#252525">安全验证结果</text><text x="664" y="426" font-size="19" font-weight="400" style="fill:#252525">请查看结果并进入下一步。</text><rect x="66" y="471" width="492" height="72" rx="10" fill="#252525" stroke="#c8c8bf"/><text x="84" y="515" font-size="22" font-weight="400" style="fill:#fafaf8">[两次表示安全验证失败的警告音]</text><rect x="642" y="471" width="492" height="72" rx="10" fill="#fafaf8" stroke="#9e6b52" stroke-dasharray="7 5"/><text x="660" y="515" font-size="22" font-weight="400" style="fill:#252525">该区间没有显示字幕</text><text x="42" y="652" font-size="25" font-weight="400" style="fill:#252525">仅凭页面上的声音说明，无法知道视频播放中何时发生失败。</text></svg>