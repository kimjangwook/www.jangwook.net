<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="666" viewBox="0 0 1120 666" role="img" aria-labelledby="title desc"><title id="title">문의 수 그래프와 상세 데이터 대안 비교</title><desc id="desc">한국어 교육용 도식. 핵심 정보와 조건은 본문과 대체 텍스트로 함께 제공합니다.</desc><rect width="100%" height="100%" fill="#fafaf8"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="34" font-weight="700" fill="#252525"><tspan x="40" dy="0">그래프의 대안은 값과 관계를 전달합니다</tspan></text><rect x="40" y="95" width="505" height="410" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="64" y="140" font-size="25" font-weight="700" fill="#252525"><tspan x="64" dy="0">교육용 그래프 · 문의 수(건)</tspan></text><rect x="130" y="247" width="64" height="168" fill="#62625e"/><text x="128" y="227" font-size="24" font-weight="700" fill="#252525"><tspan x="128" dy="0">120</tspan></text><text x="126" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="126" dy="0">1월</tspan></text><rect x="275" y="303" width="64" height="112" fill="#62625e"/><text x="273" y="283" font-size="24" font-weight="700" fill="#252525"><tspan x="273" dy="0">80</tspan></text><text x="271" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="271" dy="0">2월</tspan></text><rect x="420" y="191" width="64" height="224" fill="#62625e"/><text x="418" y="171" font-size="24" font-weight="700" fill="#252525"><tspan x="418" dy="0">160</tspan></text><text x="416" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="416" dy="0">3월</tspan></text><rect x="575" y="95" width="505" height="410" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="599" y="140" font-size="25" font-weight="700" fill="#252525"><tspan x="599" dy="0">상세 대안 · 같은 데이터를 제공</tspan></text><text x="615" y="205" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">1월     120건</tspan></text><line x1="599" y1="225" x2="1050" y2="225" stroke="#d5d5d0"/><text x="615" y="271" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">2월       80건</tspan></text><line x1="599" y1="291" x2="1050" y2="291" stroke="#d5d5d0"/><text x="615" y="337" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">3월     160건</tspan></text><line x1="599" y1="357" x2="1050" y2="357" stroke="#d5d5d0"/><text x="599" y="440" font-size="24" font-weight="400" fill="#252525"><tspan x="599" dy="0">2월에 감소한 뒤</tspan><tspan x="599" dy="36">3월에 증가했습니다.</tspan></text><rect x="40" y="535" width="1040" height="98" rx="12" fill="#fff" stroke="#b4b4ae"/><text x="64" y="575" font-size="23" font-weight="400" fill="#252525"><tspan x="64" dy="0">짧은 alt로 그래프를 식별하고, 상세 설명과 표의 위치를 안내합니다.</tspan><tspan x="64" dy="36">값·단위·추세를 확인할 수 있어야 비교 작업이 가능합니다.</tspan></text></g></svg>