<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="966" viewBox="0 0 1176 966" role="img" aria-labelledby="title desc"><title id="title">상품 정보, 이미지 링크, 본문과 중복된 이미지의 화면 비교</title><desc id="desc">교육용 와이어프레임 세 개에서 같은 재킷 이미지를 다른 역할로 사용합니다. 상세 페이지의 색상과 앞면 정보, 이미지 링크의 상품 상세 이동 목적, 이미 본문에 제공된 설명과 중복되는 이미지를 비교합니다.</desc><rect width="100%" height="100%" fill="#fafaf8"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="36" y="52" font-size="31" font-weight="700" fill="#252525">같은 이미지, 화면 속 역할은 다릅니다</text><text x="36" y="88" font-size="20" font-weight="400" fill="#62625e">교육용 와이어프레임 · 이미지와 주변 텍스트, 클릭 범위를 함께 봅니다.</text><text x="36" y="139" font-size="25" font-weight="700" fill="#252525">01  상품 정보를 전달</text><rect x="36" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"/><rect x="48" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"/><rect x="48" y="178" width="328" height="38" rx="8" fill="#efefeb"/><circle cx="64" cy="197" r="3" fill="#b4b4ae"/><circle cx="78" cy="197" r="3" fill="#b4b4ae"/><circle cx="92" cy="197" r="3" fill="#b4b4ae"/><text x="119" y="204" font-size="15" font-weight="500" fill="#252525">상품 상세</text><text x="412" y="139" font-size="25" font-weight="700" fill="#252525">02  상품 상세로 이동</text><rect x="412" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"/><rect x="424" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"/><rect x="424" y="178" width="328" height="38" rx="8" fill="#efefeb"/><circle cx="440" cy="197" r="3" fill="#b4b4ae"/><circle cx="454" cy="197" r="3" fill="#b4b4ae"/><circle cx="468" cy="197" r="3" fill="#b4b4ae"/><text x="495" y="204" font-size="15" font-weight="500" fill="#252525">상품 목록</text><text x="788" y="139" font-size="25" font-weight="700" fill="#252525">03  본문 설명과 중복</text><rect x="788" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"/><rect x="800" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"/><rect x="800" y="178" width="328" height="38" rx="8" fill="#efefeb"/><circle cx="816" cy="197" r="3" fill="#b4b4ae"/><circle cx="830" cy="197" r="3" fill="#b4b4ae"/><circle cx="844" cy="197" r="3" fill="#b4b4ae"/><text x="871" y="204" font-size="15" font-weight="500" fill="#252525">스타일 안내</text><text x="66" y="252" font-size="23" font-weight="700" fill="#252525">클래식 재킷</text><rect x="66" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"/><g transform="translate(125 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"/><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"/><rect x="51" y="108" width="24" height="8" fill="#444642"/><rect x="115" y="108" width="24" height="8" fill="#444642"/><circle cx="100" cy="88" r="3" fill="#252525"/><circle cx="100" cy="112" r="3" fill="#252525"/></g><text x="66" y="538" font-size="19" font-weight="700" fill="#252525">상품 설명</text><text x="66" y="570" font-size="17" font-weight="400" fill="#62625e">기본 정보와 구매 옵션</text><text x="442" y="252" font-size="23" font-weight="700" fill="#252525">상품 둘러보기</text><rect x="442" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"/><g transform="translate(501 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"/><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"/><rect x="51" y="108" width="24" height="8" fill="#444642"/><rect x="115" y="108" width="24" height="8" fill="#444642"/><circle cx="100" cy="88" r="3" fill="#252525"/><circle cx="100" cy="112" r="3" fill="#252525"/></g><rect x="436" y="266" width="304" height="239" rx="10" fill="none" stroke="#252525" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M658 450 v-28 q0-14 12-14 q12 0 12 14 v18 q9-8 16 0 q8-7 16 2 q11-3 15 10 v22 q-1 25-19 35 h-34 l-23-28 q-10-16 1-20 q8-1 13 9" fill="#fff" stroke="#252525" stroke-width="3"/><text x="442" y="550" font-size="19" font-weight="700" fill="#252525">이미지만 있는 링크</text><text x="442" y="580" font-size="17" font-weight="400" fill="#62625e">선택하면 상품 상세로 이동</text><text x="818" y="252" font-size="23" font-weight="700" fill="#252525">클래식 재킷 안내</text><text x="818" y="286" font-size="18" font-weight="400" fill="#252525">색상: 짙은 회색</text><text x="818" y="318" font-size="18" font-weight="400" fill="#252525">앞면: 단추 여밈, 포켓 2개</text><text x="818" y="350" font-size="17" font-weight="400" fill="#62625e">같은 특징을 글로 설명합니다.</text><rect x="818" y="378" width="292" height="160" rx="8" fill="#f3f3f0" stroke="#b4b4ae"/><g transform="translate(904 391) scale(0.83)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"/><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"/><rect x="51" y="108" width="24" height="8" fill="#444642"/><rect x="115" y="108" width="24" height="8" fill="#444642"/><circle cx="100" cy="88" r="3" fill="#252525"/><circle cx="100" cy="112" r="3" fill="#252525"/></g><text x="818" y="578" font-size="17" font-weight="400" fill="#62625e">추가 정보·이동 기능 없음</text><text x="36" y="663" font-size="23" font-weight="700" fill="#252525">이미지의 정보가 필요</text><text x="36" y="699" font-size="18" font-weight="400" fill="#252525">본문만으로는 알 수 없는</text><text x="36" y="729" font-size="18" font-weight="400" fill="#252525">색상과 앞면 특징을 전달합니다.</text><rect x="36" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"/><text x="52" y="786" font-size="17" font-weight="700" fill="#252525">전달할 대안</text><text x="52" y="818" font-size="19" font-weight="400" fill="#252525">짙은 회색 재킷 앞면,</text><text x="52" y="847" font-size="19" font-weight="400" fill="#252525">단추 여밈과 포켓 두 개.</text><text x="412" y="663" font-size="23" font-weight="700" fill="#252525">이미지가 조작 이름을 제공</text><text x="412" y="699" font-size="18" font-weight="400" fill="#252525">보이는 물체의 이름보다</text><text x="412" y="729" font-size="18" font-weight="400" fill="#252525">이동 목적을 전달합니다.</text><rect x="412" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"/><text x="428" y="786" font-size="17" font-weight="700" fill="#252525">전달할 대안</text><text x="428" y="818" font-size="19" font-weight="400" fill="#252525">클래식 재킷 상세 보기</text><text x="788" y="663" font-size="23" font-weight="700" fill="#252525">본문이 같은 정보를 제공</text><text x="788" y="699" font-size="18" font-weight="400" fill="#252525">필요한 정보는 본문에 있고</text><text x="788" y="729" font-size="18" font-weight="400" fill="#252525">이미지는 반복하지 않습니다.</text><rect x="788" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"/><text x="804" y="786" font-size="17" font-weight="700" fill="#252525">전달할 대안</text><text x="804" y="818" font-size="19" font-weight="400" fill="#252525">alt=&quot;&quot;</text><text x="36" y="928" font-size="21" font-weight="400" fill="#252525">파일 설명을 고정해 쓰지 않고, 사용 위치에서 필요한 의미를 판단합니다.</text></g></svg>