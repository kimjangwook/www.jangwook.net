<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="672" viewBox="0 0 1120 672" role="img" aria-labelledby="title desc"><title id="title">비텍스트 콘텐츠의 멀티모달 평가와 재점검 흐름</title><desc id="desc">한국어 교육용 도식. 핵심 정보와 조건은 본문과 대체 텍스트로 함께 제공합니다.</desc><rect width="100%" height="100%" fill="#fafaf8"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="32" font-weight="700" fill="#252525"><tspan x="40" dy="0">AI 평가: 자료를 연결하고 같은 상태로 재점검</tspan></text><rect x="40" y="98" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="64" y="156" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">01</tspan></text><text x="146" y="138" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">같은 요소 ID로 자료 연결</tspan></text><text x="146" y="177" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">이미지 · DOM · 접근성 트리 · 주변 문맥</tspan></text><path d="M560 202 L560 226 M550 216 L560 226 L570 216" fill="none" stroke="#62625e" stroke-width="3"/><rect x="40" y="228" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="64" y="286" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">02</tspan></text><text x="146" y="268" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">목적과 현재 대안 비교</tspan></text><text x="146" y="307" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">정보 누락 · 조작 이름 · 장식 처리 · 상세 설명</tspan></text><path d="M560 332 L560 356 M550 346 L560 356 L570 346" fill="none" stroke="#62625e" stroke-width="3"/><rect x="40" y="358" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="64" y="416" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">03</tspan></text><text x="146" y="398" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">근거와 함께 판정 기록</tspan></text><text x="146" y="437" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">충족 / 미충족 / 해당 없음 / 판단 유보</tspan></text><path d="M560 462 L560 486 M550 476 L560 486 L570 476" fill="none" stroke="#62625e" stroke-width="3"/><rect x="40" y="488" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="64" y="546" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">04</tspan></text><text x="146" y="528" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">개선 후 동일 조건 재점검</tspan></text><text x="146" y="567" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">같은 페이지 · 이용 목표 · 상태 · 요소</tspan></text><text x="40" y="635" font-size="23" font-weight="400" fill="#252525"><tspan x="40" dy="0">입력이 부족하거나 도구가 실패한 경우, 그 원인을 별도로 남깁니다.</tspan></text></g></svg>