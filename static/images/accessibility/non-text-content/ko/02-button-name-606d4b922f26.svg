<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="648" viewBox="0 0 1120 648" role="img" aria-labelledby="title desc"><title id="title">검색 버튼의 이름 제공 전후 비교</title><desc id="desc">한국어 교육용 도식. 핵심 정보와 조건은 본문과 대체 텍스트로 함께 제공합니다.</desc><rect width="100%" height="100%" fill="#fafaf8"/><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="34" font-weight="700" fill="#252525"><tspan x="40" dy="0">화면은 같아도, 버튼 이름은 다릅니다</tspan></text><rect x="40" y="95" width="500" height="465" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="64" y="142" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">수정 전</tspan></text><g transform="translate(234 165)"><rect width="104" height="80" rx="10" fill="#fff" stroke="#252525" stroke-width="3"/><circle cx="44" cy="32" r="16" fill="none" stroke="#252525" stroke-width="4"/><path d="M56 44 L72 60" stroke="#252525" stroke-width="5"/></g><text x="64" y="292" font-size="21" font-weight="400" fill="#252525"><tspan x="64" dy="0">&lt;button&gt;</tspan><tspan x="64" dy="36">  &lt;img alt=&quot;&quot;&gt;</tspan><tspan x="64" dy="36">&lt;/button&gt;</tspan></text><rect x="64" y="385" width="452" height="135" rx="12" fill="#fff" stroke="#b4b4ae"/><text x="84" y="428" font-size="22" font-weight="700" fill="#252525"><tspan x="84" dy="0">예상 접근성 트리</tspan></text><text x="84" y="475" font-size="29" font-weight="700" fill="#252525"><tspan x="84" dy="0">button · 이름 없음</tspan></text><rect x="580" y="95" width="500" height="465" rx="12" fill="#f1f1ee" stroke="#b4b4ae"/><text x="604" y="142" font-size="28" font-weight="700" fill="#252525"><tspan x="604" dy="0">수정 후</tspan></text><g transform="translate(774 165)"><rect width="104" height="80" rx="10" fill="#fff" stroke="#252525" stroke-width="3"/><circle cx="44" cy="32" r="16" fill="none" stroke="#252525" stroke-width="4"/><path d="M56 44 L72 60" stroke="#252525" stroke-width="5"/></g><text x="604" y="292" font-size="21" font-weight="400" fill="#252525"><tspan x="604" dy="0">&lt;button aria-label=&quot;상품 검색&quot;&gt;</tspan><tspan x="604" dy="36">  &lt;img alt=&quot;&quot;&gt;</tspan><tspan x="604" dy="36">&lt;/button&gt;</tspan></text><rect x="604" y="385" width="452" height="135" rx="12" fill="#fff" stroke="#b4b4ae"/><text x="624" y="428" font-size="22" font-weight="700" fill="#252525"><tspan x="624" dy="0">예상 접근성 트리</tspan></text><text x="624" y="475" font-size="29" font-weight="700" fill="#252525"><tspan x="624" dy="0">button · 상품 검색</tspan></text><text x="40" y="608" font-size="24" font-weight="400" fill="#252525"><tspan x="40" dy="0">아이콘 설명을 숨겨도, 부모 버튼의 조작 목적은 남겨야 합니다.</tspan></text></g></svg>