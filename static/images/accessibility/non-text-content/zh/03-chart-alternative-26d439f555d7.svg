<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="666" viewBox="0 0 1120 666" role="img" aria-labelledby="title desc" lang="zh" xml:lang="zh" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">咨询量图表与详细数据替代内容的对比</title><desc id="desc">简体中文教学示意图。关键信息和条件也通过正文与替代文本一并提供。</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="34" font-weight="700" fill="#252525"><tspan x="40" dy="0">图表替代内容应传达数值与关系</tspan></text><rect x="40" y="95" width="505" height="410" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="140" font-size="25" font-weight="700" fill="#252525"><tspan x="64" dy="0">教学用图表 · 咨询量（次）</tspan></text><rect x="130" y="247" width="64" height="168" fill="#62625e"></rect><text x="128" y="227" font-size="24" font-weight="700" fill="#252525"><tspan x="128" dy="0">120</tspan></text><text x="126" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="126" dy="0">1月</tspan></text><rect x="275" y="303" width="64" height="112" fill="#62625e"></rect><text x="273" y="283" font-size="24" font-weight="700" fill="#252525"><tspan x="273" dy="0">80</tspan></text><text x="271" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="271" dy="0">2月</tspan></text><rect x="420" y="191" width="64" height="224" fill="#62625e"></rect><text x="418" y="171" font-size="24" font-weight="700" fill="#252525"><tspan x="418" dy="0">160</tspan></text><text x="416" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="416" dy="0">3月</tspan></text><rect x="575" y="95" width="505" height="410" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="599" y="140" font-size="25" font-weight="700" fill="#252525"><tspan x="599" dy="0">详细替代内容 · 提供相同数据</tspan></text><text x="615" y="205" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">1月     120次</tspan></text><line x1="599" y1="225" x2="1050" y2="225" stroke="#d5d5d0"></line><text x="615" y="271" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">2月       80次</tspan></text><line x1="599" y1="291" x2="1050" y2="291" stroke="#d5d5d0"></line><text x="615" y="337" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">3月     160次</tspan></text><line x1="599" y1="357" x2="1050" y2="357" stroke="#d5d5d0"></line><text x="599" y="440" font-size="24" font-weight="400" fill="#252525"><tspan x="599" dy="0">2月减少后，</tspan><tspan x="599" dy="36">3月有所增加。</tspan></text><rect x="40" y="535" width="1040" height="98" rx="12" fill="#fff" stroke="#b4b4ae"></rect><text x="64" y="575" font-size="23" font-weight="400" fill="#252525"><tspan x="64" dy="0">用简短 alt 识别图表，并指明详细说明和表格的位置。</tspan><tspan x="64" dy="36">只有能够确认数值、单位和趋势，才能进行比较。</tspan></text></g></svg>