<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="966" viewBox="0 0 1176 966" role="img" aria-labelledby="title desc" lang="zh" xml:lang="zh" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">商品信息、图像链接与正文重复图像的界面对比</title><desc id="desc">三个教学用线框图将同一张夹克图像用于不同角色。对比详情页中的颜色与正面信息、图像链接跳转到商品详情的目的，以及与正文中已有说明重复的图像。</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="36" y="52" font-size="31" font-weight="700" fill="#252525">同一张图像，在界面中的角色不同</text><text x="36" y="88" font-size="20" font-weight="400" fill="#62625e">教学用线框图 · 结合图像、周边文字与点击范围查看。</text><text x="36" y="139" font-size="25" font-weight="700" fill="#252525">01  传达商品信息</text><rect x="36" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="48" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="48" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="64" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="78" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="92" cy="197" r="3" fill="#b4b4ae"></circle><text x="119" y="204" font-size="15" font-weight="500" fill="#252525">商品详情</text><text x="412" y="139" font-size="25" font-weight="700" fill="#252525">02  跳转到商品详情</text><rect x="412" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="424" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="424" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="440" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="454" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="468" cy="197" r="3" fill="#b4b4ae"></circle><text x="495" y="204" font-size="15" font-weight="500" fill="#252525">商品列表</text><text x="788" y="139" font-size="25" font-weight="700" fill="#252525">03  与正文说明重复</text><rect x="788" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="800" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="800" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="816" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="830" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="844" cy="197" r="3" fill="#b4b4ae"></circle><text x="871" y="204" font-size="15" font-weight="500" fill="#252525">款式指南</text><text x="66" y="252" font-size="23" font-weight="700" fill="#252525">经典夹克</text><rect x="66" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(125 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><text x="66" y="538" font-size="19" font-weight="700" fill="#252525">商品说明</text><text x="66" y="570" font-size="17" font-weight="400" fill="#62625e">基本信息与购买选项</text><text x="442" y="252" font-size="23" font-weight="700" fill="#252525">浏览商品</text><rect x="442" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(501 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><rect x="436" y="266" width="304" height="239" rx="10" fill="none" stroke="#252525" stroke-width="2.5" stroke-dasharray="7 5"></rect><path d="M658 450 v-28 q0-14 12-14 q12 0 12 14 v18 q9-8 16 0 q8-7 16 2 q11-3 15 10 v22 q-1 25-19 35 h-34 l-23-28 q-10-16 1-20 q8-1 13 9" fill="#fff" stroke="#252525" stroke-width="3"></path><text x="442" y="550" font-size="19" font-weight="700" fill="#252525">仅包含图像的链接</text><text x="442" y="580" font-size="17" font-weight="400" fill="#62625e">选择后进入商品详情</text><text x="818" y="252" font-size="23" font-weight="700" fill="#252525">经典夹克介绍</text><text x="818" y="286" font-size="18" font-weight="400" fill="#252525">颜色：深灰色</text><text x="818" y="318" font-size="18" font-weight="400" fill="#252525">正面：纽扣开合，2个口袋</text><text x="818" y="350" font-size="17" font-weight="400" fill="#62625e">以文字说明相同特征。</text><rect x="818" y="378" width="292" height="160" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(904 391) scale(0.83)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><text x="818" y="578" font-size="17" font-weight="400" fill="#62625e">无额外信息或跳转功能</text><text x="36" y="663" font-size="23" font-weight="700" fill="#252525">需要图像中的信息</text><text x="36" y="699" font-size="18" font-weight="400" fill="#252525">传达仅凭正文无法了解的</text><text x="36" y="729" font-size="18" font-weight="400" fill="#252525">颜色和正面特征。</text><rect x="36" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="52" y="786" font-size="17" font-weight="700" fill="#252525">应提供的替代内容</text><text x="52" y="818" font-size="19" font-weight="400" fill="#252525">深灰色夹克正面，</text><text x="52" y="847" font-size="19" font-weight="400" fill="#252525">纽扣开合，两个口袋。</text><text x="412" y="663" font-size="23" font-weight="700" fill="#252525">图像提供操作名称</text><text x="412" y="699" font-size="18" font-weight="400" fill="#252525">相比可见物体的名称，</text><text x="412" y="729" font-size="18" font-weight="400" fill="#252525">更应传达跳转目的。</text><rect x="412" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="428" y="786" font-size="17" font-weight="700" fill="#252525">应提供的替代内容</text><text x="428" y="818" font-size="19" font-weight="400" fill="#252525">查看经典夹克详情</text><text x="788" y="663" font-size="23" font-weight="700" fill="#252525">正文提供相同信息</text><text x="788" y="699" font-size="18" font-weight="400" fill="#252525">所需信息已在正文中，</text><text x="788" y="729" font-size="18" font-weight="400" fill="#252525">图像不再重复。</text><rect x="788" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="804" y="786" font-size="17" font-weight="700" fill="#252525">应提供的替代内容</text><text x="804" y="818" font-size="19" font-weight="400" fill="#252525">alt=""</text><text x="36" y="928" font-size="21" font-weight="400" fill="#252525">不要固定使用文件描述，而要判断使用位置所需的含义。</text></g></svg>