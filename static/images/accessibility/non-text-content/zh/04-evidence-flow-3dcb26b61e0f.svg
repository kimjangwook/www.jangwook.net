<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="672" viewBox="0 0 1120 672" role="img" aria-labelledby="title desc" lang="zh" xml:lang="zh" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">非文本内容的多模态评估与复查流程</title><desc id="desc">简体中文教学示意图。关键信息和条件也通过正文与替代文本一并提供。</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="32" font-weight="700" fill="#252525"><tspan x="40" dy="0">AI 评估：关联资料，在相同状态下复查</tspan></text><rect x="40" y="98" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="156" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">01</tspan></text><text x="146" y="138" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">以同一元素 ID 关联资料</tspan></text><text x="146" y="177" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">图像 · DOM · 无障碍树 · 周边上下文</tspan></text><path d="M560 202 L560 226 M550 216 L560 226 L570 216" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="228" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="286" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">02</tspan></text><text x="146" y="268" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">比较目的与当前替代内容</tspan></text><text x="146" y="307" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">信息遗漏 · 操作名称 · 装饰处理 · 详细说明</tspan></text><path d="M560 332 L560 356 M550 346 L560 356 L570 346" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="358" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="416" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">03</tspan></text><text x="146" y="398" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">连同依据记录判定</tspan></text><text x="146" y="437" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">满足 / 不满足 / 不适用 / 暂无法判定</tspan></text><path d="M560 462 L560 486 M550 476 L560 486 L570 476" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="488" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="546" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">04</tspan></text><text x="146" y="528" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">改进后在相同条件下复查</tspan></text><text x="146" y="567" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">相同页面 · 使用目标 · 状态 · 元素</tspan></text><text x="40" y="635" font-size="23" font-weight="400" fill="#252525"><tspan x="40" dy="0">如果输入不足或工具失败，请另行记录原因。</tspan></text></g></svg>