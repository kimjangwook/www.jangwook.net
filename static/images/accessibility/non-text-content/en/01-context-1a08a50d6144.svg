<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="966" viewBox="0 0 1176 966" role="img" aria-labelledby="title desc" lang="en" xml:lang="en" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">Screen comparison: product information, an image link, and an image redundant with body text</title><desc id="desc">Three teaching wireframes use the same jacket image in different roles. They compare color and front details on a product detail page, an image link’s purpose of opening product details, and an image that duplicates a description already provided in the body text.</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="36" y="52" font-size="31" font-weight="700" fill="#252525">Same image, different roles</text><text x="36" y="88" font-size="20" font-weight="400" fill="#62625e">Teaching wireframes · Check images, nearby text, and clickable areas together.</text><text x="36" y="139" font-size="25" font-weight="700" fill="#252525">01  Convey product details</text><rect x="36" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="48" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="48" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="64" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="78" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="92" cy="197" r="3" fill="#b4b4ae"></circle><text x="119" y="204" font-size="15" font-weight="500" fill="#252525">Product details</text><text x="412" y="139" font-size="25" font-weight="700" fill="#252525">02  Open product details</text><rect x="412" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="424" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="424" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="440" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="454" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="468" cy="197" r="3" fill="#b4b4ae"></circle><text x="495" y="204" font-size="15" font-weight="500" fill="#252525">Product listing</text><text x="788" y="139" font-size="25" font-weight="700" fill="#252525">03  Repeat body text</text><rect x="788" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="800" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="800" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="816" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="830" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="844" cy="197" r="3" fill="#b4b4ae"></circle><text x="871" y="204" font-size="15" font-weight="500" fill="#252525">Style guide</text><text x="66" y="252" font-size="23" font-weight="700" fill="#252525">Classic jacket</text><rect x="66" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(125 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><text x="66" y="538" font-size="19" font-weight="700" fill="#252525">Product description</text><text x="66" y="570" font-size="17" font-weight="400" fill="#62625e">Basics and purchase options</text><text x="442" y="252" font-size="23" font-weight="700" fill="#252525">Browse products</text><rect x="442" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(501 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><rect x="436" y="266" width="304" height="239" rx="10" fill="none" stroke="#252525" stroke-width="2.5" stroke-dasharray="7 5"></rect><path d="M658 450 v-28 q0-14 12-14 q12 0 12 14 v18 q9-8 16 0 q8-7 16 2 q11-3 15 10 v22 q-1 25-19 35 h-34 l-23-28 q-10-16 1-20 q8-1 13 9" fill="#fff" stroke="#252525" stroke-width="3"></path><text x="442" y="550" font-size="19" font-weight="700" fill="#252525">Image-only link</text><text x="442" y="580" font-size="17" font-weight="400" fill="#62625e">Select to open product details</text><text x="818" y="252" font-size="23" font-weight="700" fill="#252525">Classic jacket guide</text><text x="818" y="286" font-size="18" font-weight="400" fill="#252525">Color: dark gray</text><text x="818" y="318" font-size="18" font-weight="400" fill="#252525">Front: buttons, 2 pockets</text><text x="818" y="350" font-size="17" font-weight="400" fill="#62625e">Text describes these features.</text><rect x="818" y="378" width="292" height="160" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(904 391) scale(0.83)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><text x="818" y="578" font-size="17" font-weight="400" fill="#62625e">No extra info or navigation</text><text x="36" y="663" font-size="23" font-weight="700" fill="#252525">Image information is needed</text><text x="36" y="699" font-size="18" font-weight="400" fill="#252525">Convey color and front details</text><text x="36" y="729" font-size="18" font-weight="400" fill="#252525">not available in the body text.</text><rect x="36" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="52" y="786" font-size="17" font-weight="700" fill="#252525">Alternative to provide</text><text x="52" y="818" font-size="19" font-weight="400" fill="#252525">Front of a dark gray jacket,</text><text x="52" y="847" font-size="19" font-weight="400" fill="#252525">button closure and two pockets.</text><text x="412" y="663" font-size="23" font-weight="700" fill="#252525">Image names the control</text><text x="412" y="699" font-size="18" font-weight="400" fill="#252525">Convey the destination purpose,</text><text x="412" y="729" font-size="18" font-weight="400" fill="#252525">not just the object’s name.</text><rect x="412" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="428" y="786" font-size="17" font-weight="700" fill="#252525">Alternative to provide</text><text x="428" y="818" font-size="19" font-weight="400" fill="#252525">View classic jacket details</text><text x="788" y="663" font-size="23" font-weight="700" fill="#252525">Body text gives the same info</text><text x="788" y="699" font-size="18" font-weight="400" fill="#252525">Needed information is in text;</text><text x="788" y="729" font-size="18" font-weight="400" fill="#252525">the image does not repeat it.</text><rect x="788" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="804" y="786" font-size="17" font-weight="700" fill="#252525">Alternative to provide</text><text x="804" y="818" font-size="19" font-weight="400" fill="#252525">alt=""</text><text x="36" y="928" font-size="21" font-weight="400" fill="#252525">Do not reuse a fixed file description; assess the meaning needed at each use.</text></g></svg>