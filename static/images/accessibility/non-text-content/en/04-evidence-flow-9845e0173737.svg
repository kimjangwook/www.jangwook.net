<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="672" viewBox="0 0 1120 672" role="img" aria-labelledby="title desc" lang="en" xml:lang="en" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">Multimodal evaluation and retesting flow for non-text content</title><desc id="desc">English-language teaching diagram. Essential information and conditions are also provided in the body text and alternative text.</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="32" font-weight="700" fill="#252525"><tspan x="40" dy="0">AI evaluation: link evidence and retest the same state</tspan></text><rect x="40" y="98" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="156" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">01</tspan></text><text x="146" y="138" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">Link data by the same element ID</tspan></text><text x="146" y="177" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">Image · DOM · AX tree · Context</tspan></text><path d="M560 202 L560 226 M550 216 L560 226 L570 216" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="228" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="286" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">02</tspan></text><text x="146" y="268" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">Compare purpose and alternative</tspan></text><text x="146" y="307" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">Missing info · Control name · Decoration · Detailed description</tspan></text><path d="M560 332 L560 356 M550 346 L560 356 L570 346" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="358" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="416" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">03</tspan></text><text x="146" y="398" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">Record decision with evidence</tspan></text><text x="146" y="437" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">Pass / Fail / N/A / Inconclusive</tspan></text><path d="M560 462 L560 486 M550 476 L560 486 L570 476" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="488" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="546" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">04</tspan></text><text x="146" y="528" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">Fix, then retest same conditions</tspan></text><text x="146" y="567" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">Same page · Goal · State · Element</tspan></text><text x="40" y="635" font-size="23" font-weight="400" fill="#252525"><tspan x="40" dy="0">If input is insufficient or a tool fails, record the cause separately.</tspan></text></g></svg>