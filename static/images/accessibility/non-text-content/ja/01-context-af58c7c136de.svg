<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="966" viewBox="0 0 1176 966" role="img" aria-labelledby="title desc" lang="ja" xml:lang="ja" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">商品情報、画像リンク、本文と重複する画像の画面比較</title><desc id="desc">3つの教育用ワイヤーフレームで、同じジャケット画像を異なる役割で使用しています。詳細ページの色と正面の情報、画像リンクの商品詳細への移動目的、本文ですでに提供した説明と重複する画像を比較します。</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="36" y="52" font-size="31" font-weight="700" fill="#252525">同じ画像でも、画面内の役割は異なります</text><text x="36" y="88" font-size="20" font-weight="400" fill="#62625e">教育用ワイヤーフレーム · 画像と周囲のテキスト、クリック範囲を併せて見ます。</text><text x="36" y="139" font-size="25" font-weight="700" fill="#252525">01  商品情報を伝える</text><rect x="36" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="48" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="48" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="64" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="78" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="92" cy="197" r="3" fill="#b4b4ae"></circle><text x="119" y="204" font-size="15" font-weight="500" fill="#252525">商品詳細</text><text x="412" y="139" font-size="25" font-weight="700" fill="#252525">02  商品詳細へ移動</text><rect x="412" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="424" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="424" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="440" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="454" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="468" cy="197" r="3" fill="#b4b4ae"></circle><text x="495" y="204" font-size="15" font-weight="500" fill="#252525">商品一覧</text><text x="788" y="139" font-size="25" font-weight="700" fill="#252525">03  本文の説明と重複</text><rect x="788" y="164" width="352" height="460" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="800" y="178" width="328" height="432" rx="8" fill="#fff" stroke="#b4b4ae"></rect><rect x="800" y="178" width="328" height="38" rx="8" fill="#efefeb"></rect><circle cx="816" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="830" cy="197" r="3" fill="#b4b4ae"></circle><circle cx="844" cy="197" r="3" fill="#b4b4ae"></circle><text x="871" y="204" font-size="15" font-weight="500" fill="#252525">スタイルガイド</text><text x="66" y="252" font-size="23" font-weight="700" fill="#252525">クラシックジャケット</text><rect x="66" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(125 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><text x="66" y="538" font-size="19" font-weight="700" fill="#252525">商品説明</text><text x="66" y="570" font-size="17" font-weight="400" fill="#62625e">基本情報と購入オプション</text><text x="442" y="252" font-size="23" font-weight="700" fill="#252525">商品を見る</text><rect x="442" y="272" width="292" height="227" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(501 305) scale(0.95)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><rect x="436" y="266" width="304" height="239" rx="10" fill="none" stroke="#252525" stroke-width="2.5" stroke-dasharray="7 5"></rect><path d="M658 450 v-28 q0-14 12-14 q12 0 12 14 v18 q9-8 16 0 q8-7 16 2 q11-3 15 10 v22 q-1 25-19 35 h-34 l-23-28 q-10-16 1-20 q8-1 13 9" fill="#fff" stroke="#252525" stroke-width="3"></path><text x="442" y="550" font-size="19" font-weight="700" fill="#252525">画像のみのリンク</text><text x="442" y="580" font-size="17" font-weight="400" fill="#62625e">選択すると商品詳細へ移動</text><text x="818" y="252" font-size="23" font-weight="700" fill="#252525">クラシックジャケットの案内</text><text x="818" y="286" font-size="18" font-weight="400" fill="#252525">色：濃いグレー</text><text x="818" y="318" font-size="18" font-weight="400" fill="#252525">正面：ボタン留め、ポケット2つ</text><text x="818" y="350" font-size="17" font-weight="400" fill="#62625e">同じ特徴を文章で説明しています。</text><rect x="818" y="378" width="292" height="160" rx="8" fill="#f3f3f0" stroke="#b4b4ae"></rect><g transform="translate(904 391) scale(0.83)"><path d="M45 0 L0 25 L18 65 L40 48 L40 155 L150 155 L150 48 L172 65 L190 25 L145 0 L120 18 L70 18 Z" fill="#777975" stroke="#252525" stroke-width="3"></path><path d="M70 18 L95 68 L120 18 M95 68 L95 155" fill="none" stroke="#252525" stroke-width="3"></path><rect x="51" y="108" width="24" height="8" fill="#444642"></rect><rect x="115" y="108" width="24" height="8" fill="#444642"></rect><circle cx="100" cy="88" r="3" fill="#252525"></circle><circle cx="100" cy="112" r="3" fill="#252525"></circle></g><text x="818" y="578" font-size="17" font-weight="400" fill="#62625e">追加情報・移動機能なし</text><text x="36" y="663" font-size="23" font-weight="700" fill="#252525">画像の情報が必要</text><text x="36" y="699" font-size="18" font-weight="400" fill="#252525">本文だけでは分からない</text><text x="36" y="729" font-size="18" font-weight="400" fill="#252525">色と正面の特徴を伝えます。</text><rect x="36" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="52" y="786" font-size="17" font-weight="700" fill="#252525">提供する代替</text><text x="52" y="818" font-size="19" font-weight="400" fill="#252525">濃いグレーのジャケットの正面。</text><text x="52" y="847" font-size="19" font-weight="400" fill="#252525">ボタン留めとポケット2つ。</text><text x="412" y="663" font-size="23" font-weight="700" fill="#252525">画像が操作名を提供</text><text x="412" y="699" font-size="18" font-weight="400" fill="#252525">見えている物の名前より</text><text x="412" y="729" font-size="18" font-weight="400" fill="#252525">移動の目的を伝えます。</text><rect x="412" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="428" y="786" font-size="17" font-weight="700" fill="#252525">提供する代替</text><text x="428" y="818" font-size="19" font-weight="400" fill="#252525">クラシックジャケットの詳細を見る</text><text x="788" y="663" font-size="23" font-weight="700" fill="#252525">本文が同じ情報を提供</text><text x="788" y="699" font-size="18" font-weight="400" fill="#252525">必要な情報は本文にあり</text><text x="788" y="729" font-size="18" font-weight="400" fill="#252525">画像では繰り返しません。</text><rect x="788" y="753" width="352" height="128" rx="8" fill="#fff" stroke="#b4b4ae"></rect><text x="804" y="786" font-size="17" font-weight="700" fill="#252525">提供する代替</text><text x="804" y="818" font-size="19" font-weight="400" fill="#252525">alt=""</text><text x="36" y="928" font-size="21" font-weight="400" fill="#252525">ファイルの説明を固定して使わず、使用箇所で必要な意味を判断します。</text></g></svg>