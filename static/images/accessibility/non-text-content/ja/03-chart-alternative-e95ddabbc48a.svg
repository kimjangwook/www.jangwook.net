<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="666" viewBox="0 0 1120 666" role="img" aria-labelledby="title desc" lang="ja" xml:lang="ja" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">問い合わせ数のグラフと詳細データによる代替の比較</title><desc id="desc">日本語の教育用の図です。重要な情報と条件は、本文と代替テキストでも提供しています。</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="34" font-weight="700" fill="#252525"><tspan x="40" dy="0">グラフの代替は、値と関係を伝えます</tspan></text><rect x="40" y="95" width="505" height="410" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="140" font-size="25" font-weight="700" fill="#252525"><tspan x="64" dy="0">教育用グラフ · 問い合わせ数（件）</tspan></text><rect x="130" y="247" width="64" height="168" fill="#62625e"></rect><text x="128" y="227" font-size="24" font-weight="700" fill="#252525"><tspan x="128" dy="0">120</tspan></text><text x="126" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="126" dy="0">1月</tspan></text><rect x="275" y="303" width="64" height="112" fill="#62625e"></rect><text x="273" y="283" font-size="24" font-weight="700" fill="#252525"><tspan x="273" dy="0">80</tspan></text><text x="271" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="271" dy="0">2月</tspan></text><rect x="420" y="191" width="64" height="224" fill="#62625e"></rect><text x="418" y="171" font-size="24" font-weight="700" fill="#252525"><tspan x="418" dy="0">160</tspan></text><text x="416" y="458" font-size="24" font-weight="400" fill="#252525"><tspan x="416" dy="0">3月</tspan></text><rect x="575" y="95" width="505" height="410" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="599" y="140" font-size="25" font-weight="700" fill="#252525"><tspan x="599" dy="0">詳細な代替 · 同じデータを提供</tspan></text><text x="615" y="205" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">1月     120件</tspan></text><line x1="599" y1="225" x2="1050" y2="225" stroke="#d5d5d0"></line><text x="615" y="271" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">2月       80件</tspan></text><line x1="599" y1="291" x2="1050" y2="291" stroke="#d5d5d0"></line><text x="615" y="337" font-size="30" font-weight="700" fill="#252525"><tspan x="615" dy="0">3月     160件</tspan></text><line x1="599" y1="357" x2="1050" y2="357" stroke="#d5d5d0"></line><text x="599" y="440" font-size="24" font-weight="400" fill="#252525"><tspan x="599" dy="0">2月に減少した後</tspan><tspan x="599" dy="36">3月に増加しました。</tspan></text><rect x="40" y="535" width="1040" height="98" rx="12" fill="#fff" stroke="#b4b4ae"></rect><text x="64" y="575" font-size="23" font-weight="400" fill="#252525"><tspan x="64" dy="0">短いaltでグラフを識別し、詳細な説明と表の場所を案内します。</tspan><tspan x="64" dy="36">比較作業には、値・単位・傾向を確認できることが必要です。</tspan></text></g></svg>