<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="648" viewBox="0 0 1120 648" role="img" aria-labelledby="title desc" lang="ja" xml:lang="ja" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">検索ボタンの名前を提供する前後の比較</title><desc id="desc">日本語の教育用の図です。重要な情報と条件は、本文と代替テキストでも提供しています。</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="34" font-weight="700" fill="#252525"><tspan x="40" dy="0">画面は同じでも、ボタンの名前は異なります</tspan></text><rect x="40" y="95" width="500" height="465" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="142" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">修正前</tspan></text><g transform="translate(234 165)"><rect width="104" height="80" rx="10" fill="#fff" stroke="#252525" stroke-width="3"></rect><circle cx="44" cy="32" r="16" fill="none" stroke="#252525" stroke-width="4"></circle><path d="M56 44 L72 60" stroke="#252525" stroke-width="5"></path></g><text x="64" y="292" font-size="21" font-weight="400" fill="#252525"><tspan x="64" dy="0">&lt;button&gt;</tspan><tspan x="64" dy="36">  &lt;img alt=""&gt;</tspan><tspan x="64" dy="36">&lt;/button&gt;</tspan></text><rect x="64" y="385" width="452" height="135" rx="12" fill="#fff" stroke="#b4b4ae"></rect><text x="84" y="428" font-size="22" font-weight="700" fill="#252525"><tspan x="84" dy="0">想定されるアクセシビリティツリー</tspan></text><text x="84" y="475" font-size="29" font-weight="700" fill="#252525"><tspan x="84" dy="0">button · 名前なし</tspan></text><rect x="580" y="95" width="500" height="465" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="604" y="142" font-size="28" font-weight="700" fill="#252525"><tspan x="604" dy="0">修正後</tspan></text><g transform="translate(774 165)"><rect width="104" height="80" rx="10" fill="#fff" stroke="#252525" stroke-width="3"></rect><circle cx="44" cy="32" r="16" fill="none" stroke="#252525" stroke-width="4"></circle><path d="M56 44 L72 60" stroke="#252525" stroke-width="5"></path></g><text x="604" y="292" font-size="21" font-weight="400" fill="#252525"><tspan x="604" dy="0">&lt;button aria-label="商品検索"&gt;</tspan><tspan x="604" dy="36">  &lt;img alt=""&gt;</tspan><tspan x="604" dy="36">&lt;/button&gt;</tspan></text><rect x="604" y="385" width="452" height="135" rx="12" fill="#fff" stroke="#b4b4ae"></rect><text x="624" y="428" font-size="22" font-weight="700" fill="#252525"><tspan x="624" dy="0">想定されるアクセシビリティツリー</tspan></text><text x="624" y="475" font-size="29" font-weight="700" fill="#252525"><tspan x="624" dy="0">button · 商品検索</tspan></text><text x="40" y="608" font-size="24" font-weight="400" fill="#252525"><tspan x="40" dy="0">アイコンの説明を隠しても、親ボタンの操作目的は残す必要があります。</tspan></text></g></svg>