<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="672" viewBox="0 0 1120 672" role="img" aria-labelledby="title desc" lang="ja" xml:lang="ja" style="font-family: &quot;Noto Sans KR Variable&quot;, sans-serif;"><title id="title">非テキストコンテンツのマルチモーダル評価と再確認の流れ</title><desc id="desc">日本語の教育用の図です。重要な情報と条件は、本文と代替テキストでも提供しています。</desc><rect width="100%" height="100%" fill="#fafaf8"></rect><g font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif"><text x="40" y="58" font-size="32" font-weight="700" fill="#252525"><tspan x="40" dy="0">AI評価：資料を関連付け、同じ状態で再確認</tspan></text><rect x="40" y="98" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="156" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">01</tspan></text><text x="146" y="138" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">同じ要素IDで資料を関連付け</tspan></text><text x="146" y="177" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">画像 · DOM · アクセシビリティツリー · 周囲の文脈</tspan></text><path d="M560 202 L560 226 M550 216 L560 226 L570 216" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="228" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="286" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">02</tspan></text><text x="146" y="268" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">目的と現在の代替を比較</tspan></text><text x="146" y="307" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">情報の欠落 · 操作名 · 装飾処理 · 詳細な説明</tspan></text><path d="M560 332 L560 356 M550 346 L560 356 L570 346" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="358" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="416" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">03</tspan></text><text x="146" y="398" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">根拠とともに判定を記録</tspan></text><text x="146" y="437" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">満たす / 満たさない / 該当なし / 判断保留</tspan></text><path d="M560 462 L560 486 M550 476 L560 486 L570 476" fill="none" stroke="#62625e" stroke-width="3"></path><rect x="40" y="488" width="1040" height="104" rx="12" fill="#f1f1ee" stroke="#b4b4ae"></rect><text x="64" y="546" font-size="28" font-weight="700" fill="#252525"><tspan x="64" dy="0">04</tspan></text><text x="146" y="528" font-size="27" font-weight="700" fill="#252525"><tspan x="146" dy="0">改善後、同じ条件で再確認</tspan></text><text x="146" y="567" font-size="23" font-weight="400" fill="#252525"><tspan x="146" dy="0">同じページ · 利用目標 · 状態 · 要素</tspan></text><text x="40" y="635" font-size="23" font-weight="400" fill="#252525"><tspan x="40" dy="0">入力が不足している場合やツールが失敗した場合は、その原因を別途残します。</tspan></text></g></svg>