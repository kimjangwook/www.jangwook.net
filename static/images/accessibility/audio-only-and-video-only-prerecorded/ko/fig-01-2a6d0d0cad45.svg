<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="898" viewBox="0 0 1000 898" role="img" aria-labelledby="title desc"><title id="title">매체 제목과 내용 대안의 차이</title><desc id="desc">음성 플레이어와 전체 전사문, 무음 영상의 세 화면과 짧은 요약 및 충분한 단계별 설명을 비교합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="898" fill="#fafaf8"/><g font-family="'Noto Sans KR Variable','Apple SD Gothic Neo',sans-serif"><text x="32" y="42" font-size="25" font-weight="700" fill="#252525">음성 안내: 제목 다음에는 전체 내용을 읽는 경로</text><rect x="32" y="66" width="435" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,103 H467" stroke="#bbbcb5"/><text x="46" y="92" font-size="18" font-weight="600" fill="#252525">지원 페이지 · 계정 복구 안내</text><text x="52" y="133" font-size="22" font-weight="400" fill="#252525">음성 안내  00:00 / 00:30</text><text x="52" y="167" font-size="22" font-weight="400" fill="#252525">▷ ━━━━━━━━━━━</text><text x="52" y="201" font-size="22" font-weight="400" fill="#252525">계정 복구 안내 전체 전사문 ↗</text><rect x="513" y="66" width="455" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M513,103 H968" stroke="#bbbcb5"/><text x="527" y="92" font-size="18" font-weight="600" fill="#252525">같은 안내의 전체 전사문</text><text x="533" y="130" font-size="19" font-weight="400" fill="#252525">진행자: 기존 기기에 로그인해야 합니다.</text><text x="533" y="163" font-size="19" font-weight="400" fill="#252525">질문자: 이전 코드는 어떻게 되나요?</text><text x="533" y="196" font-size="19" font-weight="400" fill="#252525">담당자: 이전 코드는 사용할 수 없습니다.</text><text x="533" y="229" font-size="19" font-weight="400" fill="#252525">[확인음] 발급이 끝났음을 알립니다.</text><path d="M474,169 L506,169" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="326" font-size="25" font-weight="700" fill="#252525">무음 영상: 세 화면에서 전달한 단계와 결과</text><rect x="32" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,388 H321" stroke="#bbbcb5"/><text x="46" y="377" font-size="18" font-weight="600" fill="#252525">01 설정</text><text x="47" y="423" font-size="18" font-weight="400" fill="#252525">계정 메뉴</text><text x="47" y="454" font-size="18" font-weight="400" fill="#252525">[ 설정 ]</text><path d="M329,441 L346,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M355,388 H644" stroke="#bbbcb5"/><text x="369" y="377" font-size="18" font-weight="600" fill="#252525">02 보안</text><text x="370" y="423" font-size="18" font-weight="400" fill="#252525">설정 화면</text><text x="370" y="454" font-size="18" font-weight="400" fill="#252525">[ 보안 ]</text><path d="M652,441 L669,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="678" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M678,388 H967" stroke="#bbbcb5"/><text x="692" y="377" font-size="18" font-weight="600" fill="#252525">03 코드 발급</text><text x="693" y="423" font-size="18" font-weight="400" fill="#252525">[ 복구 코드 발급 ]</text><text x="693" y="454" font-size="18" font-weight="400" fill="#252525">기존 코드 무효화 경고</text><text x="693" y="485" font-size="18" font-weight="400" fill="#252525">발급 완료 · 새 코드</text><rect x="32" y="557" width="936" height="89" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="590" font-size="21" font-weight="700" fill="#252525">한 줄 요약</text><text x="51" y="621" font-size="21" font-weight="400" fill="#252525">“설정에서 코드를 발급하세요.”  →  메뉴·경고·완료 확인 누락</text><rect x="32" y="670" width="936" height="154" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="705" font-size="21" font-weight="700" fill="#252525">단계별 설명</text><text x="51" y="738" font-size="21" font-weight="400" fill="#252525">설정 → 보안 → 복구 코드 발급 → 새 코드 저장</text><text x="51" y="772" font-size="21" font-weight="400" fill="#252525">발급 시 이전 코드를 쓸 수 없다는 경고와 완료 화면도 설명합니다.</text><text x="32" y="864" font-size="18" font-weight="400" fill="#555550">교육용 가상 화면 · 재생 버튼의 이름만으로 내용은 전달되지 않습니다.</text></g></svg>