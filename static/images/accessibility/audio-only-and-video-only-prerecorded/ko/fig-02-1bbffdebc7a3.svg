<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815" role="img" aria-labelledby="title desc"><title id="title">사전 제작 음성 및 영상의 적용 분기</title><desc id="desc">사전 제작 여부, 원본의 매체 유형, 텍스트 대안 예외, 원본과 대안의 정보 비교 순서입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="815" fill="#fafaf8"/><g font-family="'Noto Sans KR Variable','Apple SD Gothic Neo',sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#252525">1.2.1 적용 분기</text><text x="32" y="80" font-size="20" font-weight="400" fill="#555550">원본과 실제 제공된 내용을 확인한 뒤 대안의 품질을 비교합니다.</text><rect x="32" y="108" width="936" height="94" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="52" y="147" font-size="24" font-weight="700" fill="#252525">① 사전 제작 자료인가요?</text><text x="52" y="181" font-size="20" font-weight="400" fill="#252525">실제 라이브는 다른 기준으로 이동 · 다시보기는 사전 제작으로 검토</text><path d="M500,210 L500,236" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="247" width="936" height="161" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="286" font-size="24" font-weight="700" fill="#252525">② 원본의 정보 구성</text><text x="52" y="324" font-size="21" font-weight="400" fill="#252525">음성 전용 → 전사문 등 시간 기반 매체 대안</text><text x="52" y="356" font-size="21" font-weight="400" fill="#252525">영상 전용 → 텍스트 대안 또는 충분한 음성 설명</text><text x="52" y="388" font-size="21" font-weight="400" fill="#252525">영상과 음성 함께 → 자막·화면 해설 등 해당 기준 확인</text><rect x="32" y="435" width="936" height="138" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="474" font-size="24" font-weight="700" fill="#252525">③ 기존 텍스트의 대안이라는 예외</text><text x="52" y="512" font-size="21" font-weight="400" fill="#252525">텍스트에 없는 추가 정보가 없음 + 대안 관계를 명확히 표시</text><text x="52" y="544" font-size="21" font-weight="400" fill="#252525">둘 다 증거로 확인 → 예외 이유 기록 / 하나라도 미확인 → 유보</text><rect x="32" y="599" width="936" height="138" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="638" font-size="24" font-weight="700" fill="#252525">④ 실제 대안과 같은 정보인지 비교</text><text x="52" y="676" font-size="21" font-weight="400" fill="#252525">정보·조건·화자·동작·순서·결과를 원본과 연결</text><text x="52" y="708" font-size="21" font-weight="400" fill="#252525">자료를 처리하지 못함 → 오류·차단·미검토를 별도 기록</text><path d="M500,415 L500,429" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500,581 L500,593" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="777" font-size="20" font-weight="600" fill="#252525">범위 밖 ≠ 예외 ≠ 자료 부족 · 세 이유를 “충족”으로 바꾸지 않습니다.</text></g></svg>