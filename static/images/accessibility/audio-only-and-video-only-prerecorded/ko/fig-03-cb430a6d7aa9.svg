<svg xmlns="http://www.w3.org/2000/svg" lang="ko" xml:lang="ko" width="1160" height="1140" viewBox="0 0 1160 1140" role="img" aria-labelledby="title desc"><title id="title">요약만 읽으면, 무엇을 놓치게 될까요?</title><desc id="desc">복구 코드 안내의 다섯 화면을 비교합니다. 짧은 요약에는 설정과 발급만 언급되고 보안 메뉴, 이전 코드 무효화 경고, 안전한 저장, 완료 결과가 빠집니다. 충분한 설명은 각 화면의 동작과 경고 및 결과를 전달합니다.</desc><rect width="1160" height="1140" fill="#fafaf8"/><g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><text x="32" y="48" font-size="28" font-weight="700" fill="#252525">요약만 읽으면, 무엇을 놓치게 될까요?</text><text x="32" y="84" font-size="21" font-weight="400" fill="#252525">왼쪽 화면의 정보를 두 가지 설명과 비교해 보세요.</text><rect x="32" y="108" width="1096" height="68" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="50" y="151" font-size="23" font-weight="700" fill="#252525">짧은 요약: “설정에서 복구 코드를 발급하세요.”</text><text x="32" y="218" font-size="20" font-weight="700" fill="#252525">영상에 보이는 화면</text><text x="395" y="218" font-size="20" font-weight="700" fill="#252525">짧은 요약에서 얻는 정보</text><text x="746" y="218" font-size="20" font-weight="700" fill="#252525">충분한 설명에서 얻는 정보</text><rect x="32" y="240" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="240" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="240" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="270" font-size="20" font-weight="700" fill="#252525">01  계정 설정</text><path d="M32,285h330" stroke="#bbbcb5"/><rect x="47" y="308" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="338" font-size="18" font-weight="400" fill="#252525">보안 열기</text><text x="411" y="282" font-size="21" font-weight="700" fill="#252525">△ 설정만 언급</text><text x="411" y="322" font-size="18" font-weight="400" fill="#252525">어느 메뉴로 가나요?</text><text x="762" y="272" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="306" font-size="19" font-weight="400" fill="#252525">설정에서 보안을 엽니다.</text><path d="M371,305h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="396" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="396" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="396" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="426" font-size="20" font-weight="700" fill="#252525">02  보안</text><path d="M32,441h330" stroke="#bbbcb5"/><rect x="47" y="464" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="494" font-size="18" font-weight="400" fill="#252525">복구 코드 발급</text><text x="411" y="438" font-size="21" font-weight="700" fill="#252525">△ 발급만 언급</text><text x="411" y="478" font-size="18" font-weight="400" fill="#252525">어느 항목을 선택하나요?</text><text x="762" y="428" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="462" font-size="19" font-weight="400" fill="#252525">복구 코드 발급을 선택합니다.</text><path d="M371,461h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="552" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="552" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="552" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="582" font-size="20" font-weight="700" fill="#252525">03  계속하기 전에</text><path d="M32,597h330" stroke="#bbbcb5"/><rect x="47" y="620" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="650" font-size="18" font-weight="400" fill="#252525">이전 코드 사용 불가</text><text x="411" y="594" font-size="21" font-weight="700" fill="#252525">✕ 경고 누락</text><text x="411" y="634" font-size="18" font-weight="400" fill="#252525">기존 코드도 쓸 수 있나요?</text><text x="762" y="584" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="618" font-size="19" font-weight="400" fill="#252525">새 코드 발급 시 이전 코드는</text><text x="762" y="648" font-size="19" font-weight="400" fill="#252525">더 이상 사용할 수 없습니다.</text><path d="M371,617h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="708" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="708" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="708" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="738" font-size="20" font-weight="700" fill="#252525">04  발급 완료</text><path d="M32,753h330" stroke="#bbbcb5"/><rect x="47" y="776" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="806" font-size="18" font-weight="400" fill="#252525">새 코드 안전하게 저장</text><text x="411" y="750" font-size="21" font-weight="700" fill="#252525">✕ 저장 안내 누락</text><text x="411" y="790" font-size="18" font-weight="400" fill="#252525">새 코드는 어떻게 보관하나요?</text><text x="762" y="740" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="774" font-size="19" font-weight="400" fill="#252525">새 코드를 안전한 곳에 저장하고</text><text x="762" y="804" font-size="19" font-weight="400" fill="#252525">저장 확인을 선택합니다.</text><path d="M371,773h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="864" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="864" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="864" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="894" font-size="20" font-weight="700" fill="#252525">05  완료</text><path d="M32,909h330" stroke="#bbbcb5"/><rect x="47" y="932" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="962" font-size="18" font-weight="400" fill="#252525">이전 코드 무효 · 설정으로</text><text x="411" y="906" font-size="21" font-weight="700" fill="#252525">✕ 완료 결과 누락</text><text x="411" y="946" font-size="18" font-weight="400" fill="#252525">정말 발급이 끝났나요?</text><text x="762" y="896" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="930" font-size="19" font-weight="400" fill="#252525">새 코드가 준비되었고 이전 코드는</text><text x="762" y="960" font-size="19" font-weight="400" fill="#252525">무효입니다. 설정으로 돌아갑니다.</text><path d="M371,929h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><text x="32" y="1059" font-size="20" font-weight="700" fill="#252525">대안은 주제만 요약하는 것이 아니라, 같은 행동과 판단에 필요한 정보를 전달합니다.</text><text x="32" y="1101" font-size="18" font-weight="400" fill="#555550">교육용 가상 화면 비교입니다. 실제 모델의 측정 결과가 아닙니다.</text></g></svg>