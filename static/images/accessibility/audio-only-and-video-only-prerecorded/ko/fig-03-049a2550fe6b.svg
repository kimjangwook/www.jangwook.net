<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="863" viewBox="0 0 1000 863" role="img" aria-labelledby="title desc"><title id="title">짧은 요약에서 빠진 정보를 시간 구간별로 비교</title><desc id="desc">설정, 보안, 발급 경고, 완료 확인을 네 행으로 비교합니다. 한 줄 요약에는 세 정보가 누락되지만 단계별 설명에는 대응 문장이 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="863" fill="#fafaf8"/><g font-family="'Noto Sans KR Variable','Apple SD Gothic Neo',sans-serif"><text x="32" y="44" font-size="27" font-weight="700" fill="#252525">원본의 시간 구간을 대안의 문장에 연결하기</text><text x="32" y="79" font-size="20" font-weight="400" fill="#555550">가상 무음 복구 코드 영상 · 요약의 누락과 충분한 대안을 직접 비교</text><rect x="32" y="104" width="320" height="60" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="47" y="142" font-size="21" font-weight="700" fill="#252525">원본에서 관찰한 정보</text><rect x="376" y="104" width="257" height="60" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="391" y="142" font-size="21" font-weight="700" fill="#252525">한 줄 요약</text><rect x="657" y="104" width="311" height="60" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="672" y="142" font-size="21" font-weight="700" fill="#252525">단계별 텍스트 대안</text><rect x="32" y="183" width="320" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="376" y="183" width="257" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="657" y="183" width="311" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="48" y="212" font-size="18" font-weight="600" fill="#555550">00:00-00:04</text><text x="48" y="248" font-size="21" font-weight="400" fill="#252525">설정 메뉴를 엽니다.</text><rect x="396" y="225" width="148" height="35" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="407" y="249" font-size="17" font-weight="600" fill="#252525">동등 설정 언급</text><text x="674" y="216" font-size="20" font-weight="400" fill="#252525">설정을 엽니다.</text><rect x="32" y="317" width="320" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="376" y="317" width="257" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="657" y="317" width="311" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="48" y="346" font-size="18" font-weight="600" fill="#555550">00:04-00:08</text><text x="48" y="382" font-size="21" font-weight="400" fill="#252525">보안을 선택합니다.</text><rect x="396" y="359" width="148" height="35" rx="8" fill="white" stroke="#252525" stroke-width="2"/><text x="407" y="383" font-size="17" font-weight="600" fill="#252525">누락 메뉴 누락</text><text x="674" y="350" font-size="20" font-weight="400" fill="#252525">보안을 선택합니다.</text><rect x="32" y="451" width="320" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="376" y="451" width="257" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="657" y="451" width="311" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="48" y="480" font-size="18" font-weight="600" fill="#555550">00:08-00:14</text><text x="48" y="516" font-size="21" font-weight="400" fill="#252525">복구 코드 발급 선택</text><text x="48" y="546" font-size="21" font-weight="400" fill="#252525">기존 코드 무효화 경고</text><rect x="396" y="493" width="148" height="35" rx="8" fill="white" stroke="#252525" stroke-width="2"/><text x="407" y="517" font-size="17" font-weight="600" fill="#252525">누락 경고 누락</text><text x="674" y="484" font-size="20" font-weight="400" fill="#252525">발급을 선택합니다.</text><text x="674" y="514" font-size="20" font-weight="400" fill="#252525">이전 코드가 무효가</text><text x="674" y="544" font-size="20" font-weight="400" fill="#252525">된다는 경고를 설명합니다.</text><rect x="32" y="585" width="320" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="376" y="585" width="257" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><rect x="657" y="585" width="311" height="120" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="48" y="614" font-size="18" font-weight="600" fill="#555550">00:14-00:20</text><text x="48" y="650" font-size="21" font-weight="400" fill="#252525">새 코드를 저장합니다.</text><text x="48" y="680" font-size="21" font-weight="400" fill="#252525">발급 완료 표시 확인</text><rect x="396" y="627" width="148" height="35" rx="8" fill="white" stroke="#252525" stroke-width="2"/><text x="407" y="651" font-size="17" font-weight="600" fill="#252525">누락 결과 누락</text><text x="674" y="618" font-size="20" font-weight="400" fill="#252525">새 코드를 저장하고</text><text x="674" y="648" font-size="20" font-weight="400" fill="#252525">발급 완료를 확인합니다.</text><rect x="32" y="738" width="936" height="93" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="776" font-size="20" font-weight="400" fill="#252525">글자 일치율보다 이용자가 같은 판단을 할 수 있는 정보를 확인합니다.</text><text x="51" y="808" font-size="19" font-weight="400" fill="#252525">시간 코드는 다시 확인할 위치입니다. 이 도식은 실제 모델 결과가 아닙니다.</text></g></svg>