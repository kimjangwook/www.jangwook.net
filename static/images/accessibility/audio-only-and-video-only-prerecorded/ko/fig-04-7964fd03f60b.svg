<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="811" viewBox="0 0 1000 811" role="img" aria-labelledby="title desc"><title id="title">원본과 대안의 독립 대조 및 재점검 흐름</title><desc id="desc">최종 원본의 독립 관찰과 페이지에 제공된 대안을 분리해서 수집합니다. 증거 ID와 정보 위치를 대조하고 수정 후 같은 조건으로 다시 확인합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="811" fill="#fafaf8"/><g font-family="'Noto Sans KR Variable','Apple SD Gothic Neo',sans-serif"><text x="32" y="44" font-size="27" font-weight="700" fill="#252525">원본 관찰과 대안 문서를 독립적으로 비교</text><text x="32" y="81" font-size="20" font-weight="400" fill="#555550">같은 전사문을 양쪽에 복사하면 원본에서 빠진 정보를 찾기 어렵습니다.</text><rect x="32" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="149" font-size="23" font-weight="700" fill="#252525">최종 원본 · MEDIA-01</text><text x="51" y="184" font-size="20" font-weight="400" fill="#252525">파일·판본·길이·처리한 구간</text><rect x="537" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="556" y="149" font-size="23" font-weight="700" fill="#252525">실제 대안 · ALT-01</text><text x="556" y="184" font-size="20" font-weight="400" fill="#252525">페이지의 본문 또는 음성 설명</text><path d="M247,222 L247,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,222 L751,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="304" font-size="23" font-weight="700" fill="#252525">독립 관찰 · OBS-01</text><text x="51" y="341" font-size="20" font-weight="400" fill="#252525">발화·화자·화면·동작·결과</text><text x="51" y="370" font-size="20" font-weight="400" fill="#252525">각 정보의 시간 위치와 증거 ID</text><text x="51" y="399" font-size="20" font-weight="400" fill="#252525">미검토 구간도 함께 기록</text><rect x="537" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="556" y="304" font-size="23" font-weight="700" fill="#252525">대안에서 확인한 위치</text><text x="556" y="341" font-size="20" font-weight="400" fill="#252525">문단·시간 구간·대안 판본</text><text x="556" y="370" font-size="20" font-weight="400" fill="#252525">원본과 연결되는 관계와 제공 위치</text><text x="556" y="399" font-size="20" font-weight="400" fill="#252525">아직 열지 못한 자료는 표시</text><path d="M247,424 L247,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,424 L751,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247,449 H500 M751,449 H500 V481" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="493" width="936" height="135" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="532" font-size="24" font-weight="700" fill="#252525">정보 단위 대조</text><text x="51" y="567" font-size="21" font-weight="400" fill="#252525">원본 위치 ↔ 대안 위치 · 동등 / 누락 / 왜곡 / 불확실</text><text x="51" y="599" font-size="21" font-weight="400" fill="#252525">적용 조건과 다른 대안 경로 확인 → 근거 있는 판정</text><path d="M500,636 L500,667" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="679" width="936" height="100" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="718" font-size="23" font-weight="600" fill="#252525">수정 → 같은 원본 구간 재확인 → 실제 페이지의 최신 대안 확인</text><text x="51" y="755" font-size="20" font-weight="400" fill="#252525">원본을 처리하지 못했다면 원본 전체를 확인한 것처럼 판정하지 않습니다.</text></g></svg>