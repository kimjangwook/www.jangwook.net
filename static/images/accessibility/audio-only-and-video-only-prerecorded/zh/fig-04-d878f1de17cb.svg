<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="1000" height="811" viewBox="0 0 1000 811" role="img" aria-labelledby="title desc"><title id="title">原始内容与替代内容的独立对照及复查流程</title><desc id="desc">分别采集最终原始内容的独立观察记录与页面提供的替代内容。对照证据 ID 和信息位置，修改后在相同条件下重新确认。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="811" fill="#fafaf8"/><g font-family="'PingFang SC','Noto Sans SC',sans-serif"><text x="32" y="44" font-size="27" font-weight="700" fill="#252525">独立比较原始内容观察记录与替代文档</text><text x="32" y="81" font-size="20" font-weight="400" fill="#555550">将同一文字稿复制到两侧，会难以发现原始内容中被遗漏的信息。</text><rect x="32" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="149" font-size="23" font-weight="700" fill="#252525">最终原始内容 · MEDIA-01</text><text x="51" y="184" font-size="20" font-weight="400" fill="#252525">文件、版本、时长、已处理区间</text><rect x="537" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="556" y="149" font-size="23" font-weight="700" fill="#252525">实际替代内容 · ALT-01</text><text x="556" y="184" font-size="20" font-weight="400" fill="#252525">页面正文或音频描述</text><path d="M247,222 L247,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,222 L751,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="304" font-size="23" font-weight="700" fill="#252525">独立观察 · OBS-01</text><text x="51" y="341" font-size="20" font-weight="400" fill="#252525">话语、说话人、画面、动作、结果</text><text x="51" y="370" font-size="20" font-weight="400" fill="#252525">各项信息的时间位置与证据 ID</text><text x="51" y="399" font-size="20" font-weight="400" fill="#252525">同时记录未检查区间</text><rect x="537" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="556" y="304" font-size="23" font-weight="700" fill="#252525">在替代内容中确认的位置</text><text x="556" y="341" font-size="20" font-weight="400" fill="#252525">段落、时间区间、替代内容版本</text><text x="556" y="370" font-size="20" font-weight="400" fill="#252525">与原始内容的关联关系及提供位置</text><text x="556" y="399" font-size="20" font-weight="400" fill="#252525">标明尚未打开的资料</text><path d="M247,424 L247,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,424 L751,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247,449 H500 M751,449 H500 V481" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="493" width="936" height="135" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="532" font-size="24" font-weight="700" fill="#252525">信息单元对照</text><text x="51" y="567" font-size="21" font-weight="400" fill="#252525">原始位置 ↔ 替代位置 · 等同 / 遗漏 / 失真 / 不确定</text><text x="51" y="599" font-size="21" font-weight="400" fill="#252525">确认适用条件及其他替代途径 → 作出有依据的判定</text><path d="M500,636 L500,667" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="679" width="936" height="100" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="718" font-size="23" font-weight="600" fill="#252525">修改 → 复查相同原始区间 → 确认实际页面上的最新替代内容</text><text x="51" y="755" font-size="20" font-weight="400" fill="#252525">如果无法处理原始内容，不得作出仿佛已检查完整原始内容的判定。</text></g></svg>