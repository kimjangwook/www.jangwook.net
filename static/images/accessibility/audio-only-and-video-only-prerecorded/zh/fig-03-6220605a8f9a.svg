<svg xmlns="http://www.w3.org/2000/svg" lang="zh" xml:lang="zh" width="1160" height="1140" viewBox="0 0 1160 1140" role="img" aria-labelledby="title desc"><title id="title">只看简短摘要，会遗漏什么？</title><desc id="desc">对比恢复代码指南的五个画面。简短摘要只提到设置和生成，遗漏安全菜单、旧代码失效警告、安全保存和完成结果。充分说明传达每个画面的操作、警告和结果。</desc><rect width="1160" height="1140" fill="#fafaf8"/><g font-family="'PingFang SC', 'Noto Sans SC', sans-serif"><text x="32" y="48" font-size="28" font-weight="700" fill="#252525">只看简短摘要，会遗漏什么？</text><text x="32" y="84" font-size="21" font-weight="400" fill="#252525">以左侧画面为依据，比较两种说明传达的信息。</text><rect x="32" y="108" width="1096" height="68" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="50" y="151" font-size="23" font-weight="700" fill="#252525">简短摘要：“在设置中生成恢复代码。”</text><text x="32" y="218" font-size="20" font-weight="700" fill="#252525">视频中的画面</text><text x="395" y="218" font-size="20" font-weight="700" fill="#252525">简短摘要提供的信息</text><text x="746" y="218" font-size="20" font-weight="700" fill="#252525">充分说明提供的信息</text><rect x="32" y="240" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="240" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="240" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="270" font-size="20" font-weight="700" fill="#252525">01  账户设置</text><path d="M32,285h330" stroke="#bbbcb5"/><rect x="47" y="308" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="338" font-size="18" font-weight="400" fill="#252525">打开安全设置</text><text x="411" y="282" font-size="21" font-weight="700" fill="#252525">△ 仅提到设置</text><text x="411" y="322" font-size="18" font-weight="400" fill="#252525">应该打开哪个菜单？</text><text x="762" y="272" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="306" font-size="19" font-weight="400" fill="#252525">在设置中打开安全设置。</text><path d="M371,305h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="396" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="396" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="396" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="426" font-size="20" font-weight="700" fill="#252525">02  安全设置</text><path d="M32,441h330" stroke="#bbbcb5"/><rect x="47" y="464" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="494" font-size="18" font-weight="400" fill="#252525">生成恢复代码</text><text x="411" y="438" font-size="21" font-weight="700" fill="#252525">△ 仅提到生成</text><text x="411" y="478" font-size="18" font-weight="400" fill="#252525">应该选择哪个选项？</text><text x="762" y="428" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="462" font-size="19" font-weight="400" fill="#252525">选择生成恢复代码。</text><path d="M371,461h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="552" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="552" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="552" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="582" font-size="20" font-weight="700" fill="#252525">03  继续之前</text><path d="M32,597h330" stroke="#bbbcb5"/><rect x="47" y="620" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="650" font-size="18" font-weight="400" fill="#252525">旧代码将无法使用</text><text x="411" y="594" font-size="21" font-weight="700" fill="#252525">✕ 遗漏警告</text><text x="411" y="634" font-size="18" font-weight="400" fill="#252525">旧代码还能使用吗？</text><text x="762" y="584" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="618" font-size="19" font-weight="400" fill="#252525">生成新代码后，</text><text x="762" y="648" font-size="19" font-weight="400" fill="#252525">旧代码将无法继续使用。</text><path d="M371,617h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="708" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="708" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="708" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="738" font-size="20" font-weight="700" fill="#252525">04  代码已生成</text><path d="M32,753h330" stroke="#bbbcb5"/><rect x="47" y="776" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="806" font-size="18" font-weight="400" fill="#252525">安全保存新代码</text><text x="411" y="750" font-size="21" font-weight="700" fill="#252525">✕ 遗漏保存说明</text><text x="411" y="790" font-size="18" font-weight="400" fill="#252525">应该如何保存新代码？</text><text x="762" y="740" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="774" font-size="19" font-weight="400" fill="#252525">将新代码保存在安全的地方，</text><text x="762" y="804" font-size="19" font-weight="400" fill="#252525">然后确认已保存。</text><path d="M371,773h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="864" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="864" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="864" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="894" font-size="20" font-weight="700" fill="#252525">05  完成</text><path d="M32,909h330" stroke="#bbbcb5"/><rect x="47" y="932" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="962" font-size="18" font-weight="400" fill="#252525">旧代码失效 · 返回设置</text><text x="411" y="906" font-size="21" font-weight="700" fill="#252525">✕ 遗漏完成结果</text><text x="411" y="946" font-size="18" font-weight="400" fill="#252525">代码真的生成完了吗？</text><text x="762" y="896" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="930" font-size="19" font-weight="400" fill="#252525">新代码已准备好，旧代码已失效。</text><text x="762" y="960" font-size="19" font-weight="400" fill="#252525">返回设置。</text><path d="M371,929h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><text x="32" y="1059" font-size="20" font-weight="700" fill="#252525">替代内容应传达采取相同行动、作出相同判断所需的信息。</text><text x="32" y="1101" font-size="18" font-weight="400" fill="#555550">这是虚构的教学画面对比，并非实际模型的测量结果。</text></g></svg>