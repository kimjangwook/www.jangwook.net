<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="1000" height="898" viewBox="0 0 1000 898" role="img" aria-labelledby="title desc"><title id="title">媒体标题与内容替代方案的区别</title><desc id="desc">对比音频播放器与完整文字稿，以及无声视频的三个画面、简短摘要和充分的分步说明。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="898" fill="#fafaf8"/><g font-family="'PingFang SC','Noto Sans SC',sans-serif"><text x="32" y="42" font-size="25" font-weight="700" fill="#252525">音频指南：标题之后应有阅读完整内容的途径</text><rect x="32" y="66" width="435" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,103 H467" stroke="#bbbcb5"/><text x="46" y="92" font-size="18" font-weight="600" fill="#252525">支持页面 · 账户恢复指南</text><text x="52" y="133" font-size="22" font-weight="400" fill="#252525">音频指南  00:00 / 00:30</text><text x="52" y="167" font-size="22" font-weight="400" fill="#252525">▷ ━━━━━━━━━━━</text><text x="52" y="201" font-size="22" font-weight="400" fill="#252525">账户恢复指南完整文字稿 ↗</text><rect x="513" y="66" width="455" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M513,103 H968" stroke="#bbbcb5"/><text x="527" y="92" font-size="18" font-weight="600" fill="#252525">同一指南的完整文字稿</text><text x="533" y="130" font-size="19" font-weight="400" fill="#252525">主持人：必须在原有设备上登录。</text><text x="533" y="163" font-size="19" font-weight="400" fill="#252525">提问者：之前的代码会怎样？</text><text x="533" y="196" font-size="19" font-weight="400" fill="#252525">工作人员：之前的代码将无法使用。</text><text x="533" y="229" font-size="19" font-weight="400" fill="#252525">[确认提示音] 表示生成已完成。</text><path d="M474,169 L506,169" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="326" font-size="25" font-weight="700" fill="#252525">无声视频：三个画面传达的步骤与结果</text><rect x="32" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,388 H321" stroke="#bbbcb5"/><text x="46" y="377" font-size="18" font-weight="600" fill="#252525">01 设置</text><text x="47" y="423" font-size="18" font-weight="400" fill="#252525">账户菜单</text><text x="47" y="454" font-size="18" font-weight="400" fill="#252525">[ 设置 ]</text><path d="M329,441 L346,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M355,388 H644" stroke="#bbbcb5"/><text x="369" y="377" font-size="18" font-weight="600" fill="#252525">02 安全</text><text x="370" y="423" font-size="18" font-weight="400" fill="#252525">设置页面</text><text x="370" y="454" font-size="18" font-weight="400" fill="#252525">[ 安全 ]</text><path d="M652,441 L669,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="678" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M678,388 H967" stroke="#bbbcb5"/><text x="692" y="377" font-size="18" font-weight="600" fill="#252525">03 生成代码</text><text x="693" y="423" font-size="18" font-weight="400" fill="#252525">[ 生成恢复代码 ]</text><text x="693" y="454" font-size="18" font-weight="400" fill="#252525">原有代码失效警告</text><text x="693" y="485" font-size="18" font-weight="400" fill="#252525">生成完成 · 新代码</text><rect x="32" y="557" width="936" height="89" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="590" font-size="21" font-weight="700" fill="#252525">一句话摘要</text><text x="51" y="621" font-size="21" font-weight="400" fill="#252525">“请在设置中生成代码。”  →  遗漏菜单、警告、完成确认</text><rect x="32" y="670" width="936" height="154" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="705" font-size="21" font-weight="700" fill="#252525">分步说明</text><text x="51" y="738" font-size="21" font-weight="400" fill="#252525">设置 → 安全 → 生成恢复代码 → 保存新代码</text><text x="51" y="772" font-size="21" font-weight="400" fill="#252525">还应说明生成后旧代码将无法使用的警告及完成画面。</text><text x="32" y="864" font-size="18" font-weight="400" fill="#555550">教学用虚构界面 · 仅凭播放按钮的名称无法传达内容。</text></g></svg>