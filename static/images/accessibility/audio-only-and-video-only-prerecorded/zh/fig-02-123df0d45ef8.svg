<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815" role="img" aria-labelledby="title desc"><title id="title">预录音频与视频的适用分支</title><desc id="desc">依次确认是否预录、原始内容的媒体类型、文本替代形式例外，再比较原始内容与替代内容的信息。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="815" fill="#fafaf8"/><g font-family="'PingFang SC','Noto Sans SC',sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#252525">1.2.1 适用分支</text><text x="32" y="80" font-size="20" font-weight="400" fill="#555550">确认原始内容与实际提供的内容后，再比较替代内容的质量。</text><rect x="32" y="108" width="936" height="94" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="52" y="147" font-size="24" font-weight="700" fill="#252525">① 是预录资料吗？</text><text x="52" y="181" font-size="20" font-weight="400" fill="#252525">实际直播转至其他标准 · 回放按预录媒体检查</text><path d="M500,210 L500,236" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="247" width="936" height="161" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="286" font-size="24" font-weight="700" fill="#252525">② 原始内容的信息构成</text><text x="52" y="324" font-size="21" font-weight="400" fill="#252525">纯音频 → 文字稿等时间媒体替代内容</text><text x="52" y="356" font-size="21" font-weight="400" fill="#252525">纯视频 → 文本替代内容或充分的音频描述</text><text x="52" y="388" font-size="21" font-weight="400" fill="#252525">视频与音频并存 → 检查字幕、音频描述等相应标准</text><rect x="32" y="435" width="936" height="138" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="474" font-size="24" font-weight="700" fill="#252525">③ 作为已有文本替代形式的例外</text><text x="52" y="512" font-size="21" font-weight="400" fill="#252525">没有文本之外的额外信息 + 明确标示替代关系</text><text x="52" y="544" font-size="21" font-weight="400" fill="#252525">两项均有证据确认 → 记录例外原因 / 任一项未确认 → 暂缓判断</text><rect x="32" y="599" width="936" height="138" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="638" font-size="24" font-weight="700" fill="#252525">④ 比较实际替代内容是否提供相同信息</text><text x="52" y="676" font-size="21" font-weight="400" fill="#252525">将信息、条件、说话人、动作、顺序、结果与原始内容关联</text><text x="52" y="708" font-size="21" font-weight="400" fill="#252525">无法处理资料 → 单独记录错误、受阻、未检查情况</text><path d="M500,415 L500,429" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500,581 L500,593" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="777" font-size="20" font-weight="600" fill="#252525">范围外 ≠ 例外 ≠ 资料不足 · 不将这三种原因改写为“满足”。</text></g></svg>