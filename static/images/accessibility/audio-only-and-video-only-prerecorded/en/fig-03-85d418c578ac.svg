<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" width="1160" height="1140" viewBox="0 0 1160 1140" role="img" aria-labelledby="title desc"><title id="title">What would a short summary leave out?</title><desc id="desc">Five recovery-code screens are compared. The summary mentions settings and generation but omits the security menu, old-code invalidation warning, safe storage and completion result. The sufficient description conveys each screen’s actions, warnings and results.</desc><rect width="1160" height="1140" fill="#fafaf8"/><g font-family="'Helvetica Neue', Arial, sans-serif"><text x="32" y="48" font-size="28" font-weight="700" fill="#252525">What would a short summary leave out?</text><text x="32" y="84" font-size="21" font-weight="400" fill="#252525">Compare the screen information with two kinds of description.</text><rect x="32" y="108" width="1096" height="68" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="50" y="151" font-size="23" font-weight="700" fill="#252525">Short summary: “Generate recovery codes in settings.”</text><text x="32" y="218" font-size="20" font-weight="700" fill="#252525">What the video shows</text><text x="395" y="218" font-size="20" font-weight="700" fill="#252525">What the summary tells you</text><text x="746" y="218" font-size="20" font-weight="700" fill="#252525">What a sufficient description tells you</text><rect x="32" y="240" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="240" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="240" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="270" font-size="20" font-weight="700" fill="#252525">01  Account settings</text><path d="M32,285h330" stroke="#bbbcb5"/><rect x="47" y="308" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="338" font-size="18" font-weight="400" fill="#252525">Open security</text><text x="411" y="282" font-size="21" font-weight="700" fill="#252525">△ Settings mentioned</text><text x="411" y="322" font-size="18" font-weight="400" fill="#252525">Which menu should I open?</text><text x="762" y="272" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="306" font-size="19" font-weight="400" fill="#252525">Open Security in settings.</text><path d="M371,305h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="396" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="396" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="396" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="426" font-size="20" font-weight="700" fill="#252525">02  Security</text><path d="M32,441h330" stroke="#bbbcb5"/><rect x="47" y="464" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="494" font-size="18" font-weight="400" fill="#252525">Generate recovery codes</text><text x="411" y="438" font-size="21" font-weight="700" fill="#252525">△ Generation mentioned</text><text x="411" y="478" font-size="18" font-weight="400" fill="#252525">Which item should I select?</text><text x="762" y="428" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="462" font-size="19" font-weight="400" fill="#252525">Select Generate recovery codes.</text><path d="M371,461h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="552" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="552" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="552" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="582" font-size="20" font-weight="700" fill="#252525">03  Before continuing</text><path d="M32,597h330" stroke="#bbbcb5"/><rect x="47" y="620" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="650" font-size="18" font-weight="400" fill="#252525">Old codes will stop working</text><text x="411" y="594" font-size="21" font-weight="700" fill="#252525">✕ Warning missing</text><text x="411" y="634" font-size="18" font-weight="400" fill="#252525">Can I still use the old codes?</text><text x="762" y="584" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="618" font-size="19" font-weight="400" fill="#252525">Generating new codes makes</text><text x="762" y="648" font-size="19" font-weight="400" fill="#252525">the old codes unusable.</text><path d="M371,617h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="708" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="708" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="708" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="738" font-size="20" font-weight="700" fill="#252525">04  Codes generated</text><path d="M32,753h330" stroke="#bbbcb5"/><rect x="47" y="776" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="806" font-size="18" font-weight="400" fill="#252525">Store the new codes safely</text><text x="411" y="750" font-size="21" font-weight="700" fill="#252525">✕ Storage guidance missing</text><text x="411" y="790" font-size="18" font-weight="400" fill="#252525">How should I store the new codes?</text><text x="762" y="740" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="774" font-size="19" font-weight="400" fill="#252525">Store the new codes safely,</text><text x="762" y="804" font-size="19" font-weight="400" fill="#252525">then confirm they are saved.</text><path d="M371,773h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="864" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="864" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="864" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="894" font-size="20" font-weight="700" fill="#252525">05  Done</text><path d="M32,909h330" stroke="#bbbcb5"/><rect x="47" y="932" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="962" font-size="17.4" font-weight="400" fill="#252525">Old codes invalid · Back to settings</text><text x="411" y="906" font-size="21" font-weight="700" fill="#252525">✕ Completion result missing</text><text x="411" y="946" font-size="18" font-weight="400" fill="#252525">Has generation actually finished?</text><text x="762" y="896" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="930" font-size="19" font-weight="400" fill="#252525">New codes are ready; old codes are</text><text x="762" y="960" font-size="19" font-weight="400" fill="#252525">invalid. Return to settings.</text><path d="M371,929h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><text x="32" y="1059" font-size="20" font-weight="700" fill="#252525">An alternative conveys the information needed for the same actions and decisions.</text><text x="32" y="1101" font-size="18" font-weight="400" fill="#555550">Fictional teaching screens, not measured model results.</text></g></svg>