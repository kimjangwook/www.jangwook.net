<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1000" height="898" viewBox="0 0 1000 898" role="img" aria-labelledby="title desc"><title id="title">The Difference Between a Media Title and a Content Alternative</title><desc id="desc">Compares an audio player and complete transcript, and three screens of a silent video with a short summary and a sufficient step-by-step description.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="898" fill="#fafaf8"/><g font-family="'Helvetica Neue',Arial,sans-serif"><text x="32" y="42" font-size="25" font-weight="700" fill="#252525">Audio guide: a path to read the full content after the title</text><rect x="32" y="66" width="435" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,103 H467" stroke="#bbbcb5"/><text x="46" y="92" font-size="18" font-weight="600" fill="#252525">Support page · Account recovery guide</text><text x="52" y="133" font-size="22" font-weight="400" fill="#252525">Audio guide  00:00 / 00:30</text><text x="52" y="167" font-size="22" font-weight="400" fill="#252525">▷ ━━━━━━━━━━━</text><text x="52" y="201" font-size="22" font-weight="400" fill="#252525">Complete transcript of the account recovery guide ↗</text><rect x="513" y="66" width="455" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M513,103 H968" stroke="#bbbcb5"/><text x="527" y="92" font-size="18" font-weight="600" fill="#252525">Complete transcript of the same guide</text><text x="533" y="130" font-size="19" font-weight="400" fill="#252525">Presenter: You must be logged in on an existing device.</text><text x="533" y="163" font-size="19" font-weight="400" fill="#252525">Questioner: What happens to the previous codes?</text><text x="533" y="196" font-size="19" font-weight="400" fill="#252525">Representative: The previous codes can no longer be used.</text><text x="533" y="229" font-size="19" font-weight="400" fill="#252525">[Confirmation tone] Indicates that generation is complete.</text><path d="M474,169 L506,169" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="326" font-size="25" font-weight="700" fill="#252525">Silent video: steps and results conveyed across three screens</text><rect x="32" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,388 H321" stroke="#bbbcb5"/><text x="46" y="377" font-size="18" font-weight="600" fill="#252525">01 Settings</text><text x="47" y="423" font-size="18" font-weight="400" fill="#252525">Account menu</text><text x="47" y="454" font-size="18" font-weight="400" fill="#252525">[ Settings ]</text><path d="M329,441 L346,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M355,388 H644" stroke="#bbbcb5"/><text x="369" y="377" font-size="18" font-weight="600" fill="#252525">02 Security</text><text x="370" y="423" font-size="18" font-weight="400" fill="#252525">Settings screen</text><text x="370" y="454" font-size="18" font-weight="400" fill="#252525">[ Security ]</text><path d="M652,441 L669,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="678" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M678,388 H967" stroke="#bbbcb5"/><text x="692" y="377" font-size="18" font-weight="600" fill="#252525">03 Generate codes</text><text x="693" y="423" font-size="18" font-weight="400" fill="#252525">[ Generate Recovery Codes ]</text><text x="693" y="454" font-size="18" font-weight="400" fill="#252525">Warning: existing codes become invalid</text><text x="693" y="485" font-size="18" font-weight="400" fill="#252525">Generation complete · New codes</text><rect x="32" y="557" width="936" height="89" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="590" font-size="21" font-weight="700" fill="#252525">One-line summary</text><text x="51" y="621" font-size="21" font-weight="400" fill="#252525">“Generate codes in Settings.”  →  Menus, warning, and completion check omitted</text><rect x="32" y="670" width="936" height="154" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="705" font-size="21" font-weight="700" fill="#252525">Step-by-step description</text><text x="51" y="738" font-size="21" font-weight="400" fill="#252525">Settings → Security → Generate Recovery Codes → Save New Codes</text><text x="51" y="772" font-size="21" font-weight="400" fill="#252525">Also describes the warning that previous codes cannot be used after generation, and the completion screen.</text><text x="32" y="864" font-size="18" font-weight="400" fill="#555550">Fictional educational interface · A play button&#x27;s name alone does not convey the content.</text></g></svg>