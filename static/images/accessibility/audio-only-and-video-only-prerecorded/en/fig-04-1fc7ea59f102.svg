<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1000" height="811" viewBox="0 0 1000 811" role="img" aria-labelledby="title desc"><title id="title">Independent Comparison and Retesting Flow for Originals and Alternatives</title><desc id="desc">Collect independent observations of the final original separately from the alternative provided on the page. Compare evidence IDs and information locations, then recheck under the same conditions after revisions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="811" fill="#fafaf8"/><g font-family="'Helvetica Neue',Arial,sans-serif"><text x="32" y="44" font-size="27" font-weight="700" fill="#252525">Compare original observations and alternative documents independently</text><text x="32" y="81" font-size="20" font-weight="400" fill="#555550">Copying the same transcript to both sides makes omissions from the original difficult to find.</text><rect x="32" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="149" font-size="23" font-weight="700" fill="#252525">Final original · MEDIA-01</text><text x="51" y="184" font-size="20" font-weight="400" fill="#252525">File, version, duration, and processed ranges</text><rect x="537" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="556" y="149" font-size="23" font-weight="700" fill="#252525">Actual alternative · ALT-01</text><text x="556" y="184" font-size="20" font-weight="400" fill="#252525">Page body text or audio description</text><path d="M247,222 L247,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,222 L751,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="304" font-size="23" font-weight="700" fill="#252525">Independent observation · OBS-01</text><text x="51" y="341" font-size="20" font-weight="400" fill="#252525">Speech, speakers, screens, actions, and results</text><text x="51" y="370" font-size="20" font-weight="400" fill="#252525">Time location and evidence ID for each piece of information</text><text x="51" y="399" font-size="20" font-weight="400" fill="#252525">Also record unreviewed ranges</text><rect x="537" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="556" y="304" font-size="23" font-weight="700" fill="#252525">Verified locations in the alternative</text><text x="556" y="341" font-size="20" font-weight="400" fill="#252525">Paragraphs, time ranges, and alternative version</text><text x="556" y="370" font-size="20" font-weight="400" fill="#252525">Relationship to the original and provision location</text><text x="556" y="399" font-size="20" font-weight="400" fill="#252525">Mark materials not yet opened</text><path d="M247,424 L247,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,424 L751,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247,449 H500 M751,449 H500 V481" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="493" width="936" height="135" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="532" font-size="24" font-weight="700" fill="#252525">Information-unit comparison</text><text x="51" y="567" font-size="21" font-weight="400" fill="#252525">Original location ↔ Alternative location · Equivalent / Missing / Inaccurate / Uncertain</text><text x="51" y="599" font-size="21" font-weight="400" fill="#252525">Check applicability and other alternative paths → Evidence-based decision</text><path d="M500,636 L500,667" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="679" width="936" height="100" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="718" font-size="23" font-weight="600" fill="#252525">Revise → Recheck the same original ranges → Check the latest alternative on the actual page</text><text x="51" y="755" font-size="20" font-weight="400" fill="#252525">If the original could not be processed, do not make a decision as though the entire original had been reviewed.</text></g></svg>