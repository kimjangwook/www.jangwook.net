<svg xmlns="http://www.w3.org/2000/svg" lang="ja" xml:lang="ja" width="1160" height="1140" viewBox="0 0 1160 1140" role="img" aria-labelledby="title desc"><title id="title">短い要約だけでは、何が抜け落ちるでしょうか？</title><desc id="desc">復旧コードの案内を5つの画面で比較します。短い要約は設定と発行だけに言及し、セキュリティのメニュー、以前のコードの無効化、安全な保存、完了結果を省いています。十分な説明は各画面の操作、警告、結果を伝えます。</desc><rect width="1160" height="1140" fill="#fafaf8"/><g font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif"><text x="32" y="48" font-size="28" font-weight="700" fill="#252525">短い要約だけでは、何が抜け落ちるでしょうか？</text><text x="32" y="84" font-size="21" font-weight="400" fill="#252525">左の画面の情報を、2種類の説明と比べてください。</text><rect x="32" y="108" width="1096" height="68" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="50" y="151" font-size="23" font-weight="700" fill="#252525">短い要約：「設定から復旧コードを発行してください。」</text><text x="32" y="218" font-size="20" font-weight="700" fill="#252525">動画に映る画面</text><text x="395" y="218" font-size="20" font-weight="700" fill="#252525">短い要約で得られる情報</text><text x="746" y="218" font-size="20" font-weight="700" fill="#252525">十分な説明で得られる情報</text><rect x="32" y="240" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="240" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="240" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="270" font-size="20" font-weight="700" fill="#252525">01  アカウント設定</text><path d="M32,285h330" stroke="#bbbcb5"/><rect x="47" y="308" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="338" font-size="18" font-weight="400" fill="#252525">セキュリティを開く</text><text x="411" y="282" font-size="21" font-weight="700" fill="#252525">△ 設定にだけ言及</text><text x="411" y="322" font-size="18" font-weight="400" fill="#252525">どのメニューを開きますか？</text><text x="762" y="272" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="306" font-size="19" font-weight="400" fill="#252525">設定からセキュリティを開きます。</text><path d="M371,305h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="396" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="396" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="396" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="426" font-size="20" font-weight="700" fill="#252525">02  セキュリティ</text><path d="M32,441h330" stroke="#bbbcb5"/><rect x="47" y="464" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="494" font-size="18" font-weight="400" fill="#252525">復旧コードを発行</text><text x="411" y="438" font-size="21" font-weight="700" fill="#252525">△ 発行にだけ言及</text><text x="411" y="478" font-size="18" font-weight="400" fill="#252525">どの項目を選びますか？</text><text x="762" y="428" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="462" font-size="19" font-weight="400" fill="#252525">復旧コードの発行を選びます。</text><path d="M371,461h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="552" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="552" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="552" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="582" font-size="20" font-weight="700" fill="#252525">03  続行する前に</text><path d="M32,597h330" stroke="#bbbcb5"/><rect x="47" y="620" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="650" font-size="18" font-weight="400" fill="#252525">以前のコードは使用不可</text><text x="411" y="594" font-size="21" font-weight="700" fill="#252525">✕ 警告がない</text><text x="411" y="634" font-size="18" font-weight="400" fill="#252525">以前のコードも使えますか？</text><text x="762" y="584" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="618" font-size="19" font-weight="400" fill="#252525">新しいコードを発行すると、</text><text x="762" y="648" font-size="19" font-weight="400" fill="#252525">以前のコードは使えなくなります。</text><path d="M371,617h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="708" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="708" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="708" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="738" font-size="20" font-weight="700" fill="#252525">04  発行完了</text><path d="M32,753h330" stroke="#bbbcb5"/><rect x="47" y="776" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="806" font-size="18" font-weight="400" fill="#252525">新しいコードを安全に保存</text><text x="411" y="750" font-size="21" font-weight="700" fill="#252525">✕ 保存方法がない</text><text x="411" y="790" font-size="17.9" font-weight="400" fill="#252525">新しいコードはどう保管しますか？</text><text x="762" y="740" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="774" font-size="19" font-weight="400" fill="#252525">新しいコードを安全な場所に保存し、</text><text x="762" y="804" font-size="19" font-weight="400" fill="#252525">保存したことを確認します。</text><path d="M371,773h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><rect x="32" y="864" width="330" height="136" rx="6" fill="#fff" stroke="#bbbcb5"/><rect x="395" y="864" width="318" height="136" rx="6" fill="#fafaf8" stroke="#bbbcb5"/><rect x="746" y="864" width="382" height="136" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="47" y="894" font-size="20" font-weight="700" fill="#252525">05  完了</text><path d="M32,909h330" stroke="#bbbcb5"/><rect x="47" y="932" width="300" height="46" rx="6" fill="#f1f1ee" stroke="#bbbcb5"/><text x="57" y="962" font-size="18" font-weight="400" fill="#252525">以前のコードは無効・設定へ</text><text x="411" y="906" font-size="21" font-weight="700" fill="#252525">✕ 完了結果がない</text><text x="411" y="946" font-size="18" font-weight="400" fill="#252525">本当に発行が終わりましたか？</text><text x="762" y="896" font-size="24" font-weight="700" fill="#252525">✓</text><text x="762" y="930" font-size="19" font-weight="400" fill="#252525">新しいコードは準備済みで、以前の</text><text x="762" y="960" font-size="19" font-weight="400" fill="#252525">コードは無効です。設定に戻ります。</text><path d="M371,929h14m-5,-5l5,5l-5,5" stroke="#555550" fill="none"/><text x="32" y="1059" font-size="20" font-weight="700" fill="#252525">代替は、同じ行動や判断に必要な情報を伝えます。</text><text x="32" y="1101" font-size="18" font-weight="400" fill="#555550">学習用の架空の画面です。実際のモデルの測定結果ではありません。</text></g></svg>