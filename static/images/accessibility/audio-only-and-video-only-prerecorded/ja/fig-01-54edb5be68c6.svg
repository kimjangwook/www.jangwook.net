<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1000" height="898" viewBox="0 0 1000 898" role="img" aria-labelledby="title desc"><title id="title">メディアの見出しと内容の代替の違い</title><desc id="desc">音声プレーヤーと全文の書き起こし、無音動画の3つの画面と短い要約、および十分な手順ごとの説明を比較します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="898" fill="#fafaf8"/><g font-family="'Hiragino Sans','Noto Sans JP',sans-serif"><text x="32" y="42" font-size="25" font-weight="700" fill="#252525">音声案内：見出しの次には全内容を読む経路</text><rect x="32" y="66" width="435" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,103 H467" stroke="#bbbcb5"/><text x="46" y="92" font-size="18" font-weight="600" fill="#252525">サポートページ · アカウント復旧の案内</text><text x="52" y="133" font-size="22" font-weight="400" fill="#252525">音声案内  00:00 / 00:30</text><text x="52" y="167" font-size="22" font-weight="400" fill="#252525">▷ ━━━━━━━━━━━</text><text x="52" y="201" font-size="22" font-weight="400" fill="#252525">アカウント復旧案内の全文書き起こし ↗</text><rect x="513" y="66" width="455" height="210" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M513,103 H968" stroke="#bbbcb5"/><text x="527" y="92" font-size="18" font-weight="600" fill="#252525">同じ案内の全文書き起こし</text><text x="533" y="130" font-size="19" font-weight="400" fill="#252525">進行役：既存の端末にログインする必要があります。</text><text x="533" y="163" font-size="19" font-weight="400" fill="#252525">質問者：以前のコードはどうなりますか？</text><text x="533" y="196" font-size="19" font-weight="400" fill="#252525">担当者：以前のコードは使用できません。</text><text x="533" y="229" font-size="19" font-weight="400" fill="#252525">［確認音］発行が完了したことを知らせます。</text><path d="M474,169 L506,169" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="326" font-size="25" font-weight="700" fill="#252525">無音動画：3つの画面で伝えた手順と結果</text><rect x="32" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M32,388 H321" stroke="#bbbcb5"/><text x="46" y="377" font-size="18" font-weight="600" fill="#252525">01 設定</text><text x="47" y="423" font-size="18" font-weight="400" fill="#252525">アカウントメニュー</text><text x="47" y="454" font-size="18" font-weight="400" fill="#252525">[ 設定 ]</text><path d="M329,441 L346,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M355,388 H644" stroke="#bbbcb5"/><text x="369" y="377" font-size="18" font-weight="600" fill="#252525">02 セキュリティ</text><text x="370" y="423" font-size="18" font-weight="400" fill="#252525">設定画面</text><text x="370" y="454" font-size="18" font-weight="400" fill="#252525">[ セキュリティ ]</text><path d="M652,441 L669,441" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="678" y="351" width="289" height="180" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><path d="M678,388 H967" stroke="#bbbcb5"/><text x="692" y="377" font-size="18" font-weight="600" fill="#252525">03 コード発行</text><text x="693" y="423" font-size="18" font-weight="400" fill="#252525">[ 復旧コードを発行 ]</text><text x="693" y="454" font-size="18" font-weight="400" fill="#252525">既存のコードの無効化に関する警告</text><text x="693" y="485" font-size="18" font-weight="400" fill="#252525">発行完了 · 新しいコード</text><rect x="32" y="557" width="936" height="89" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="590" font-size="21" font-weight="700" fill="#252525">1行の要約</text><text x="51" y="621" font-size="21" font-weight="400" fill="#252525">「設定からコードを発行してください。」  →  メニュー・警告・完了確認が欠落</text><rect x="32" y="670" width="936" height="154" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="705" font-size="21" font-weight="700" fill="#252525">手順ごとの説明</text><text x="51" y="738" font-size="21" font-weight="400" fill="#252525">設定 → セキュリティ → 復旧コードの発行 → 新しいコードの保存</text><text x="51" y="772" font-size="21" font-weight="400" fill="#252525">発行時に以前のコードが使えなくなるという警告と完了画面も説明します。</text><text x="32" y="864" font-size="18" font-weight="400" fill="#555550">教育用の架空画面 · 再生ボタンの名前だけでは内容は伝わりません。</text></g></svg>