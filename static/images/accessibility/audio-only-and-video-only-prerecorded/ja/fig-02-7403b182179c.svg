<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815" role="img" aria-labelledby="title desc"><title id="title">収録済み音声および映像の適用分岐</title><desc id="desc">収録済みかどうか、原本のメディア形式、テキストの代替という例外、原本と代替の情報比較という順序です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="815" fill="#fafaf8"/><g font-family="'Hiragino Sans','Noto Sans JP',sans-serif"><text x="32" y="44" font-size="28" font-weight="700" fill="#252525">1.2.1の適用分岐</text><text x="32" y="80" font-size="20" font-weight="400" fill="#555550">原本と実際に提供された内容を確認してから、代替の品質を比較します。</text><rect x="32" y="108" width="936" height="94" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="52" y="147" font-size="24" font-weight="700" fill="#252525">① 収録済みの資料ですか？</text><text x="52" y="181" font-size="20" font-weight="400" fill="#252525">実際のライブは他の基準へ移動 · アーカイブは収録済みとして検討</text><path d="M500,210 L500,236" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="247" width="936" height="161" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="286" font-size="24" font-weight="700" fill="#252525">② 原本の情報構成</text><text x="52" y="324" font-size="21" font-weight="400" fill="#252525">音声だけ → 書き起こしなどの時間依存メディアの代替</text><text x="52" y="356" font-size="21" font-weight="400" fill="#252525">映像だけ → テキストによる代替または十分な音声による説明</text><text x="52" y="388" font-size="21" font-weight="400" fill="#252525">映像と音声が一緒 → キャプション・音声解説など該当する基準を確認</text><rect x="32" y="435" width="936" height="138" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="474" font-size="24" font-weight="700" fill="#252525">③ 既存テキストの代替という例外</text><text x="52" y="512" font-size="21" font-weight="400" fill="#252525">テキストにない追加情報がない + 代替関係を明確に表示</text><text x="52" y="544" font-size="21" font-weight="400" fill="#252525">両方を証拠で確認 → 例外の理由を記録 / 1つでも未確認 → 保留</text><rect x="32" y="599" width="936" height="138" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="52" y="638" font-size="24" font-weight="700" fill="#252525">④ 実際の代替が同じ情報を伝えるか比較</text><text x="52" y="676" font-size="21" font-weight="400" fill="#252525">情報・条件・話者・動作・順序・結果を原本と対応付け</text><text x="52" y="708" font-size="21" font-weight="400" fill="#252525">資料を処理できない → エラー・ブロック・未レビューを別途記録</text><path d="M500,415 L500,429" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500,581 L500,593" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="777" font-size="20" font-weight="600" fill="#252525">範囲外 ≠ 例外 ≠ 資料不足 · 3つの理由を「満たしている」に置き換えません。</text></g></svg>