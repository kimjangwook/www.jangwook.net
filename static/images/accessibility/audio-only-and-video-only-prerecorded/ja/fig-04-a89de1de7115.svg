<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1000" height="811" viewBox="0 0 1000 811" role="img" aria-labelledby="title desc"><title id="title">原本と代替の独立した照合および再点検の流れ</title><desc id="desc">最終原本の独立した観察と、ページで提供される代替を分けて収集します。証拠IDと情報の位置を照合し、修正後に同じ条件で再確認します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#252525"/></marker></defs><rect width="1000" height="811" fill="#fafaf8"/><g font-family="'Hiragino Sans','Noto Sans JP',sans-serif"><text x="32" y="44" font-size="27" font-weight="700" fill="#252525">原本観察と代替文書を独立して比較</text><text x="32" y="81" font-size="20" font-weight="400" fill="#555550">同じ書き起こしを両方にコピーすると、原本から抜けた情報を見つけにくくなります。</text><rect x="32" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="149" font-size="23" font-weight="700" fill="#252525">最終原本 · MEDIA-01</text><text x="51" y="184" font-size="20" font-weight="400" fill="#252525">ファイル・版・長さ・処理した区間</text><rect x="537" y="110" width="431" height="105" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="556" y="149" font-size="23" font-weight="700" fill="#252525">実際の代替 · ALT-01</text><text x="556" y="184" font-size="20" font-weight="400" fill="#252525">ページの本文または音声による説明</text><path d="M247,222 L247,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,222 L751,253" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="304" font-size="23" font-weight="700" fill="#252525">独立した観察 · OBS-01</text><text x="51" y="341" font-size="20" font-weight="400" fill="#252525">発話・話者・画面・動作・結果</text><text x="51" y="370" font-size="20" font-weight="400" fill="#252525">各情報の時間位置と証拠ID</text><text x="51" y="399" font-size="20" font-weight="400" fill="#252525">未レビュー区間も併せて記録</text><rect x="537" y="265" width="431" height="151" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="556" y="304" font-size="23" font-weight="700" fill="#252525">代替で確認した位置</text><text x="556" y="341" font-size="20" font-weight="400" fill="#252525">段落・時間区間・代替の版</text><text x="556" y="370" font-size="20" font-weight="400" fill="#252525">原本との関連付けと提供位置</text><text x="556" y="399" font-size="20" font-weight="400" fill="#252525">まだ開けていない資料を表示</text><path d="M247,424 L247,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M751,424 L751,449" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247,449 H500 M751,449 H500 V481" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="493" width="936" height="135" rx="8" fill="white" stroke="#bbbcb5" stroke-width="2"/><text x="51" y="532" font-size="24" font-weight="700" fill="#252525">情報単位の照合</text><text x="51" y="567" font-size="21" font-weight="400" fill="#252525">原本位置 ↔ 代替位置 · 同等 / 欠落 / 歪曲 / 不確実</text><text x="51" y="599" font-size="21" font-weight="400" fill="#252525">適用条件と他の代替経路を確認 → 根拠のある判定</text><path d="M500,636 L500,667" fill="none" stroke="#252525" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="679" width="936" height="100" rx="8" fill="#f1f1ee" stroke="#252525" stroke-width="2"/><text x="51" y="718" font-size="23" font-weight="600" fill="#252525">修正 → 同じ原本区間を再確認 → 実際のページの最新の代替を確認</text><text x="51" y="755" font-size="20" font-weight="400" fill="#252525">原本を処理できなかった場合は、原本全体を確認したかのように判定しません。</text></g></svg>