<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">正在播放的画面与实际直播的区别</title><desc id="desc">根据信息来源和传递关系，分别区分真实世界事件的直播、已存储录像的播放和计算机生成的画面。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"></path></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="810" fill="#fafaf8"></rect><text x="40" y="55" class="title"><tspan x="40" dy="0">现在能看到，并不意味着是直播</tspan></text><text x="42" y="105" class="bold"><tspan x="42" dy="0">01 · 真实世界事件的直播</tspan></text><rect x="42" y="125" width="230" height="125" rx="8" class="card"></rect><text x="60" y="170" class="" style="font-size: 20.5px;"><tspan x="60" dy="0">当前进行的演讲</tspan><tspan x="60" dy="31">通过摄像头·麦克风采集</tspan></text><path d="M286 187 L395 187" class="line"></path><text x="299" y="147" class="small" style="font-size: 14.4px;"><tspan x="299" dy="0">在广播延迟范围内</tspan><tspan x="299" dy="31">传递</tspan></text><rect x="420" y="125" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="137" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="170" class="small"><tspan x="445" dy="0">接收者画面</tspan></text><text x="445" y="197" class="small"><tspan x="445" dy="0">演讲与字幕</tspan></text><path d="M438 230h180" stroke="#99988e" stroke-width="3"></path><path d="M640 221l14 9 -14 9z" fill="#252525"></path><text x="720" y="172" class="small"><tspan x="720" dy="0">审查 1.2.4</tspan><tspan x="720" dy="31">同步的实时音频</tspan></text><text x="42" y="315" class="bold"><tspan x="42" dy="0">02 · 播放过去的录像</tspan></text><rect x="42" y="335" width="230" height="125" rx="8" class="card"></rect><text x="60" y="380" class=""><tspan x="60" dy="0">过去的演讲</tspan><tspan x="60" dy="31">已录制·存储的文件</tspan></text><path d="M286 397 L395 397" class="line"></path><text x="299" y="357" class="small"><tspan x="299" dy="0">存储后</tspan><tspan x="299" dy="31">现在播放</tspan></text><rect x="420" y="335" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="347" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="380" class="small"><tspan x="445" dy="0">录像播放画面</tspan></text><text x="445" y="407" class="small"><tspan x="445" dy="0">视频与字幕</tspan></text><path d="M438 440h180" stroke="#99988e" stroke-width="3"></path><path d="M640 431l14 9 -14 9z" fill="#252525"></path><text x="720" y="382" class="small"><tspan x="720" dy="0">1.2.4 不适用</tspan><tspan x="720" dy="31">另行审查 1.2.2</tspan></text><text x="42" y="525" class="bold"><tspan x="42" dy="0">03 · 全部由计算机生成</tspan></text><rect x="42" y="545" width="230" height="125" rx="8" class="card"></rect><text x="60" y="590" class=""><tspan x="60" dy="0">通过代码生成</tspan><tspan x="60" dy="31">未采集真实世界事件</tspan></text><path d="M286 607 L395 607" class="line"></path><text x="299" y="567" class="small"><tspan x="299" dy="0">当前</tspan><tspan x="299" dy="31">生成·显示</tspan></text><rect x="420" y="545" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="557" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="590" class="small"><tspan x="445" dy="0">生成式演示画面</tspan></text><text x="445" y="617" class="small"><tspan x="445" dy="0">数字与合成声音</tspan></text><path d="M438 650h180" stroke="#99988e" stroke-width="3"></path><path d="M640 641l14 9 -14 9z" fill="#252525"></path><text x="720" y="592" class="small"><tspan x="720" dy="0">按定义不属于 live</tspan><tspan x="720" dy="31">另行审查其他准则</tspan></text><text x="42" y="765" class="small"><tspan x="42" dy="0">根据信息来源和传递关系确认适用性，不仅凭标记或文件扩展名判定。</tspan></text></svg>