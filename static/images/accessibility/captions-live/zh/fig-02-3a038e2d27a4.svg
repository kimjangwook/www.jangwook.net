<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">在同一接收者时钟下比较原声与字幕</title><desc id="desc">示例：14–22秒期间“不要丢弃”的提示在30–38秒才显示。需要作出判断的画面在22秒关闭，错过了需要字幕的时刻。16秒延迟只是用于说明的时间差，并非允许标准。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"></path></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="680" fill="#fafaf8"></rect><text x="40" y="55" class="title"><tspan x="40" dy="0">将原声与字幕放在同一时间轴上</tspan></text><text x="40" y="94" class="small"><tspan x="40" dy="0">示例：“保存新代码之前，请勿丢弃旧代码。”</tspan></text><path d="M210 150 V510" stroke="#d3d1c8" stroke-width="1"></path><text x="200" y="140" class="small"><tspan x="200" dy="0">0</tspan></text><path d="M354 150 V510" stroke="#d3d1c8" stroke-width="1"></path><text x="344" y="140" class="small"><tspan x="344" dy="0">8</tspan></text><path d="M462 150 V510" stroke="#d3d1c8" stroke-width="1"></path><text x="452" y="140" class="small"><tspan x="452" dy="0">14</tspan></text><path d="M606 150 V510" stroke="#d3d1c8" stroke-width="1"></path><text x="596" y="140" class="small"><tspan x="596" dy="0">22</tspan></text><path d="M750 150 V510" stroke="#d3d1c8" stroke-width="1"></path><text x="740" y="140" class="small"><tspan x="740" dy="0">30</tspan></text><path d="M894 150 V510" stroke="#d3d1c8" stroke-width="1"></path><text x="884" y="140" class="small"><tspan x="884" dy="0">38</tspan></text><path d="M930 150 V510" stroke="#d3d1c8" stroke-width="1"></path><text x="920" y="140" class="small"><tspan x="920" dy="0">40</tspan></text><text x="945" y="140" class="small"><tspan x="945" dy="0">秒</tspan></text><text x="40" y="229" class="bold"><tspan x="40" dy="0">接收到的原声</tspan></text><rect x="462" y="195" width="144" height="64" rx="5" fill="#252525"></rect><text x="471" y="232" style="fill:white;font-size:17px">请勿丢弃</text><text x="40" y="349" class="bold"><tspan x="40" dy="0">对应字幕</tspan></text><rect x="462" y="315" width="144" height="64" rx="5" fill="#485748"></rect><text x="471" y="352" style="fill:white;font-size:17px">请勿丢弃</text><text x="40" y="469" class="bold"><tspan x="40" dy="0">延迟的字幕</tspan></text><rect x="750" y="435" width="144" height="64" rx="5" fill="#994b3e"></rect><text x="759" y="472" style="fill:white;font-size:17px">请勿丢弃</text><path d="M606 152 V520" stroke="#994b3e" stroke-width="3" stroke-dasharray="8 5"></path><text x="618" y="177" class="small"><tspan x="618" dy="0">22秒 · 判断画面关闭</tspan></text><path d="M609 410 L746 410" class="line"></path><text x="618" y="395" class="small"><tspan x="618" dy="0">延迟字幕在画面关闭后出现</tspan></text><rect x="40" y="555" width="920" height="85" rx="8" class="muted"></rect><text x="60" y="588" class="small"><tspan x="60" dy="0">不将16秒这一延迟数值用作合格线。</tspan><tspan x="60" dy="31">本案例确认的是：用户在需要作出判断的时刻无法读到提示。</tspan></text></svg>