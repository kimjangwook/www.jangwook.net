<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">关联证据并区分实际观察与假设的流程</title><desc id="desc">原声、服务器日志、观众画面和操作流程分别支持不同事实。确认对象和时钟一致后，将基于实际资料的判断与基于假设的条件性判断分开。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"></path></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="820" fill="#fafaf8"></rect><text x="40" y="55" class="title"><tspan x="40" dy="0">区分已生成的字幕与实际显示的字幕</tspan></text><rect x="40" y="115" width="420" height="110" rx="8" class="card"></rect><text x="60" y="147" class="bold"><tspan x="60" dy="0">原声·事件记录</tspan></text><text x="60" y="180" class="small"><tspan x="60" dy="0">有哪些话语和声音？</tspan><tspan x="60" dy="31">说话者·否定表达·重要声音</tspan></text><path d="M470 170 L540 365" class="line"></path><rect x="40" y="245" width="420" height="110" rx="8" class="card"></rect><text x="60" y="277" class="bold"><tspan x="60" dy="0">服务器生成·发送日志</tspan></text><text x="60" y="310" class="small"><tspan x="60" dy="0">生成·发送了什么？</tspan><tspan x="60" dy="31">是否成功显示需另行确认</tspan></text><path d="M470 300 L540 365" class="line"></path><rect x="40" y="375" width="420" height="110" rx="8" class="card"></rect><text x="60" y="407" class="bold"><tspan x="60" dy="0">观众画面的同步记录</tspan></text><text x="60" y="440" class="small"><tspan x="60" dy="0">何时显示了哪些字幕？</tspan><tspan x="60" dy="31">按与原声相同的时钟对照</tspan></text><path d="M470 430 L540 365" class="line"></path><rect x="40" y="505" width="420" height="110" rx="8" class="card"></rect><text x="60" y="537" class="bold"><tspan x="60" dy="0">传递流程·政策</tspan></text><text x="60" y="570" class="small"><tspan x="60" dy="0">如何准备实时传递？</tspan><tspan x="60" dy="31">当天是否成功显示需另行确认</tspan></text><path d="M470 560 L540 365" class="line"></path><rect x="550" y="280" width="400" height="180" rx="8" class="muted"></rect><text x="575" y="322" class=""><tspan x="575" dy="0">是否为同一对象·会话？</tspan><tspan x="575" dy="31">时钟能否相互对齐？</tspan><tspan x="575" dy="31">是观察记录还是假设资料？</tspan></text><path d="M750 470 L750 535" class="line"></path><path d="M750 510 H520 V715 H545" class="line"></path><rect x="550" y="540" width="400" height="95" rx="8" class="card"></rect><text x="570" y="574" class="small"><tspan x="570" dy="0">实际提供的资料</tspan><tspan x="570" dy="31">在确认范围内判定·注明未确认项</tspan></text><rect x="550" y="660" width="400" height="110" rx="8" class="card"></rect><text x="570" y="694" class="small"><tspan x="570" dy="0">假设场景</tspan><tspan x="570" dy="31">仅在前提成立时判定</tspan><tspan x="570" dy="31">实际广播审计状态为未评估</tspan></text><text x="40" y="749" class="small"><tspan x="40" dy="0">资料不足时，具体请求所需证据。</tspan><tspan x="40" dy="31">不将单张静态截图扩大为整场广播的证据。</tspan></text></svg>