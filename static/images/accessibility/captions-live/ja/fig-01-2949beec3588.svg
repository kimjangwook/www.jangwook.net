<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">再生中の画面と実際の生中継の違い</title><desc id="desc">実世界の出来事の生中継、保存した映像の再生、コンピュータ生成の画面を、それぞれ情報の起源と伝達関係で区別します。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"></path></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="810" fill="#fafaf8"></rect><text x="40" y="55" class="title"><tspan x="40" dy="0">今見えているだけでは生中継ではありません</tspan></text><text x="42" y="105" class="bold"><tspan x="42" dy="0">01 · 実世界の出来事の生中継</tspan></text><rect x="42" y="125" width="230" height="125" rx="8" class="card"></rect><text x="60" y="170" class=""><tspan x="60" dy="0">現在行われている発表</tspan><tspan x="60" dy="31">カメラ・マイクで収集</tspan></text><path d="M286 187 L395 187" class="line"></path><text x="299" y="147" class="small" style="font-size: 13.1px;"><tspan x="299" dy="0">放送遅延の範囲内で</tspan><tspan x="299" dy="31">伝達</tspan></text><rect x="420" y="125" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="137" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="170" class="small"><tspan x="445" dy="0">受信者の画面</tspan></text><text x="445" y="197" class="small"><tspan x="445" dy="0">発表とキャプション</tspan></text><path d="M438 230h180" stroke="#99988e" stroke-width="3"></path><path d="M640 221l14 9 -14 9z" fill="#252525"></path><text x="720" y="172" class="small"><tspan x="720" dy="0">1.2.4を検討</tspan><tspan x="720" dy="31">同期したライブ音声</tspan></text><text x="42" y="315" class="bold"><tspan x="42" dy="0">02 · 過去の映像の再生</tspan></text><rect x="42" y="335" width="230" height="125" rx="8" class="card"></rect><text x="60" y="380" class=""><tspan x="60" dy="0">過去の発表</tspan><tspan x="60" dy="31">撮影・保存したファイル</tspan></text><path d="M286 397 L395 397" class="line"></path><text x="299" y="357" class="small"><tspan x="299" dy="0">保存後に</tspan><tspan x="299" dy="31">今再生</tspan></text><rect x="420" y="335" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="347" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="380" class="small"><tspan x="445" dy="0">録画の再生画面</tspan></text><text x="445" y="407" class="small"><tspan x="445" dy="0">映像とキャプション</tspan></text><path d="M438 440h180" stroke="#99988e" stroke-width="3"></path><path d="M640 431l14 9 -14 9z" fill="#252525"></path><text x="720" y="382" class="small"><tspan x="720" dy="0">1.2.4は対象外</tspan><tspan x="720" dy="31">1.2.2は別途検討</tspan></text><text x="42" y="525" class="bold"><tspan x="42" dy="0">03 · すべてコンピュータが生成</tspan></text><rect x="42" y="545" width="230" height="125" rx="8" class="card"></rect><text x="60" y="590" class="" style="font-size: 18.3px;"><tspan x="60" dy="0">コードで生成</tspan><tspan x="60" dy="31">実世界の出来事は収集せず</tspan></text><path d="M286 607 L395 607" class="line"></path><text x="299" y="567" class="small"><tspan x="299" dy="0">現在</tspan><tspan x="299" dy="31">生成・表示</tspan></text><rect x="420" y="545" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="557" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="590" class="small"><tspan x="445" dy="0">生成デモの画面</tspan></text><text x="445" y="617" class="small"><tspan x="445" dy="0">数字と合成音</tspan></text><path d="M438 650h180" stroke="#99988e" stroke-width="3"></path><path d="M640 641l14 9 -14 9z" fill="#252525"></path><text x="720" y="592" class="small"><tspan x="720" dy="0">定義上のliveではない</tspan><tspan x="720" dy="31">他の基準は別途検討</tspan></text><text x="42" y="765" class="small"><tspan x="42" dy="0">適用性は情報の起源と伝達関係で確認します。バッジやファイル拡張子だけでは決めません。</tspan></text></svg>