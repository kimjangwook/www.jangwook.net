<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">証拠を結び付け、実際の観察と仮定を区別する流れ</title><desc id="desc">元音声、サーバーログ、視聴者の画面、運用手順は、それぞれ異なる事実を裏付けます。同じ対象と時計を確認したうえで、実際の資料に基づく判断と仮定に基づく条件付きの判断を分けます。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"></path></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="820" fill="#fafaf8"></rect><text x="40" y="55" class="title"><tspan x="40" dy="0">生成したキャプションと実際に見えたキャプションを区別します</tspan></text><rect x="40" y="115" width="420" height="110" rx="8" class="card"></rect><text x="60" y="147" class="bold"><tspan x="60" dy="0">元音声・出来事の記録</tspan></text><text x="60" y="180" class="small"><tspan x="60" dy="0">どんな発言や音があったか？</tspan><tspan x="60" dy="31">話者・否定表現・重要な音</tspan></text><path d="M470 170 L540 365" class="line"></path><rect x="40" y="245" width="420" height="110" rx="8" class="card"></rect><text x="60" y="277" class="bold"><tspan x="60" dy="0">サーバーの生成・送信ログ</tspan></text><text x="60" y="310" class="small"><tspan x="60" dy="0">何を生成・送信したか？</tspan><tspan x="60" dy="31">画面への表示成功は別途確認</tspan></text><path d="M470 300 L540 365" class="line"></path><rect x="40" y="375" width="420" height="110" rx="8" class="card"></rect><text x="60" y="407" class="bold"><tspan x="60" dy="0">視聴者画面の同時記録</tspan></text><text x="60" y="440" class="small"><tspan x="60" dy="0">どのキャプションがいつ見えたか？</tspan><tspan x="60" dy="31">元音声と同じ時計で照合</tspan></text><path d="M470 430 L540 365" class="line"></path><rect x="40" y="505" width="420" height="110" rx="8" class="card"></rect><text x="60" y="537" class="bold"><tspan x="60" dy="0">配信手順・方針</tspan></text><text x="60" y="570" class="small"><tspan x="60" dy="0">リアルタイム配信をどう準備したか？</tspan><tspan x="60" dy="31">当日の表示成功は別途確認</tspan></text><path d="M470 560 L540 365" class="line"></path><rect x="550" y="280" width="400" height="180" rx="8" class="muted"></rect><text x="575" y="322" class=""><tspan x="575" dy="0">同じ対象・セッションか？</tspan><tspan x="575" dy="31">時計を相互に合わせられるか？</tspan><tspan x="575" dy="31">観察記録か、仮定した資料か？</tspan></text><path d="M750 470 L750 535" class="line"></path><path d="M750 510 H520 V715 H545" class="line"></path><rect x="550" y="540" width="400" height="95" rx="8" class="card"></rect><text x="570" y="574" class="small"><tspan x="570" dy="0">実際に提供された資料</tspan><tspan x="570" dy="31">確認範囲内で判定・未確認を明示</tspan></text><rect x="550" y="660" width="400" height="110" rx="8" class="card"></rect><text x="570" y="694" class="small"><tspan x="570" dy="0">仮想シナリオ</tspan><tspan x="570" dy="31">前提が正しい場合に限って判定</tspan><tspan x="570" dy="31">実際の放送の監査状況は未評価</tspan></text><text x="40" y="749" class="small"><tspan x="40" dy="0">資料が不足している場合は、必要な証拠を具体的に求めます。</tspan><tspan x="40" dy="31">静止画1枚を放送全体の証拠に拡大解釈しません。</tspan></text></svg>