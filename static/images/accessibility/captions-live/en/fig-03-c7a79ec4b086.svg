<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Connecting evidence and distinguishing actual observations from assumptions</title><desc id="desc">Original audio, server logs, viewer screens, and operating procedures support different facts. After checking that they concern the same subject and clock, separate judgments based on actual material from conditional judgments based on assumptions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"></path></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="820" fill="#fafaf8"></rect><text x="40" y="55" class="title"><tspan x="40" dy="0">Distinguish generated captions from captions actually displayed</tspan></text><rect x="40" y="115" width="420" height="110" rx="8" class="card"></rect><text x="60" y="147" class="bold"><tspan x="60" dy="0">Original audio and event records</tspan></text><text x="60" y="180" class="small"><tspan x="60" dy="0">What speech and sounds occurred?</tspan><tspan x="60" dy="31">Speakers, negation, important sounds</tspan></text><path d="M470 170 L540 365" class="line"></path><rect x="40" y="245" width="420" height="110" rx="8" class="card"></rect><text x="60" y="277" class="bold"><tspan x="60" dy="0">Server generation and transmission logs</tspan></text><text x="60" y="310" class="small"><tspan x="60" dy="0">What was generated and sent?</tspan><tspan x="60" dy="31">Verify screen display separately</tspan></text><path d="M470 300 L540 365" class="line"></path><rect x="40" y="375" width="420" height="110" rx="8" class="card"></rect><text x="60" y="407" class="bold"><tspan x="60" dy="0">Concurrent viewer-screen recording</tspan></text><text x="60" y="440" class="small"><tspan x="60" dy="0">Which captions appeared, and when?</tspan><tspan x="60" dy="31">Compare on the original audio’s clock</tspan></text><path d="M470 430 L540 365" class="line"></path><rect x="40" y="505" width="420" height="110" rx="8" class="card"></rect><text x="60" y="537" class="bold"><tspan x="60" dy="0">Delivery procedures and policies</tspan></text><text x="60" y="570" class="small"><tspan x="60" dy="0">How was live delivery prepared?</tspan><tspan x="60" dy="31">Verify that day’s display separately</tspan></text><path d="M470 560 L540 365" class="line"></path><rect x="550" y="280" width="400" height="180" rx="8" class="muted"></rect><text x="575" y="322" class=""><tspan x="575" dy="0">Same subject and session?</tspan><tspan x="575" dy="31">Can the clocks be aligned?</tspan><tspan x="575" dy="31">Observed records or assumed material?</tspan></text><path d="M750 470 L750 535" class="line"></path><path d="M750 510 H520 V715 H545" class="line"></path><rect x="550" y="540" width="400" height="95" rx="8" class="card"></rect><text x="570" y="574" class="small"><tspan x="570" dy="0">Actual supplied evidence</tspan><tspan x="570" dy="31">Judge within verified scope; state unknowns</tspan></text><rect x="550" y="660" width="400" height="110" rx="8" class="card"></rect><text x="570" y="694" class="small"><tspan x="570" dy="0">Hypothetical scenario</tspan><tspan x="570" dy="31">Judge only if the premises hold</tspan><tspan x="570" dy="31">Actual broadcast audit: not assessed</tspan></text><text x="40" y="749" class="small" style="font-size: 17.7px;"><tspan x="40" dy="0">If material is insufficient, request the specific evidence needed.</tspan><tspan x="40" dy="31">Do not treat one still image as evidence for the entire broadcast.</tspan></text></svg>