<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">The difference between current playback and an actual live broadcast</title><desc id="desc">Distinguishes live broadcasts of real-world events, playback of stored recordings, and computer-generated displays by the origin of the information and how it is delivered.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"></path></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="810" fill="#fafaf8"></rect><text x="40" y="55" class="title"><tspan x="40" dy="0">Being shown now does not make it live</tspan></text><text x="42" y="105" class="bold"><tspan x="42" dy="0">01 · Live broadcast of a real-world event</tspan></text><rect x="42" y="125" width="230" height="125" rx="8" class="card"></rect><text x="60" y="170" class=""><tspan x="60" dy="0">Current presentation</tspan><tspan x="60" dy="31">Camera + microphone</tspan></text><path d="M286 187 L395 187" class="line"></path><text x="299" y="147" class="small" style="font-size: 15.1px;"><tspan x="299" dy="0">Within broadcast</tspan><tspan x="299" dy="31">delay</tspan></text><rect x="420" y="125" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="137" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="170" class="small"><tspan x="445" dy="0">Recipient’s screen</tspan></text><text x="445" y="197" class="small"><tspan x="445" dy="0">Presentation and captions</tspan></text><path d="M438 230h180" stroke="#99988e" stroke-width="3"></path><path d="M640 221l14 9 -14 9z" fill="#252525"></path><text x="720" y="172" class="small"><tspan x="720" dy="0">Review 1.2.4</tspan><tspan x="720" dy="31">Synchronized live audio</tspan></text><text x="42" y="315" class="bold"><tspan x="42" dy="0">02 · Playback of a past recording</tspan></text><rect x="42" y="335" width="230" height="125" rx="8" class="card"></rect><text x="60" y="380" class="" style="font-size: 19.2px;"><tspan x="60" dy="0">Past presentation</tspan><tspan x="60" dy="31">Recorded and stored file</tspan></text><path d="M286 397 L395 397" class="line"></path><text x="299" y="357" class="small"><tspan x="299" dy="0">Stored earlier</tspan><tspan x="299" dy="31">Played now</tspan></text><rect x="420" y="335" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="347" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="380" class="small"><tspan x="445" dy="0">Recording playback screen</tspan></text><text x="445" y="407" class="small"><tspan x="445" dy="0">Video and captions</tspan></text><path d="M438 440h180" stroke="#99988e" stroke-width="3"></path><path d="M640 431l14 9 -14 9z" fill="#252525"></path><text x="720" y="382" class="small"><tspan x="720" dy="0">1.2.4 not applicable</tspan><tspan x="720" dy="31">Review 1.2.2 separately</tspan></text><text x="42" y="525" class="bold"><tspan x="42" dy="0">03 · Entirely computer-generated</tspan></text><rect x="42" y="545" width="230" height="125" rx="8" class="card"></rect><text x="60" y="590" class=""><tspan x="60" dy="0">Generated by code</tspan><tspan x="60" dy="31">No real-world capture</tspan></text><path d="M286 607 L395 607" class="line"></path><text x="299" y="567" class="small" style="font-size: 13.7px;"><tspan x="299" dy="0">Generated</tspan><tspan x="299" dy="31">and displayed now</tspan></text><rect x="420" y="545" width="270" height="125" rx="8" class="card"></rect><rect x="432" y="557" width="246" height="72" rx="3" fill="#e7e5de"></rect><text x="445" y="590" class="small"><tspan x="445" dy="0">Generated demo screen</tspan></text><text x="445" y="617" class="small" style="font-size: 16px;"><tspan x="445" dy="0">Numbers and synthesized sound</tspan></text><path d="M438 650h180" stroke="#99988e" stroke-width="3"></path><path d="M640 641l14 9 -14 9z" fill="#252525"></path><text x="720" y="592" class="small"><tspan x="720" dy="0">Not live by definition</tspan><tspan x="720" dy="31">Review other criteria separately</tspan></text><text x="42" y="765" class="small"><tspan x="42" dy="0">Determine applicability from the information’s origin and delivery relationship, not badges or file extensions alone.</tspan></text></svg>