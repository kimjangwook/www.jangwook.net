<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">증거를 연결하고 실제 관찰과 가정을 구별하는 흐름</title><desc id="desc">원음, 서버 로그, 시청자 화면, 운영 절차는 각기 다른 사실을 뒷받침합니다. 같은 대상과 시계를 확인한 뒤 실제 자료에 따른 판단과 가정에 따른 조건부 판단을 분리합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"/></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="820" fill="#fafaf8"/><text x="40" y="55" class="title"><tspan x="40" dy="0">생성한 자막과 실제로 보인 자막을 구별합니다</tspan></text><rect x="40" y="115" width="420" height="110" rx="8" class="card"/><text x="60" y="147" class="bold"><tspan x="60" dy="0">원음·사건 기록</tspan></text><text x="60" y="180" class="small"><tspan x="60" dy="0">무슨 말과 소리가 있었는가?</tspan><tspan x="60" dy="31">화자·부정 표현·중요 소리</tspan></text><path d="M470 170 L540 365" class="line"/><rect x="40" y="245" width="420" height="110" rx="8" class="card"/><text x="60" y="277" class="bold"><tspan x="60" dy="0">서버 생성·송신 로그</tspan></text><text x="60" y="310" class="small"><tspan x="60" dy="0">무엇을 생성·전송했는가?</tspan><tspan x="60" dy="31">화면 표시 성공은 별도 확인</tspan></text><path d="M470 300 L540 365" class="line"/><rect x="40" y="375" width="420" height="110" rx="8" class="card"/><text x="60" y="407" class="bold"><tspan x="60" dy="0">시청자 화면의 동시 기록</tspan></text><text x="60" y="440" class="small"><tspan x="60" dy="0">어떤 자막이 언제 보였는가?</tspan><tspan x="60" dy="31">원음과 같은 시계로 대조</tspan></text><path d="M470 430 L540 365" class="line"/><rect x="40" y="505" width="420" height="110" rx="8" class="card"/><text x="60" y="537" class="bold"><tspan x="60" dy="0">전달 절차·정책</tspan></text><text x="60" y="570" class="small"><tspan x="60" dy="0">실시간 전달을 어떻게 준비했는가?</tspan><tspan x="60" dy="31">당일 표시 성공은 별도 확인</tspan></text><path d="M470 560 L540 365" class="line"/><rect x="550" y="280" width="400" height="180" rx="8" class="muted"/><text x="575" y="322" class=""><tspan x="575" dy="0">같은 대상·세션인가?</tspan><tspan x="575" dy="31">시계를 서로 맞출 수 있는가?</tspan><tspan x="575" dy="31">관찰 기록인가, 가정한 자료인가?</tspan></text><path d="M750 470 L750 535" class="line"/><path d="M750 510 H520 V715 H545" class="line"/><rect x="550" y="540" width="400" height="95" rx="8" class="card"/><text x="570" y="574" class="small"><tspan x="570" dy="0">실제 제공 자료</tspan><tspan x="570" dy="31">확인 범위 안에서 판정·미확인 명시</tspan></text><rect x="550" y="660" width="400" height="110" rx="8" class="card"/><text x="570" y="694" class="small"><tspan x="570" dy="0">가상 시나리오</tspan><tspan x="570" dy="31">전제가 맞다는 조건에서만 판정</tspan><tspan x="570" dy="31">실제 방송 감사 상태는 미평가</tspan></text><text x="40" y="749" class="small"><tspan x="40" dy="0">자료가 부족하면 필요한 증거를 구체적으로 요청합니다.</tspan><tspan x="40" dy="31">정지화면 한 장을 방송 전체의 증거로 확대하지 않습니다.</tspan></text></svg>