<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">같은 수신자 시계에서 비교하는 원음과 자막</title><desc id="desc">14–22초의 버리지 말라는 안내가 30–38초에 표시되는 예. 22초에 판단 화면이 닫혀 자막이 필요한 순간을 놓칩니다. 16초 지연은 설명용 차이이며 허용 기준이 아닙니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"/></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="680" fill="#fafaf8"/><text x="40" y="55" class="title"><tspan x="40" dy="0">원음과 자막의 위치를 같은 시간축에 놓습니다</tspan></text><text x="40" y="94" class="small"><tspan x="40" dy="0">예시: “새 코드를 저장하기 전에는 이전 코드를 버리지 마세요.”</tspan></text><path d="M210 150 V510" stroke="#d3d1c8" stroke-width="1"/><text x="200" y="140" class="small"><tspan x="200" dy="0">0</tspan></text><path d="M354 150 V510" stroke="#d3d1c8" stroke-width="1"/><text x="344" y="140" class="small"><tspan x="344" dy="0">8</tspan></text><path d="M462 150 V510" stroke="#d3d1c8" stroke-width="1"/><text x="452" y="140" class="small"><tspan x="452" dy="0">14</tspan></text><path d="M606 150 V510" stroke="#d3d1c8" stroke-width="1"/><text x="596" y="140" class="small"><tspan x="596" dy="0">22</tspan></text><path d="M750 150 V510" stroke="#d3d1c8" stroke-width="1"/><text x="740" y="140" class="small"><tspan x="740" dy="0">30</tspan></text><path d="M894 150 V510" stroke="#d3d1c8" stroke-width="1"/><text x="884" y="140" class="small"><tspan x="884" dy="0">38</tspan></text><path d="M930 150 V510" stroke="#d3d1c8" stroke-width="1"/><text x="920" y="140" class="small"><tspan x="920" dy="0">40</tspan></text><text x="945" y="140" class="small"><tspan x="945" dy="0">초</tspan></text><text x="40" y="229" class="bold"><tspan x="40" dy="0">수신한 원음</tspan></text><rect x="462" y="195" width="144" height="64" rx="5" fill="#252525"/><text x="471" y="232" style="fill:white;font-size:17px">버리지 마세요</text><text x="40" y="349" class="bold"><tspan x="40" dy="0">대응하는 자막</tspan></text><rect x="462" y="315" width="144" height="64" rx="5" fill="#485748"/><text x="471" y="352" style="fill:white;font-size:17px">버리지 마세요</text><text x="40" y="469" class="bold"><tspan x="40" dy="0">늦은 자막</tspan></text><rect x="750" y="435" width="144" height="64" rx="5" fill="#994b3e"/><text x="759" y="472" style="fill:white;font-size:17px">버리지 마세요</text><path d="M606 152 V520" stroke="#994b3e" stroke-width="3" stroke-dasharray="8 5"/><text x="618" y="177" class="small"><tspan x="618" dy="0">22초 · 판단 화면 종료</tspan></text><path d="M609 410 L746 410" class="line"/><text x="618" y="395" class="small"><tspan x="618" dy="0">늦은 자막은 화면 종료 뒤 등장</tspan></text><rect x="40" y="555" width="920" height="85" rx="8" class="muted"/><text x="60" y="588" class="small"><tspan x="60" dy="0">16초라는 지연 수치를 합격선으로 사용하지 않습니다.</tspan><tspan x="60" dy="31">이 사례에서는 이용자가 판단해야 할 순간에 안내를 읽을 수 없다는 점을 확인합니다.</tspan></text></svg>