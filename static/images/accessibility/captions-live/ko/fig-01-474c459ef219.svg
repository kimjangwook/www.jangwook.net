<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">재생 중인 화면과 실제 생중계의 차이</title><desc id="desc">실세계 사건의 생중계, 보관한 촬영본 재생, 컴퓨터 생성 화면을 각각 정보의 기원과 전달 관계로 구분합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#696860" stroke-width="1.5"/></marker></defs><style>text{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#252525;font-size:21px}.small{font-size:18px;fill:#595951}.title{font-size:29px;font-weight:700}.bold{font-weight:700}.line{stroke:#696860;stroke-width:2;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke:#c9c7bf;stroke-width:1.5}.muted{fill:#eeece5}.good{fill:#485748}.bad{fill:#994b3e}</style><rect width="1000" height="810" fill="#fafaf8"/><text x="40" y="55" class="title"><tspan x="40" dy="0">지금 보인다는 사실만으로 생중계는 아닙니다</tspan></text><text x="42" y="105" class="bold"><tspan x="42" dy="0">01 · 실세계 사건의 생중계</tspan></text><rect x="42" y="125" width="230" height="125" rx="8" class="card"/><text x="60" y="170" class=""><tspan x="60" dy="0">현재 일어난 발표</tspan><tspan x="60" dy="31">카메라·마이크로 수집</tspan></text><path d="M286 187 L395 187" class="line"/><text x="299" y="147" class="small"><tspan x="299" dy="0">방송 지연 이내</tspan><tspan x="299" dy="31">전달</tspan></text><rect x="420" y="125" width="270" height="125" rx="8" class="card"/><rect x="432" y="137" width="246" height="72" rx="3" fill="#e7e5de"/><text x="445" y="170" class="small"><tspan x="445" dy="0">수신자 화면</tspan></text><text x="445" y="197" class="small"><tspan x="445" dy="0">발표와 자막</tspan></text><path d="M438 230h180" stroke="#99988e" stroke-width="3"/><path d="M640 221l14 9 -14 9z" fill="#252525"/><text x="720" y="172" class="small"><tspan x="720" dy="0">1.2.4 검토</tspan><tspan x="720" dy="31">동기화된 라이브 오디오</tspan></text><text x="42" y="315" class="bold"><tspan x="42" dy="0">02 · 과거 촬영본의 재생</tspan></text><rect x="42" y="335" width="230" height="125" rx="8" class="card"/><text x="60" y="380" class=""><tspan x="60" dy="0">과거의 발표</tspan><tspan x="60" dy="31">촬영·보관된 파일</tspan></text><path d="M286 397 L395 397" class="line"/><text x="299" y="357" class="small"><tspan x="299" dy="0">보관 후</tspan><tspan x="299" dy="31">지금 재생</tspan></text><rect x="420" y="335" width="270" height="125" rx="8" class="card"/><rect x="432" y="347" width="246" height="72" rx="3" fill="#e7e5de"/><text x="445" y="380" class="small"><tspan x="445" dy="0">녹화 재생 화면</tspan></text><text x="445" y="407" class="small"><tspan x="445" dy="0">영상과 자막</tspan></text><path d="M438 440h180" stroke="#99988e" stroke-width="3"/><path d="M640 431l14 9 -14 9z" fill="#252525"/><text x="720" y="382" class="small"><tspan x="720" dy="0">1.2.4 해당 없음</tspan><tspan x="720" dy="31">1.2.2는 별도로 검토</tspan></text><text x="42" y="525" class="bold"><tspan x="42" dy="0">03 · 전부 컴퓨터가 생성</tspan></text><rect x="42" y="545" width="230" height="125" rx="8" class="card"/><text x="60" y="590" class=""><tspan x="60" dy="0">코드로 생성</tspan><tspan x="60" dy="31">실세계 사건 수집 없음</tspan></text><path d="M286 607 L395 607" class="line"/><text x="299" y="567" class="small"><tspan x="299" dy="0">현재</tspan><tspan x="299" dy="31">생성·표시</tspan></text><rect x="420" y="545" width="270" height="125" rx="8" class="card"/><rect x="432" y="557" width="246" height="72" rx="3" fill="#e7e5de"/><text x="445" y="590" class="small"><tspan x="445" dy="0">생성 데모 화면</tspan></text><text x="445" y="617" class="small"><tspan x="445" dy="0">숫자와 합성 소리</tspan></text><path d="M438 650h180" stroke="#99988e" stroke-width="3"/><path d="M640 641l14 9 -14 9z" fill="#252525"/><text x="720" y="592" class="small"><tspan x="720" dy="0">정의상 live 아님</tspan><tspan x="720" dy="31">다른 기준은 별도로 검토</tspan></text><text x="42" y="765" class="small"><tspan x="42" dy="0">적용성은 정보의 기원과 전달 관계로 확인합니다. 배지·파일 확장자만으로 정하지 않습니다.</tspan></text></svg>