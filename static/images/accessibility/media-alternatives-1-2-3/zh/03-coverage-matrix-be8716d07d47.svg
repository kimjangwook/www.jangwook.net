<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="1000" height="1025" viewBox="0 0 1000 1025" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">转录与完整替代方案的区别</title><desc id="d">比较失败场景的转录与完整替代方案。仅转录对白与声音的文本中只有两声警告音。补充了视觉描述的替代方案同时包含安全验证失败提示、重试按钮和警告音。音频描述结合原声，以声音传达视觉信息；媒体替代方案以相同顺序的文字传达画面、对白与声音。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1025" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">转录与完整替代方案的区别</text><text x="40" y="105" font-size="26" fill="#595c54" font-weight="400">直接比较同一失败场景中遗漏了什么。</text><rect x="40" y="140" width="440" height="300" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="520" y="140" width="440" height="300" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="65" y="187" font-size="28" fill="#252620" font-weight="700">仅转录对白与声音</text><text x="65" y="248" font-size="28" fill="#252620" font-weight="400">[两声警告音]</text><text x="65" y="313" font-size="25" fill="#743f3c" font-weight="400">遗漏了安全验证失败的画面</text><text x="65" y="351" font-size="25" fill="#743f3c" font-weight="400">提示和重新验证按钮</text><text x="545" y="187" font-size="28" fill="#252620" font-weight="700">补充视觉描述的替代方案</text><text x="545" y="240" font-size="25" fill="#252620" font-weight="400">可见“安全验证失败。请</text><text x="545" y="278" font-size="25" fill="#252620" font-weight="400">重新验证。”以及“重新进行</text><text x="545" y="316" font-size="25" fill="#252620" font-weight="400">安全验证”按钮。</text><text x="545" y="354" font-size="25" fill="#252620" font-weight="400">响起两声警告音。</text><text x="40" y="490" font-size="25" fill="#743f3c" font-weight="700">在转录中加入视觉信息，可形成充分的媒体替代方案。</text><rect x="40" y="535" width="920" height="290" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="580" font-size="28" fill="#252620" font-weight="700">音频描述</text><text x="65" y="625" font-size="26" fill="#252620" font-weight="400">原声 + 必要视觉描述 → 通过声音理解。无须再次转录原声。</text><text x="65" y="720" font-size="28" fill="#252620" font-weight="700">基于时间的媒体替代方案</text><text x="65" y="765" font-size="26" fill="#252620" font-weight="400">画面 + 对白 + 有意义的声音 → 通过相同顺序的文字理解。</text><text x="40" y="885" font-size="26" fill="#595c54" font-weight="400">应检查实际内容与访问路径，而非只看形式名称。</text><text x="40" y="934" font-size="25" fill="#595c54" font-weight="400">音频描述也能传达所有必要的视觉信息。</text><text x="40" y="979" font-size="25" fill="#595c54" font-weight="400">对白密集时，可考虑扩展描述、融合描述的旁白等。</text></g></svg>