<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">从画面与声音获取的信息</title><desc id="d">恢复码教学视频线框图，按阅读顺序以2列3行排列六个场景。分别标示各场景的画面信息与原声信息。安全验证失败场景中有失败提示和重试按钮，但原声仅有两声警告音。新码场景中有教学用虚拟码R7K2-P9M4，最后一个场景显示保存完成和旧码不可用的状态。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1580" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">从画面与声音获取的信息</text><text x="40" y="98" font-size="22" fill="#595c54" font-weight="400">阅读顺序：左 → 右，上 → 下 · 观察时段经四舍五入显示</text><rect x="40" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="168" font-size="28" fill="#252620" font-weight="700">01 · 安全设置</text><text x="62" y="200" font-size="22" fill="#595c54" font-weight="400">0.00–7.33秒</text><rect x="60" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="252" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="78" y="290" font-size="25" fill="#252620" font-weight="400">设置 → 安全 → 恢复码</text><rect x="78" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="405" font-size="23" fill="#252620" font-weight="400">生成新码</text><text x="62" y="470" font-size="22" fill="#743f3c" font-weight="700">原声</text><text x="62" y="506" font-size="23" fill="#252620" font-weight="400">选择安全的指引及“现在可以</text><text x="62" y="542" font-size="23" fill="#252620" font-weight="400">丢弃旧码吗？”</text><rect x="510" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="168" font-size="28" fill="#252620" font-weight="700">02 · 生成前确认</text><text x="532" y="200" font-size="22" fill="#595c54" font-weight="400">7.33–11.92秒</text><rect x="530" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="252" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="548" y="290" font-size="25" fill="#252620" font-weight="400">保存新码前，请勿</text><text x="548" y="328" font-size="25" fill="#252620" font-weight="400">丢弃旧码。</text><rect x="548" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="405" font-size="23" fill="#252620" font-weight="400">保留旧码</text><text x="532" y="470" font-size="22" fill="#743f3c" font-weight="700">原声</text><text x="532" y="506" font-size="23" fill="#252620" font-weight="400">“不可以。保存新恢复码前，</text><text x="532" y="542" font-size="23" fill="#252620" font-weight="400">请勿丢弃。”</text><rect x="40" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="628" font-size="28" fill="#252620" font-weight="700">03 · 安全验证失败</text><text x="62" y="660" font-size="22" fill="#595c54" font-weight="400">11.92–16.13秒</text><rect x="60" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="712" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="78" y="750" font-size="25" fill="#252620" font-weight="400">安全验证失败。请重新</text><text x="78" y="788" font-size="25" fill="#252620" font-weight="400">验证。</text><rect x="78" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="865" font-size="23" fill="#252620" font-weight="400">重新进行安全验证</text><text x="62" y="930" font-size="22" fill="#743f3c" font-weight="700">原声</text><text x="62" y="966" font-size="23" fill="#252620" font-weight="400">无对白。两声警告音</text><rect x="510" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="628" font-size="28" fill="#252620" font-weight="700">04 · 重新验证完成</text><text x="532" y="660" font-size="22" fill="#595c54" font-weight="400">16.13–19.79秒</text><rect x="530" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="712" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="548" y="750" font-size="25" fill="#252620" font-weight="400">安全验证已完成。请确认</text><text x="548" y="788" font-size="25" fill="#252620" font-weight="400">生成新码。</text><rect x="548" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="865" font-size="23" fill="#252620" font-weight="400">确认生成</text><text x="532" y="930" font-size="22" fill="#743f3c" font-weight="700">原声</text><text x="532" y="966" font-size="23" fill="#252620" font-weight="400">“重新完成安全验证后，</text><text x="532" y="1002" font-size="23" fill="#252620" font-weight="400">确认生成。”</text><rect x="40" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="1088" font-size="28" fill="#252620" font-weight="700">05 · 新恢复码</text><text x="62" y="1120" font-size="22" fill="#595c54" font-weight="400">19.79–27.00秒</text><rect x="60" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="1172" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="78" y="1210" font-size="25" fill="#252620" font-weight="400">虚拟码：R7K2-P9M4 不能用于</text><text x="78" y="1248" font-size="25" fill="#252620" font-weight="400">真实账户</text><rect x="78" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="1325" font-size="23" fill="#252620" font-weight="400">保存恢复码</text><text x="62" y="1390" font-size="22" fill="#743f3c" font-weight="700">原声</text><text x="62" y="1426" font-size="23" fill="#252620" font-weight="400">提示保存至安全处。旧码</text><text x="62" y="1462" font-size="23" fill="#252620" font-weight="400">不可用</text><rect x="510" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="1088" font-size="28" fill="#252620" font-weight="700">06 · 生成完成</text><text x="532" y="1120" font-size="22" fill="#595c54" font-weight="400">27.00–31.21秒</text><rect x="530" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="1172" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="548" y="1210" font-size="25" fill="#252620" font-weight="400">新码保存完成 · 旧码</text><text x="548" y="1248" font-size="25" fill="#252620" font-weight="400">不可用</text><rect x="548" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="1325" font-size="23" fill="#252620" font-weight="400">返回设置</text><text x="532" y="1390" font-size="22" fill="#743f3c" font-weight="700">原声</text><text x="532" y="1426" font-size="23" fill="#252620" font-weight="400">“查看生成完成画面。”</text><text x="40" y="1542" font-size="22" fill="#595c54" font-weight="400">录制的虚拟演示 · 未操作真实账户 · 分别对照画面与声音的信息。</text></g></svg>