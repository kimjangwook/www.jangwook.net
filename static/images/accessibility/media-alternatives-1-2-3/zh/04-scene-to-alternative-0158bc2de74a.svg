<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">从原始内容连接到替代方案</title><desc id="d">将失败、新码、完成场景的画面信息与听觉信息连接到替代方案的第3、5、6段。一并保留失败提示与警告音、虚拟码的值与保存指引、完成的具体结果。最后列有检查含义、否定句、顺序和访问路径的项目。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1280" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">从原始内容连接到替代方案</text><text x="40" y="105" font-size="26" fill="#595c54" font-weight="400">先建立原始内容的信息单元，再与候选段落对照。</text><rect x="40" y="140" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="140" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="183" font-size="28" fill="#252620" font-weight="700">失败画面</text><text x="65" y="223" font-size="22" fill="#595c54" font-weight="400">视觉</text><text x="65" y="257" font-size="25" fill="#252620" font-weight="400">失败提示 + 重试按钮</text><text x="65" y="305" font-size="22" fill="#595c54" font-weight="400">听觉</text><text x="65" y="339" font-size="24" fill="#252620" font-weight="400">两声警告音</text><path d="M471,250 L527,250" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="185" font-size="28" fill="#252620" font-weight="700">替代文档</text><text x="565" y="240" font-size="26" fill="#252620" font-weight="400">在第3段一并描述三项信息</text><rect x="40" y="398" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="398" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="441" font-size="28" fill="#252620" font-weight="700">新码画面</text><text x="65" y="481" font-size="22" fill="#595c54" font-weight="400">视觉</text><text x="65" y="515" font-size="25" fill="#252620" font-weight="400">R7K2-P9M4 + 保存按钮</text><text x="65" y="563" font-size="22" fill="#595c54" font-weight="400">听觉</text><text x="65" y="597" font-size="24" fill="#252620" font-weight="400">提示保存至安全处</text><path d="M471,508 L527,508" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="443" font-size="28" fill="#252620" font-weight="700">替代文档</text><text x="565" y="498" font-size="26" fill="#252620" font-weight="400">在第5段保留值、操作、对白</text><rect x="40" y="656" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="656" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="699" font-size="28" fill="#252620" font-weight="700">完成画面</text><text x="65" y="739" font-size="22" fill="#595c54" font-weight="400">视觉</text><text x="65" y="773" font-size="25" fill="#252620" font-weight="400">保存完成 + 旧码不可用</text><text x="65" y="821" font-size="22" fill="#595c54" font-weight="400">听觉</text><text x="65" y="855" font-size="24" fill="#252620" font-weight="400">“查看生成完成画面。”</text><path d="M471,766 L527,766" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="701" font-size="28" fill="#252620" font-weight="700">替代文档</text><text x="565" y="756" font-size="26" fill="#252620" font-weight="400">在第6段描述完成的具体结果</text><rect x="40" y="935" width="920" height="194" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="980" font-size="28" fill="#252620" font-weight="700">检查项目</text><text x="65" y="1028" font-size="25" fill="#252620" font-weight="400">□ 遗漏含义  □ 颠倒否定句  □ 顺序  □ 实际访问路径</text><text x="65" y="1076" font-size="25" fill="#743f3c" font-weight="700">场景编号、时间码本身并非必需格式。</text><text x="40" y="1185" font-size="26" fill="#595c54" font-weight="400">演示画面的按钮 ≠ 实际观众输入</text><text x="40" y="1234" font-size="24" fill="#595c54" font-weight="400">若确有交互，则确认是否提供等效的选择与结果获取手段。</text></g></svg>