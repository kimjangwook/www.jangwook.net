<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">1.2.3的选项与判定流程</title><desc id="d">1.2.3评估流程。确认评估对象及正文替代例外后，检查原声是否传达了所有重要视觉信息。如需补充说明，则检查音频描述和基于时间的媒体替代方案。若在整个范围内验证了一个充分的方法，则符合。若仅确认了一个方法的缺陷，而其他方法的状况不明确，则暂缓判断。只有进一步确认不存在其他充分的方法，才能判定为不符合。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1190" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">1.2.3的选项与判定流程</text><rect x="190" y="90" width="620" height="90" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="225" y="129" font-size="28" fill="#252620" font-weight="700">确认对象及原始证据范围</text><text x="225" y="161" font-size="23" fill="#595c54" font-weight="400">是否为预录同步视频？</text><path d="M500,180 L500,218" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="120" y="220" width="760" height="106" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="145" y="259" font-size="27" fill="#252620" font-weight="700">确认正文替代例外的两个条件</text><text x="145" y="298" font-size="23" fill="#252620" font-weight="400">无超出正文的信息 + 明确标为替代媒体</text><text x="125" y="352" font-size="23" fill="#743f3c" font-weight="700">两条件均满足 → 不适用</text><path d="M500,326 L500,396" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="120" y="398" width="760" height="100" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="145" y="438" font-size="26" fill="#252620" font-weight="700">仅凭原声能否理解所有重要画面信息？</text><text x="145" y="475" font-size="23" fill="#252620" font-weight="400">若能，则无需补充音频描述</text><text x="125" y="533" font-size="23" fill="#743f3c" font-weight="700">验证全部对应关系 → 符合</text><path d="M500,498 L500,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M500,560 L260,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M260,560 L260,575" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M500,560 L740,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M740,560 L740,575" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="40" y="580" width="440" height="150" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="520" y="580" width="440" height="150" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="66" y="620" font-size="27" fill="#252620" font-weight="700">选项1 · 音频描述</text><text x="66" y="660" font-size="25" fill="#252620" font-weight="400">结合原声，以声音传达</text><text x="66" y="698" font-size="25" fill="#252620" font-weight="400">重要视觉信息</text><text x="546" y="620" font-size="27" fill="#252620" font-weight="700">选项2 · 媒体替代方案</text><text x="546" y="660" font-size="25" fill="#252620" font-weight="400">按相同顺序，以文字传达</text><text x="546" y="698" font-size="25" fill="#252620" font-weight="400">视觉与听觉信息</text><path d="M260,730 L260,780" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M740,730 L740,780" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="40" y="788" width="920" height="256" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="67" y="835" font-size="27" fill="#252620" font-weight="700">在整个范围内验证一个充分方法 → 符合</text><text x="67" y="892" font-size="25" fill="#252620" font-weight="400">一个候选有缺陷 + 其他方法未确认 → 暂缓判断</text><text x="67" y="949" font-size="25" fill="#252620" font-weight="400">确认全部方法状况 + 无充分方法 → 不符合</text><text x="67" y="1006" font-size="25" fill="#743f3c" font-weight="700">原始证据不足 → 候选再详细也暂缓判断</text><text x="40" y="1100" font-size="25" fill="#595c54" font-weight="400">区分单个候选的缺陷与整个准则的不符合。</text><text x="40" y="1145" font-size="25" fill="#595c54" font-weight="400">另行评估1.2.5（AA）的音频描述要求。</text></g></svg>