<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">1.2.3의 선택지와 판정 흐름</title><desc id="d">1.2.3 평가 흐름. 대상과 본문 대안 예외를 확인한 뒤 원음이 중요한 시각 정보를 모두 전달하는지 검토합니다. 추가 설명이 필요하면 오디오 설명과 시간기반 미디어 대안을 확인합니다. 충분한 방법 하나가 전체 범위에서 검증되면 충족입니다. 한 방법의 결함만 확인되고 다른 방법의 현황이 불명확하면 판단 유보입니다. 다른 충분한 방법이 없다는 사실까지 확인되어야 미충족으로 판정합니다.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"/></marker></defs><rect width="1000" height="1190" fill="#faf9f6"/><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">1.2.3의 선택지와 판정 흐름</text><rect x="190" y="90" width="620" height="90" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="225" y="129" font-size="28" fill="#252620" font-weight="700">대상·원본 증거의 범위를 확인</text><text x="225" y="161" font-size="23" fill="#595c54" font-weight="400">사전 녹화 동기화 영상인가?</text><path d="M500,180 L500,218" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><rect x="120" y="220" width="760" height="106" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="145" y="259" font-size="27" fill="#252620" font-weight="700">본문 대안 예외의 두 조건을 모두 확인</text><text x="145" y="298" font-size="23" fill="#252620" font-weight="400">본문보다 추가 정보 없음 + 대안 미디어라는 명확한 표기</text><text x="125" y="352" font-size="23" fill="#743f3c" font-weight="700">두 조건 충족 → 해당 없음</text><path d="M500,326 L500,396" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><rect x="120" y="398" width="760" height="100" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="145" y="438" font-size="26" fill="#252620" font-weight="700">원음만으로 중요한 화면 정보를 모두 이해하는가?</text><text x="145" y="475" font-size="23" fill="#252620" font-weight="400">그렇다면 추가 오디오 설명은 필요하지 않음</text><text x="125" y="533" font-size="23" fill="#743f3c" font-weight="700">전체 대응 검증 → 충족</text><path d="M500,498 L500,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><path d="M500,560 L260,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><path d="M260,560 L260,575" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><path d="M500,560 L740,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><path d="M740,560 L740,575" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="580" width="440" height="150" rx="14" fill="#fff" stroke="#d9d8d0"/><rect x="520" y="580" width="440" height="150" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="66" y="620" font-size="27" fill="#252620" font-weight="700">선택지 1 · 오디오 설명</text><text x="66" y="660" font-size="25" fill="#252620" font-weight="400">원음과 함께 중요한 시각 정보를</text><text x="66" y="698" font-size="25" fill="#252620" font-weight="400">소리로 전달</text><text x="546" y="620" font-size="27" fill="#252620" font-weight="700">선택지 2 · 미디어 대안</text><text x="546" y="660" font-size="25" fill="#252620" font-weight="400">같은 순서로 시각·청각 정보를 글로</text><text x="546" y="698" font-size="25" fill="#252620" font-weight="400">전달</text><path d="M260,730 L260,780" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><path d="M740,730 L740,780" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="788" width="920" height="256" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="67" y="835" font-size="27" fill="#252620" font-weight="700">충분한 방법 하나를 전체 범위에서 검증 → 충족</text><text x="67" y="892" font-size="25" fill="#252620" font-weight="400">한 후보에 결함 + 다른 방법 미확인 → 판단 유보</text><text x="67" y="949" font-size="25" fill="#252620" font-weight="400">전체 방법 현황 확인 + 충분한 방법 없음 → 미충족</text><text x="67" y="1006" font-size="25" fill="#743f3c" font-weight="700">원본 증거 부족 → 후보가 자세해도 판단 유보</text><text x="40" y="1100" font-size="25" fill="#595c54" font-weight="400">단일 후보의 결함과 기준 전체의 미충족을 구별합니다.</text><text x="40" y="1145" font-size="25" fill="#595c54" font-weight="400">1.2.5(AA)의 오디오 설명 요구는 별도로 평가합니다.</text></g></svg>