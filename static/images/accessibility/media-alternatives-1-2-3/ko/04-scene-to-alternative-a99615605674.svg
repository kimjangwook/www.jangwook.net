<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">원본에서 대안으로 연결하기</title><desc id="d">실패·새 코드·완료 장면의 화면 정보와 청각 정보를 대안 문단 3·5·6에 연결합니다. 실패 문구와 경고음, 가상 코드 값과 저장 안내, 완료의 구체적 결과를 함께 보존합니다. 마지막에는 의미·부정문·순서·접근 경로를 검토하는 항목이 있습니다.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"/></marker></defs><rect width="1000" height="1280" fill="#faf9f6"/><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">원본에서 대안으로 연결하기</text><text x="40" y="105" font-size="26" fill="#595c54" font-weight="400">원본의 정보 단위를 먼저 만들고, 후보 문단과 대조합니다.</text><rect x="40" y="140" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"/><rect x="540" y="140" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="65" y="183" font-size="28" fill="#252620" font-weight="700">실패 화면</text><text x="65" y="223" font-size="22" fill="#595c54" font-weight="400">시각</text><text x="65" y="257" font-size="25" fill="#252620" font-weight="400">실패 문구 + 다시 하기 버튼</text><text x="65" y="305" font-size="22" fill="#595c54" font-weight="400">청각</text><text x="65" y="339" font-size="24" fill="#252620" font-weight="400">경고음 두 번</text><path d="M471,250 L527,250" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><text x="565" y="185" font-size="28" fill="#252620" font-weight="700">대안 문서</text><text x="565" y="240" font-size="26" fill="#252620" font-weight="400">문단 3에 세 정보를 함께 서술</text><rect x="40" y="398" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"/><rect x="540" y="398" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="65" y="441" font-size="28" fill="#252620" font-weight="700">새 코드 화면</text><text x="65" y="481" font-size="22" fill="#595c54" font-weight="400">시각</text><text x="65" y="515" font-size="25" fill="#252620" font-weight="400">R7K2-P9M4 + 저장 버튼</text><text x="65" y="563" font-size="22" fill="#595c54" font-weight="400">청각</text><text x="65" y="597" font-size="24" fill="#252620" font-weight="400">안전한 곳에 저장하라는 안내</text><path d="M471,508 L527,508" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><text x="565" y="443" font-size="28" fill="#252620" font-weight="700">대안 문서</text><text x="565" y="498" font-size="26" fill="#252620" font-weight="400">문단 5에 값·행동·대사를 보존</text><rect x="40" y="656" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"/><rect x="540" y="656" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="65" y="699" font-size="28" fill="#252620" font-weight="700">완료 화면</text><text x="65" y="739" font-size="22" fill="#595c54" font-weight="400">시각</text><text x="65" y="773" font-size="25" fill="#252620" font-weight="400">저장 완료 + 이전 코드 사용 불가</text><text x="65" y="821" font-size="22" fill="#595c54" font-weight="400">청각</text><text x="65" y="855" font-size="24" fill="#252620" font-weight="400">“발급 완료 화면을 확인합니다.”</text><path d="M471,766 L527,766" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"/><text x="565" y="701" font-size="28" fill="#252620" font-weight="700">대안 문서</text><text x="565" y="756" font-size="26" fill="#252620" font-weight="400">문단 6에 완료의 구체적 결과 서술</text><rect x="40" y="935" width="920" height="194" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="65" y="980" font-size="28" fill="#252620" font-weight="700">검토 항목</text><text x="65" y="1028" font-size="25" fill="#252620" font-weight="400">□ 빠진 의미  □ 뒤집힌 부정문  □ 순서  □ 실제 접근 경로</text><text x="65" y="1076" font-size="25" fill="#743f3c" font-weight="700">장면 번호·타임코드 자체는 필수 형식이 아닙니다.</text><text x="40" y="1185" font-size="26" fill="#595c54" font-weight="400">시연 화면의 버튼 ≠ 실제 시청자 입력</text><text x="40" y="1234" font-size="24" fill="#595c54" font-weight="400">상호작용이 실제로 있다면 동등한 선택과 결과 수단을 확인합니다.</text></g></svg>