<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">화면과 소리에서 얻는 정보</title><desc id="d">여섯 장면을 읽기 순서에 따라 2열 3행으로 배치한 복구 코드 교육 영상 와이어프레임. 각 장면의 화면 정보와 원음 정보를 별도로 표시합니다. 보안 확인 실패 장면에는 실패 문구와 다시 하기 버튼이 있지만 원음은 경고음 두 번뿐입니다. 새 코드 장면에는 교육용 가상 코드 R7K2-P9M4가 있고, 마지막 장면에는 저장 완료와 이전 코드 사용 불가 상태가 있습니다.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"/></marker></defs><rect width="1000" height="1580" fill="#faf9f6"/><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">화면과 소리에서 얻는 정보</text><text x="40" y="98" font-size="22" fill="#595c54" font-weight="400">읽기 순서: 왼쪽 → 오른쪽, 위 → 아래 · 관찰 구간을 반올림해 표시</text><rect x="40" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="62" y="168" font-size="28" fill="#252620" font-weight="700">01 · 보안 설정</text><text x="62" y="200" font-size="22" fill="#595c54" font-weight="400">0.00–7.33초</text><rect x="60" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="78" y="252" font-size="21" fill="#595c54" font-weight="700">화면</text><text x="78" y="290" font-size="25" fill="#252620" font-weight="400">설정 → 보안 → 복구 코드</text><rect x="78" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"/><text x="94" y="405" font-size="23" fill="#252620" font-weight="400">새 코드 발급</text><text x="62" y="470" font-size="22" fill="#743f3c" font-weight="700">원음</text><text x="62" y="506" font-size="23" fill="#252620" font-weight="400">보안 선택 안내와 “이전 코드를 지금</text><text x="62" y="542" font-size="23" fill="#252620" font-weight="400">버려도 되나요?”</text><rect x="510" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="532" y="168" font-size="28" fill="#252620" font-weight="700">02 · 발급 전 확인</text><text x="532" y="200" font-size="22" fill="#595c54" font-weight="400">7.33–11.92초</text><rect x="530" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="548" y="252" font-size="21" fill="#595c54" font-weight="700">화면</text><text x="548" y="290" font-size="25" fill="#252620" font-weight="400">새 코드를 저장하기 전에는 이전</text><text x="548" y="328" font-size="25" fill="#252620" font-weight="400">코드를 버리지 마세요.</text><rect x="548" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"/><text x="564" y="405" font-size="23" fill="#252620" font-weight="400">이전 코드 유지</text><text x="532" y="470" font-size="22" fill="#743f3c" font-weight="700">원음</text><text x="532" y="506" font-size="23" fill="#252620" font-weight="400">“아니요. 새 복구 코드를 저장하기 전에는</text><text x="532" y="542" font-size="23" fill="#252620" font-weight="400">버리지 마세요.”</text><rect x="40" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="62" y="628" font-size="28" fill="#252620" font-weight="700">03 · 보안 확인 실패</text><text x="62" y="660" font-size="22" fill="#595c54" font-weight="400">11.92–16.13초</text><rect x="60" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="78" y="712" font-size="21" fill="#595c54" font-weight="700">화면</text><text x="78" y="750" font-size="25" fill="#252620" font-weight="400">보안 확인에 실패했습니다. 다시</text><text x="78" y="788" font-size="25" fill="#252620" font-weight="400">인증해 주세요.</text><rect x="78" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"/><text x="94" y="865" font-size="23" fill="#252620" font-weight="400">보안 확인 다시 하기</text><text x="62" y="930" font-size="22" fill="#743f3c" font-weight="700">원음</text><text x="62" y="966" font-size="23" fill="#252620" font-weight="400">대사 없음. 경고음 두 번</text><rect x="510" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="532" y="628" font-size="28" fill="#252620" font-weight="700">04 · 재인증 완료</text><text x="532" y="660" font-size="22" fill="#595c54" font-weight="400">16.13–19.79초</text><rect x="530" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="548" y="712" font-size="21" fill="#595c54" font-weight="700">화면</text><text x="548" y="750" font-size="25" fill="#252620" font-weight="400">보안 확인이 완료되었습니다. 새</text><text x="548" y="788" font-size="25" fill="#252620" font-weight="400">코드 발급을 확인하세요.</text><rect x="548" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"/><text x="564" y="865" font-size="23" fill="#252620" font-weight="400">발급 확인</text><text x="532" y="930" font-size="22" fill="#743f3c" font-weight="700">원음</text><text x="532" y="966" font-size="23" fill="#252620" font-weight="400">“보안 확인을 다시 끝낸 뒤 발급을</text><text x="532" y="1002" font-size="23" fill="#252620" font-weight="400">확인합니다.”</text><rect x="40" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="62" y="1088" font-size="28" fill="#252620" font-weight="700">05 · 새 복구 코드</text><text x="62" y="1120" font-size="22" fill="#595c54" font-weight="400">19.79–27.00초</text><rect x="60" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="78" y="1172" font-size="21" fill="#595c54" font-weight="700">화면</text><text x="78" y="1210" font-size="25" fill="#252620" font-weight="400">가상 코드: R7K2-P9M4 실제 계정</text><text x="78" y="1248" font-size="25" fill="#252620" font-weight="400">사용 불가</text><rect x="78" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"/><text x="94" y="1325" font-size="23" fill="#252620" font-weight="400">코드 저장</text><text x="62" y="1390" font-size="22" fill="#743f3c" font-weight="700">원음</text><text x="62" y="1426" font-size="23" fill="#252620" font-weight="400">안전한 곳에 저장하라는 안내. 이전 코드</text><text x="62" y="1462" font-size="23" fill="#252620" font-weight="400">사용 불가</text><rect x="510" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="532" y="1088" font-size="28" fill="#252620" font-weight="700">06 · 발급 완료</text><text x="532" y="1120" font-size="22" fill="#595c54" font-weight="400">27.00–31.21초</text><rect x="530" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="548" y="1172" font-size="21" fill="#595c54" font-weight="700">화면</text><text x="548" y="1210" font-size="25" fill="#252620" font-weight="400">새 코드 저장 완료 · 이전 코드 사용</text><text x="548" y="1248" font-size="25" fill="#252620" font-weight="400">불가</text><rect x="548" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"/><text x="564" y="1325" font-size="23" fill="#252620" font-weight="400">설정으로 돌아가기</text><text x="532" y="1390" font-size="22" fill="#743f3c" font-weight="700">원음</text><text x="532" y="1426" font-size="23" fill="#252620" font-weight="400">“발급 완료 화면을 확인합니다.”</text><text x="40" y="1542" font-size="22" fill="#595c54" font-weight="400">녹화된 가상 시연 · 실제 계정 조작 없음 · 화면과 소리의 정보를 따로 대조합니다.</text></g></svg>