<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1025" viewBox="0 0 1000 1025" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">전사와 전체 대안의 차이</title><desc id="d">실패 장면의 전사와 전체 대안을 비교합니다. 대사·소리만 옮긴 전사에는 경고음 두 번만 있습니다. 시각 설명을 보강한 대안에는 보안 확인 실패 문구, 다시 하기 버튼과 경고음이 모두 있습니다. 오디오 설명은 원음과 함께 시각 정보를 소리로 전달하고, 미디어 대안은 화면·대사·소리를 같은 순서의 글로 전달합니다.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"/></marker></defs><rect width="1000" height="1025" fill="#faf9f6"/><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">전사와 전체 대안의 차이</text><text x="40" y="105" font-size="26" fill="#595c54" font-weight="400">같은 실패 장면에서, 무엇이 빠졌는지 직접 비교합니다.</text><rect x="40" y="140" width="440" height="300" rx="14" fill="#fff" stroke="#d9d8d0"/><rect x="520" y="140" width="440" height="300" rx="14" fill="#fff" stroke="#d9d8d0"/><text x="65" y="187" font-size="28" fill="#252620" font-weight="700">대사·소리만 옮긴 전사</text><text x="65" y="248" font-size="28" fill="#252620" font-weight="400">[경고음 두 번]</text><text x="65" y="313" font-size="25" fill="#743f3c" font-weight="400">보안 확인에 실패했다는 화면</text><text x="65" y="351" font-size="25" fill="#743f3c" font-weight="400">문구와 재인증 버튼은 빠짐</text><text x="545" y="187" font-size="28" fill="#252620" font-weight="700">시각 설명을 보강한 대안</text><text x="545" y="240" font-size="25" fill="#252620" font-weight="400">“보안 확인에 실패했습니다. 다시</text><text x="545" y="278" font-size="25" fill="#252620" font-weight="400">인증해 주세요.”와 ‘보안 확인</text><text x="545" y="316" font-size="25" fill="#252620" font-weight="400">다시 하기’ 버튼이 보입니다.</text><text x="545" y="354" font-size="25" fill="#252620" font-weight="400">경고음이 두 번 울립니다.</text><text x="40" y="490" font-size="25" fill="#743f3c" font-weight="700">전사에 시각 정보를 더하면 충분한 미디어 대안이 될 수 있습니다.</text><rect x="40" y="535" width="920" height="290" rx="14" fill="#efede6" stroke="#d9d8d0"/><text x="65" y="580" font-size="28" fill="#252620" font-weight="700">오디오 설명</text><text x="65" y="625" font-size="26" fill="#252620" font-weight="400">원음 + 필요한 시각 설명 → 소리로 이해. 원음을 다시 전사할 의무는 없음.</text><text x="65" y="720" font-size="28" fill="#252620" font-weight="700">시간기반 미디어 대안</text><text x="65" y="765" font-size="26" fill="#252620" font-weight="400">화면 + 대사 + 의미 있는 소리 → 같은 순서의 글로 이해.</text><text x="40" y="885" font-size="26" fill="#595c54" font-weight="400">형식의 이름보다 실제 내용과 접근 경로를 확인합니다.</text><text x="40" y="934" font-size="25" fill="#595c54" font-weight="400">오디오 설명도 필요한 시각 정보를 모두 전달할 수 있습니다.</text><text x="40" y="979" font-size="25" fill="#595c54" font-weight="400">대사가 빽빽하면 확장 설명·설명 통합 나레이션 등을 검토합니다.</text></g></svg>