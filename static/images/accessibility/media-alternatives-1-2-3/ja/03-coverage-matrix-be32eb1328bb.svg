<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1000" height="1025" viewBox="0 0 1000 1025" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">書き起こしと完全な代替の違い</title><desc id="d">失敗の場面の書き起こしと完全な代替を比較します。セリフ・音だけを書き起こしたものには、警告音2回しかありません。視覚的な説明を補った代替には、セキュリティ確認失敗の文言、再試行ボタンと警告音がすべてあります。音声解説は元の音声とともに視覚情報を音で伝え、メディアの代替は画面・セリフ・音を同じ順序の文章で伝えます。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1025" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">書き起こしと完全な代替の違い</text><text x="40" y="105" font-size="26" fill="#595c54" font-weight="400">同じ失敗の場面で、何が欠けているかを直接比較します。</text><rect x="40" y="140" width="440" height="300" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="520" y="140" width="440" height="300" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="65" y="187" font-size="28" fill="#252620" font-weight="700">セリフ・音だけの書き起こし</text><text x="65" y="248" font-size="28" fill="#252620" font-weight="400">[警告音2回]</text><text x="65" y="313" font-size="24.2" fill="#743f3c" font-weight="400">セキュリティ確認に失敗したという画面の</text><text x="65" y="351" font-size="25" fill="#743f3c" font-weight="400">文言と再認証ボタンが欠落</text><text x="545" y="187" font-size="28" fill="#252620" font-weight="700">視覚的な説明を補った代替</text><text x="545" y="240" font-size="25" fill="#252620" font-weight="400">「セキュリティ確認に失敗しました。再度</text><text x="545" y="278" font-size="23.3" fill="#252620" font-weight="400">認証してください。」と「セキュリティ確認を</text><text x="545" y="316" font-size="25" fill="#252620" font-weight="400">再試行」ボタンが表示されています。</text><text x="545" y="354" font-size="25" fill="#252620" font-weight="400">警告音が2回鳴ります。</text><text x="40" y="490" font-size="25" fill="#743f3c" font-weight="700">書き起こしに視覚情報を加えると、十分なメディアの代替になり得ます。</text><rect x="40" y="535" width="920" height="290" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="580" font-size="28" fill="#252620" font-weight="700">音声解説</text><text x="65" y="625" font-size="26" fill="#252620" font-weight="400">元の音声 + 必要な視覚説明 → 音で理解。元の音声の再書き起こしは不要。</text><text x="65" y="720" font-size="28" fill="#252620" font-weight="700">時間依存メディアの代替</text><text x="65" y="765" font-size="26" fill="#252620" font-weight="400">画面 + セリフ + 意味のある音 → 同じ順序の文章で理解。</text><text x="40" y="885" font-size="26" fill="#595c54" font-weight="400">形式の名称よりも実際の内容とアクセス経路を確認します。</text><text x="40" y="934" font-size="25" fill="#595c54" font-weight="400">音声解説も必要な視覚情報をすべて伝えられます。</text><text x="40" y="979" font-size="25" fill="#595c54" font-weight="400">セリフが詰まっている場合は、拡張音声解説・説明を統合したナレーションなどを検討します。</text></g></svg>