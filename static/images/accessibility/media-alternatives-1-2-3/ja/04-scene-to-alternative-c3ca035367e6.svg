<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">原本から代替への対応付け</title><desc id="d">失敗・新しいコード・完了の場面の画面情報と聴覚情報を、代替の段落3・5・6に対応付けます。失敗の文言と警告音、架空コードの値と保存の案内、完了の具体的な結果をともに保持します。最後に、意味・否定文・順序・アクセス経路を検討する項目があります。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1280" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">原本から代替への対応付け</text><text x="40" y="105" font-size="26" fill="#595c54" font-weight="400">まず原本の情報単位を作り、候補の段落と照合します。</text><rect x="40" y="140" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="140" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="183" font-size="28" fill="#252620" font-weight="700">失敗画面</text><text x="65" y="223" font-size="22" fill="#595c54" font-weight="400">視覚</text><text x="65" y="257" font-size="25" fill="#252620" font-weight="400">失敗の文言 + 再試行ボタン</text><text x="65" y="305" font-size="22" fill="#595c54" font-weight="400">聴覚</text><text x="65" y="339" font-size="24" fill="#252620" font-weight="400">警告音2回</text><path d="M471,250 L527,250" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="185" font-size="28" fill="#252620" font-weight="700">代替文書</text><text x="565" y="240" font-size="26" fill="#252620" font-weight="400">段落3に3つの情報をまとめて記述</text><rect x="40" y="398" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="398" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="441" font-size="28" fill="#252620" font-weight="700">新しいコードの画面</text><text x="65" y="481" font-size="22" fill="#595c54" font-weight="400">視覚</text><text x="65" y="515" font-size="25" fill="#252620" font-weight="400">R7K2-P9M4 + 保存ボタン</text><text x="65" y="563" font-size="22" fill="#595c54" font-weight="400">聴覚</text><text x="65" y="597" font-size="24" fill="#252620" font-weight="400">安全な場所に保存する案内</text><path d="M471,508 L527,508" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="443" font-size="28" fill="#252620" font-weight="700">代替文書</text><text x="565" y="498" font-size="26" fill="#252620" font-weight="400">段落5に値・行動・セリフを保持</text><rect x="40" y="656" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="656" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="699" font-size="28" fill="#252620" font-weight="700">完了画面</text><text x="65" y="739" font-size="22" fill="#595c54" font-weight="400">視覚</text><text x="65" y="773" font-size="25" fill="#252620" font-weight="400">保存完了 + 以前のコードは使用不可</text><text x="65" y="821" font-size="22" fill="#595c54" font-weight="400">聴覚</text><text x="65" y="855" font-size="24" fill="#252620" font-weight="400">「発行完了画面を確認します。」</text><path d="M471,766 L527,766" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="701" font-size="28" fill="#252620" font-weight="700">代替文書</text><text x="565" y="756" font-size="26" fill="#252620" font-weight="400">段落6に完了の具体的な結果を記述</text><rect x="40" y="935" width="920" height="194" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="980" font-size="28" fill="#252620" font-weight="700">検討項目</text><text x="65" y="1028" font-size="25" fill="#252620" font-weight="400">□ 意味の欠落  □ 否定文の反転  □ 順序  □ 実際のアクセス経路</text><text x="65" y="1076" font-size="25" fill="#743f3c" font-weight="700">場面番号・タイムコード自体は必須の形式ではありません。</text><text x="40" y="1185" font-size="26" fill="#595c54" font-weight="400">デモ画面のボタン ≠ 実際の視聴者の入力</text><text x="40" y="1234" font-size="24" fill="#595c54" font-weight="400">実際に操作がある場合は、同等の選択と結果を得る手段を確認します。</text></g></svg>