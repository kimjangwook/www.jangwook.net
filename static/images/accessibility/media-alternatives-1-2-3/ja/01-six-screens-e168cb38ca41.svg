<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">画面と音から得られる情報</title><desc id="d">6つの場面を読む順序に従って2列3行に配置した、復旧コードの教育動画のワイヤーフレーム。各場面の画面情報と元の音声情報を別々に示します。セキュリティ確認失敗の場面には失敗の文言と再試行ボタンがありますが、元の音声は警告音2回だけです。新しいコードの場面には教育用の架空コードR7K2-P9M4があり、最後の場面には保存完了と以前のコードが使用不可である状態が示されます。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1580" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">画面と音から得られる情報</text><text x="40" y="98" font-size="22" fill="#595c54" font-weight="400">読む順序：左 → 右、上 → 下 · 観察区間は丸めて表示</text><rect x="40" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="168" font-size="28" fill="#252620" font-weight="700">01 · セキュリティ設定</text><text x="62" y="200" font-size="22" fill="#595c54" font-weight="400">0.00–7.33秒</text><rect x="60" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="252" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="78" y="290" font-size="25" fill="#252620" font-weight="400">設定 → セキュリティ → 復旧コード</text><rect x="78" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="405" font-size="23" fill="#252620" font-weight="400">新しいコードを発行</text><text x="62" y="470" font-size="22" fill="#743f3c" font-weight="700">元の音声</text><text x="62" y="506" font-size="23" fill="#252620" font-weight="400">セキュリティ選択の案内と「以前のコードを今</text><text x="62" y="542" font-size="23" fill="#252620" font-weight="400">捨ててもよいですか？」</text><rect x="510" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="168" font-size="28" fill="#252620" font-weight="700">02 · 発行前の確認</text><text x="532" y="200" font-size="22" fill="#595c54" font-weight="400">7.33–11.92秒</text><rect x="530" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="252" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="548" y="290" font-size="24.5" fill="#252620" font-weight="400">新しいコードを保存するまでは、以前の</text><text x="548" y="328" font-size="25" fill="#252620" font-weight="400">コードを捨てないでください。</text><rect x="548" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="405" font-size="23" fill="#252620" font-weight="400">以前のコードを保持</text><text x="532" y="470" font-size="22" fill="#743f3c" font-weight="700">元の音声</text><text x="532" y="506" font-size="22.5" fill="#252620" font-weight="400">「いいえ。新しい復旧コードを保存するまでは、</text><text x="532" y="542" font-size="23" fill="#252620" font-weight="400">捨てないでください。」</text><rect x="40" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="628" font-size="28" fill="#252620" font-weight="700">03 · セキュリティ確認失敗</text><text x="62" y="660" font-size="22" fill="#595c54" font-weight="400">11.92–16.13秒</text><rect x="60" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="712" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="78" y="750" font-size="24.4" fill="#252620" font-weight="400">セキュリティ確認に失敗しました。再度</text><text x="78" y="788" font-size="25" fill="#252620" font-weight="400">認証してください。</text><rect x="78" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="865" font-size="23" fill="#252620" font-weight="400">セキュリティ確認を再試行</text><text x="62" y="930" font-size="22" fill="#743f3c" font-weight="700">元の音声</text><text x="62" y="966" font-size="23" fill="#252620" font-weight="400">セリフなし。警告音2回</text><rect x="510" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="628" font-size="28" fill="#252620" font-weight="700">04 · 再認証完了</text><text x="532" y="660" font-size="22" fill="#595c54" font-weight="400">16.13–19.79秒</text><rect x="530" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="712" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="548" y="750" font-size="23.1" fill="#252620" font-weight="400">セキュリティ確認が完了しました。新しい</text><text x="548" y="788" font-size="25" fill="#252620" font-weight="400">コードの発行を確認してください。</text><rect x="548" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="865" font-size="23" fill="#252620" font-weight="400">発行を確認</text><text x="532" y="930" font-size="22" fill="#743f3c" font-weight="700">元の音声</text><text x="532" y="966" font-size="23" fill="#252620" font-weight="400">「セキュリティ確認を再度終えてから、発行を</text><text x="532" y="1002" font-size="23" fill="#252620" font-weight="400">確認します。」</text><rect x="40" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="1088" font-size="28" fill="#252620" font-weight="700">05 · 新しい復旧コード</text><text x="62" y="1120" font-size="22" fill="#595c54" font-weight="400">19.79–27.00秒</text><rect x="60" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="1172" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="78" y="1210" font-size="19.5" fill="#252620" font-weight="400">架空コード：R7K2-P9M4 実際のアカウントでは</text><text x="78" y="1248" font-size="25" fill="#252620" font-weight="400">使用不可</text><rect x="78" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="1325" font-size="23" fill="#252620" font-weight="400">コードを保存</text><text x="62" y="1390" font-size="22" fill="#743f3c" font-weight="700">元の音声</text><text x="62" y="1426" font-size="23" fill="#252620" font-weight="400">安全な場所に保存する案内。以前のコードは</text><text x="62" y="1462" font-size="23" fill="#252620" font-weight="400">使用不可</text><rect x="510" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="1088" font-size="28" fill="#252620" font-weight="700">06 · 発行完了</text><text x="532" y="1120" font-size="22" fill="#595c54" font-weight="400">27.00–31.21秒</text><rect x="530" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="1172" font-size="21" fill="#595c54" font-weight="700">画面</text><text x="548" y="1210" font-size="20.8" fill="#252620" font-weight="400">新しいコードの保存完了 · 以前のコードは使用</text><text x="548" y="1248" font-size="25" fill="#252620" font-weight="400">不可</text><rect x="548" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="1325" font-size="23" fill="#252620" font-weight="400">設定に戻る</text><text x="532" y="1390" font-size="22" fill="#743f3c" font-weight="700">元の音声</text><text x="532" y="1426" font-size="23" fill="#252620" font-weight="400">「発行完了画面を確認します。」</text><text x="40" y="1542" font-size="22" fill="#595c54" font-weight="400">録画された架空のデモ · 実際のアカウント操作なし · 画面と音の情報を別々に照合します。</text></g></svg>