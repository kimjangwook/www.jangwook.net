<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">1.2.3の選択肢と判定の流れ</title><desc id="d">1.2.3の評価の流れ。対象と本文の代替である場合の例外を確認した後、元の音声が重要な視覚情報をすべて伝えているかを検討します。追加説明が必要な場合は、音声解説と時間依存メディアの代替を確認します。十分な方法が1つ、全範囲で検証できれば適合です。1つの方法の欠陥だけが確認され、他の方法の状況が不明な場合は判断保留です。他に十分な方法がないという事実まで確認して初めて不適合と判定します。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1190" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">1.2.3の選択肢と判定の流れ</text><rect x="190" y="90" width="620" height="90" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="225" y="129" font-size="28" fill="#252620" font-weight="700">対象・原本の証拠の範囲を確認</text><text x="225" y="161" font-size="23" fill="#595c54" font-weight="400">収録済みの同期した動画か？</text><path d="M500,180 L500,218" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="120" y="220" width="760" height="106" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="145" y="259" font-size="27" fill="#252620" font-weight="700">本文の代替である場合の例外の2条件を確認</text><text x="145" y="298" font-size="23" fill="#252620" font-weight="400">本文より追加情報なし + 代替メディアと明確に表示</text><text x="125" y="352" font-size="23" fill="#743f3c" font-weight="700">2条件を満たす → 該当なし</text><path d="M500,326 L500,396" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="120" y="398" width="760" height="100" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="145" y="438" font-size="26" fill="#252620" font-weight="700">元の音声だけで重要な画面情報をすべて理解できるか？</text><text x="145" y="475" font-size="23" fill="#252620" font-weight="400">できれば追加の音声解説は不要</text><text x="125" y="533" font-size="23" fill="#743f3c" font-weight="700">全体の対応を検証 → 適合</text><path d="M500,498 L500,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M500,560 L260,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M260,560 L260,575" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M500,560 L740,560" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M740,560 L740,575" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="40" y="580" width="440" height="150" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="520" y="580" width="440" height="150" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="66" y="620" font-size="27" fill="#252620" font-weight="700">選択肢1 · 音声解説</text><text x="66" y="660" font-size="25" fill="#252620" font-weight="400">元の音声とともに重要な視覚情報を</text><text x="66" y="698" font-size="25" fill="#252620" font-weight="400">音で伝える</text><text x="546" y="620" font-size="27" fill="#252620" font-weight="700">選択肢2 · メディアの代替</text><text x="546" y="660" font-size="25" fill="#252620" font-weight="400">同じ順序で視覚・聴覚情報を文章で</text><text x="546" y="698" font-size="25" fill="#252620" font-weight="400">伝える</text><path d="M260,730 L260,780" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><path d="M740,730 L740,780" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><rect x="40" y="788" width="920" height="256" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="67" y="835" font-size="27" fill="#252620" font-weight="700">十分な方法1つを全範囲で検証 → 適合</text><text x="67" y="892" font-size="25" fill="#252620" font-weight="400">1候補に欠陥 + 他の方法は未確認 → 判断保留</text><text x="67" y="949" font-size="25" fill="#252620" font-weight="400">全方法の状況を確認 + 十分な方法なし → 不適合</text><text x="67" y="1006" font-size="25" fill="#743f3c" font-weight="700">原本の証拠不足 → 候補が詳しくても判断保留</text><text x="40" y="1100" font-size="25" fill="#595c54" font-weight="400">単一候補の欠陥と達成基準全体の不適合を区別します。</text><text x="40" y="1145" font-size="25" fill="#595c54" font-weight="400">1.2.5（AA）の音声解説の要求は別途評価します。</text></g></svg>