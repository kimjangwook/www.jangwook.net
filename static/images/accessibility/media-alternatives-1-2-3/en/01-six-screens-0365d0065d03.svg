<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">Information from screen and sound</title><desc id="d">A recovery code tutorial video wireframe with six scenes arranged in two columns and three rows in reading order. Screen information and original audio information are shown separately for each scene. The security check failure scene has a failure message and a retry button, but the original audio contains only two warning beeps. The new code scene contains the fictional training code R7K2-P9M4, and the final scene shows that saving is complete and the previous code is unusable.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1580" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">Information from screen and sound</text><text x="40" y="98" font-size="22" fill="#595c54" font-weight="400">Reading order: left → right, top → bottom · Observed intervals rounded</text><rect x="40" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="168" font-size="28" fill="#252620" font-weight="700">01 · Security settings</text><text x="62" y="200" font-size="22" fill="#595c54" font-weight="400">0.00–7.33 s</text><rect x="60" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="252" font-size="21" fill="#595c54" font-weight="700">Screen</text><text x="78" y="290" font-size="23.8" fill="#252620" font-weight="400">Settings → Security → Recovery codes</text><rect x="78" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="405" font-size="23" fill="#252620" font-weight="400">Issue new code</text><text x="62" y="470" font-size="22" fill="#743f3c" font-weight="700">Original audio</text><text x="62" y="506" font-size="23" fill="#252620" font-weight="400">Security selection guidance and “Can I</text><text x="62" y="542" font-size="23" fill="#252620" font-weight="400">discard the old code now?”</text><rect x="510" y="130" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="168" font-size="28" fill="#252620" font-weight="700">02 · Before issuance</text><text x="532" y="200" font-size="22" fill="#595c54" font-weight="400">7.33–11.92 s</text><rect x="530" y="218" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="252" font-size="21" fill="#595c54" font-weight="700">Screen</text><text x="548" y="290" font-size="25" fill="#252620" font-weight="400">Do not discard the old code</text><text x="548" y="328" font-size="25" fill="#252620" font-weight="400">before saving the new code.</text><rect x="548" y="377" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="405" font-size="23" fill="#252620" font-weight="400">Keep old code</text><text x="532" y="470" font-size="22" fill="#743f3c" font-weight="700">Original audio</text><text x="532" y="506" font-size="23" fill="#252620" font-weight="400">“No. Do not discard it before</text><text x="532" y="542" font-size="23" fill="#252620" font-weight="400">saving the new recovery code.”</text><rect x="40" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="628" font-size="28" fill="#252620" font-weight="700">03 · Security check failed</text><text x="62" y="660" font-size="22" fill="#595c54" font-weight="400">11.92–16.13 s</text><rect x="60" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="712" font-size="21" fill="#595c54" font-weight="700">Screen</text><text x="78" y="750" font-size="25" fill="#252620" font-weight="400">Security check failed.</text><text x="78" y="788" font-size="25" fill="#252620" font-weight="400">Please authenticate again.</text><rect x="78" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="865" font-size="23" fill="#252620" font-weight="400">Retry security check</text><text x="62" y="930" font-size="22" fill="#743f3c" font-weight="700">Original audio</text><text x="62" y="966" font-size="23" fill="#252620" font-weight="400">No dialogue. Two warning beeps</text><rect x="510" y="590" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="628" font-size="28" fill="#252620" font-weight="700">04 · Reauthentication complete</text><text x="532" y="660" font-size="22" fill="#595c54" font-weight="400">16.13–19.79 s</text><rect x="530" y="678" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="712" font-size="21" fill="#595c54" font-weight="700">Screen</text><text x="548" y="750" font-size="25" fill="#252620" font-weight="400">Security check complete.</text><text x="548" y="788" font-size="25" fill="#252620" font-weight="400">Confirm new code issuance.</text><rect x="548" y="837" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="865" font-size="23" fill="#252620" font-weight="400">Confirm issuance</text><text x="532" y="930" font-size="22" fill="#743f3c" font-weight="700">Original audio</text><text x="532" y="966" font-size="23" fill="#252620" font-weight="400">“After repeating the security check,</text><text x="532" y="1002" font-size="23" fill="#252620" font-weight="400">confirm issuance.”</text><rect x="40" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="62" y="1088" font-size="28" fill="#252620" font-weight="700">05 · New recovery code</text><text x="62" y="1120" font-size="22" fill="#595c54" font-weight="400">19.79–27.00 s</text><rect x="60" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="78" y="1172" font-size="21" fill="#595c54" font-weight="700">Screen</text><text x="78" y="1210" font-size="24.4" fill="#252620" font-weight="400">Fictional code: R7K2-P9M4 Not valid</text><text x="78" y="1248" font-size="25" fill="#252620" font-weight="400">for real accounts</text><rect x="78" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="94" y="1325" font-size="23" fill="#252620" font-weight="400">Save code</text><text x="62" y="1390" font-size="22" fill="#743f3c" font-weight="700">Original audio</text><text x="62" y="1426" font-size="23" fill="#252620" font-weight="400">Guidance to save safely. Old code</text><text x="62" y="1462" font-size="23" fill="#252620" font-weight="400">no longer usable</text><rect x="510" y="1050" width="450" height="440" rx="14" fill="#fff" stroke="#d9d8d0"></rect><text x="532" y="1088" font-size="28" fill="#252620" font-weight="700">06 · Issuance complete</text><text x="532" y="1120" font-size="22" fill="#595c54" font-weight="400">27.00–31.21 s</text><rect x="530" y="1138" width="410" height="215" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="548" y="1172" font-size="21" fill="#595c54" font-weight="700">Screen</text><text x="548" y="1210" font-size="25" fill="#252620" font-weight="400">New code saved · Old code</text><text x="548" y="1248" font-size="25" fill="#252620" font-weight="400">no longer usable</text><rect x="548" y="1297" width="374" height="40" rx="14" fill="#fff" stroke="#743f3c"></rect><text x="564" y="1325" font-size="23" fill="#252620" font-weight="400">Return to settings</text><text x="532" y="1390" font-size="22" fill="#743f3c" font-weight="700">Original audio</text><text x="532" y="1426" font-size="23" fill="#252620" font-weight="400">“Check the issuance complete screen.”</text><text x="40" y="1542" font-size="21.2" fill="#595c54" font-weight="400">Recorded fictional demo · No real account operations · Compare screen and sound information separately.</text></g></svg>