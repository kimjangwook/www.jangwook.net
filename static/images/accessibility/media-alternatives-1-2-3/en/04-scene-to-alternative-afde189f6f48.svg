<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">Linking the original to an alternative</title><desc id="d">Links screen and audio information from the failure, new code, and completion scenes to paragraphs 3, 5, and 6 of the alternative. Preserves the failure message and warning beeps, the fictional code value and saving guidance, and the specific completion results together. The final review items cover meaning, negation, order, and access paths.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#743f3c"></path></marker></defs><rect width="1000" height="1280" fill="#faf9f6"></rect><g font-family="Noto Sans KR, Noto Sans KR Variable, Apple SD Gothic Neo, sans-serif"><text x="40" y="55" font-size="34" fill="#252620" font-weight="700">Linking the original to an alternative</text><text x="40" y="105" font-size="26" fill="#595c54" font-weight="400">First identify information units in the original, then compare candidate paragraphs.</text><rect x="40" y="140" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="140" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="183" font-size="28" fill="#252620" font-weight="700">Failure screen</text><text x="65" y="223" font-size="22" fill="#595c54" font-weight="400">Visual</text><text x="65" y="257" font-size="25" fill="#252620" font-weight="400">Failure message + retry button</text><text x="65" y="305" font-size="22" fill="#595c54" font-weight="400">Audio</text><text x="65" y="339" font-size="24" fill="#252620" font-weight="400">Two warning beeps</text><path d="M471,250 L527,250" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="185" font-size="28" fill="#252620" font-weight="700">Alternative document</text><text x="565" y="240" font-size="26" fill="#252620" font-weight="400">Describe all three in paragraph 3</text><rect x="40" y="398" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="398" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="441" font-size="28" fill="#252620" font-weight="700">New code screen</text><text x="65" y="481" font-size="22" fill="#595c54" font-weight="400">Visual</text><text x="65" y="515" font-size="25" fill="#252620" font-weight="400">R7K2-P9M4 + Save button</text><text x="65" y="563" font-size="22" fill="#595c54" font-weight="400">Audio</text><text x="65" y="597" font-size="24" fill="#252620" font-weight="400">Guidance to save in a safe place</text><path d="M471,508 L527,508" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="443" font-size="28" fill="#252620" font-weight="700">Alternative document</text><text x="565" y="498" font-size="21.2" fill="#252620" font-weight="400">Keep value, action, dialogue in paragraph 5</text><rect x="40" y="656" width="420" height="230" rx="14" fill="#fff" stroke="#d9d8d0"></rect><rect x="540" y="656" width="420" height="230" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="699" font-size="28" fill="#252620" font-weight="700">Completion screen</text><text x="65" y="739" font-size="22" fill="#595c54" font-weight="400">Visual</text><text x="65" y="773" font-size="25" fill="#252620" font-weight="400">Saved + old code no longer usable</text><text x="65" y="821" font-size="22" fill="#595c54" font-weight="400">Audio</text><text x="65" y="855" font-size="23.7" fill="#252620" font-weight="400">“Check the issuance complete screen.”</text><path d="M471,766 L527,766" fill="none" stroke="#743f3c" stroke-width="3" marker-end="url(#a)"></path><text x="565" y="701" font-size="28" fill="#252620" font-weight="700">Alternative document</text><text x="565" y="756" font-size="25.5" fill="#252620" font-weight="400">State specific results in paragraph 6</text><rect x="40" y="935" width="920" height="194" rx="14" fill="#efede6" stroke="#d9d8d0"></rect><text x="65" y="980" font-size="28" fill="#252620" font-weight="700">Review items</text><text x="65" y="1028" font-size="25" fill="#252620" font-weight="400">□ Missing meaning  □ Reversed negation  □ Order  □ Actual access path</text><text x="65" y="1076" font-size="25" fill="#743f3c" font-weight="700">Scene numbers and timecodes are not required formats.</text><text x="40" y="1185" font-size="26" fill="#595c54" font-weight="400">Demo screen buttons ≠ actual viewer input</text><text x="40" y="1234" font-size="24" fill="#595c54" font-weight="400">If interaction actually exists, check equivalent means for choices and results.</text></g></svg>