<svg xmlns="http://www.w3.org/2000/svg" width="840" height="974" viewBox="0 0 840 974" role="img" aria-labelledby="title desc"><title id="title">가입 과정의 상태별 평가</title><desc id="desc">입력 화면에서 약관을 열고 닫아 입력을 이어갑니다. 잘못된 이메일을 제출한 오류 상태, 수정 후 재제출, 가입 완료 상태까지 각각 관찰합니다. 한 번의 최초 화면 검사로 이 과정을 확인했다고 할 수 없습니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"/></marker></defs><rect width="840" height="974" rx="16" fill="#f6f7f3"/><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 02 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">한 URL, 여러 평가 상태</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">가입 과정의 가상 예시입니다.</text><rect x="64" y="190" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="233" font-size="28" font-weight="600" fill="#52645b">01</text><text x="150" y="234" font-size="34" font-weight="600" fill="#252525">입력 화면</text><text x="150" y="272" font-size="27" font-weight="400" fill="#535953">항목의 이름과 입력 조건을 확인</text><path d="M420 304 L420 322" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="330" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="373" font-size="28" font-weight="600" fill="#52645b">02</text><text x="150" y="374" font-size="34" font-weight="600" fill="#252525">약관 팝업</text><text x="150" y="412" font-size="27" font-weight="400" fill="#535953">초점 이동 → 내용 확인 → 닫고 복귀</text><path d="M420 444 L420 462" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="470" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="513" font-size="28" font-weight="600" fill="#52645b">03</text><text x="150" y="514" font-size="34" font-weight="600" fill="#252525">잘못된 이메일 제출</text><text x="150" y="552" font-size="27" font-weight="400" fill="#535953">오류 항목과 수정 안내를 확인</text><path d="M420 584 L420 602" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="610" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="653" font-size="28" font-weight="600" fill="#52645b">04</text><text x="150" y="654" font-size="34" font-weight="600" fill="#252525">입력 수정 후 재제출</text><text x="150" y="692" font-size="27" font-weight="400" fill="#535953">오류 해소와 다음 단계 이동을 확인</text><path d="M420 724 L420 742" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="750" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="793" font-size="28" font-weight="600" fill="#52645b">05</text><text x="150" y="794" font-size="34" font-weight="600" fill="#252525">가입 완료</text><text x="150" y="832" font-size="27" font-weight="400" fill="#535953">처리 결과가 전달되는지 확인</text><text x="64" y="932" font-size="29" font-weight="500" fill="#252525">각 상태의 화면 · DOM · 조작 기록을 남깁니다.</text></g></svg>