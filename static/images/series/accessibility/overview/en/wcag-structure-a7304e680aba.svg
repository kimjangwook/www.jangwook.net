<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" role="img" aria-labelledby="title desc"><title id="title">WCAG Structure and Cumulative Levels</title><desc id="desc">Guidelines sit under the four principles, and success criteria sit under the guidelines. Example: Perceivable, 1.1 Text Alternatives, 1.1.1 Non-text Content. An AA target includes both A and AA criteria, while an AAA target includes all three levels.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"/></marker></defs><rect width="840" height="760" rx="16" fill="#f6f7f3"/><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 01 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">How do we read WCAG?</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">Separate criteria structure from target levels.</text><rect x="48" y="187" width="744" height="116" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="227" font-size="30" font-weight="600" fill="#252525">Principles</text><text x="72" y="276" font-size="32" font-weight="400" fill="#252525">Perceivable · Operable · Understandable · Robust</text><path d="M420 308 L420 335" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="350" width="744" height="84" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="402" font-size="32" font-weight="600" fill="#252525">Guideline  e.g., 1.1 Text Alternatives</text><path d="M420 440 L420 464" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="478" width="744" height="84" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="530" font-size="32" font-weight="600" fill="#252525">Success criterion  e.g., 1.1.1 Non-text Content</text><text x="48" y="610" font-size="30" font-weight="600" fill="#252525">Target levels are cumulative</text><rect x="48" y="636" width="220" height="74" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="684" font-size="32" font-weight="600" fill="#252525">A</text><rect x="284" y="636" width="244" height="74" rx="12" fill="#e7ede6" stroke="#b7bcb7" stroke-width="2"/><text x="306" y="684" font-size="28" font-weight="600" fill="#252525">AA = A + AA</text><rect x="544" y="636" width="248" height="74" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="561" y="684" font-size="28" font-weight="600" fill="#252525">AAA = all three levels</text></g></svg>