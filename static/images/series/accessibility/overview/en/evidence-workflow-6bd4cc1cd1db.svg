<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="840" height="1152" viewBox="0 0 840 1152" role="img" aria-labelledby="title desc"><title id="title">Evidence-Based AI Evaluation Workflow</title><desc id="desc">Define the scope and questions, collect evidence, and then review it with tools and AI. Record evidence and judgments, make corrections, and recheck in the same environment. If evidence is insufficient, supplement the collection; record interaction failures separately as execution status. This figure presents an evaluation design, not a fully implemented service.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"></path></marker></defs><rect width="840" height="1152" rx="16" fill="#f6f7f3"></rect><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 04 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">Connecting AI evaluation to evidence</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">An evaluation process design to explore in this series.</text><rect x="64" y="190" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="233" font-size="28" font-weight="600" fill="#52645b">01</text><text x="150" y="234" font-size="34" font-weight="600" fill="#252525">Define scope and questions</text><text x="150" y="272" font-size="27" font-weight="400" fill="#535953">User journey · states · criteria · environment</text><path d="M420 304 L420 322" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="330" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="373" font-size="28" font-weight="600" fill="#52645b">02</text><text x="150" y="374" font-size="34" font-weight="600" fill="#252525">Collect evidence</text><text x="150" y="412" font-size="27" font-weight="400" fill="#535953">Screen · DOM · accessibility tree · interactions</text><path d="M420 444 L420 462" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="470" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="513" font-size="28" font-weight="600" fill="#52645b">03</text><text x="150" y="514" font-size="34" font-weight="600" fill="#252525">Review with tools and AI</text><text x="150" y="552" font-size="27" font-weight="400" fill="#535953">Measurements + context + interaction checks</text><path d="M420 584 L420 602" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="610" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="653" font-size="28" font-weight="600" fill="#52645b">04</text><text x="150" y="654" font-size="34" font-weight="600" fill="#252525">Record evidence and judgments</text><text x="150" y="692" font-size="27" font-weight="400" fill="#535953">Met · not met · not applicable · undetermined</text><path d="M420 724 L420 742" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="750" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="793" font-size="28" font-weight="600" fill="#52645b">05</text><text x="150" y="794" font-size="34" font-weight="600" fill="#252525">Correct and recheck</text><text x="150" y="832" font-size="24" font-weight="400" fill="#535953">Reproduce and compare in the same environment and state</text><rect x="48" y="917" width="744" height="138" rx="12" fill="#e7ede6" stroke="#b7bcb7" stroke-width="2"></rect><text x="72" y="963" font-size="31" font-weight="600" fill="#252525">Insufficient evidence → supplement collection</text><text x="72" y="1014" font-size="30" font-weight="500" fill="#252525">Interaction failure → record execution status separately</text><text x="48" y="1111" font-size="28" font-weight="500" fill="#252525">Do not mark untested items or insufficient evidence as “met.”</text></g></svg>