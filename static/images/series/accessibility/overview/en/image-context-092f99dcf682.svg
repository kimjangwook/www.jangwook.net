<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="840" height="954" viewBox="0 0 840 954" role="img" aria-labelledby="title desc"><title id="title">The Same Image, Different Alternative Information</title><desc id="desc">A is a decorative image beside a sentence about shipping and has no navigation function. B is a shipment-tracking link containing only a truck image. B’s focus outline, hand cursor, and arrow indicate that selecting the image link opens the shipment-tracking screen. For A, consider empty alternative text if the image is purely decorative. For B, consider alternative text such as “Track shipment” that conveys the link’s purpose.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"></path></marker></defs><rect width="840" height="954" rx="16" fill="#f6f7f3"></rect><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 03 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">Same image, different purpose</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">Consider the image + nearby text + function.</text><rect x="48" y="191" width="744" height="292" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="72" y="237" font-size="33" font-weight="600" fill="#252525">A. Decorative / no navigation</text><rect x="72" y="266" width="696" height="142" rx="12" fill="#f6f7f3" stroke="#b7bcb7" stroke-width="2"></rect><g transform="translate(96 294) scale(.75)"><g transform="translate(0 0)" fill="none" stroke="#52645b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="160" height="100" rx="8" fill="#e7ede6"></rect><path d="M160 30 H210 L248 68 V100 H160 M183 40 V69 H235"></path><circle cx="48" cy="108" r="19" fill="#f6f7f3"></circle><circle cx="201" cy="108" r="19" fill="#f6f7f3"></circle></g></g><text x="328" y="320" font-size="29" font-weight="400" fill="#252525">Shipping begins after you order.</text><text x="328" y="367" font-size="25" font-weight="600" fill="#252525">This sentence conveys the information</text><text x="72" y="451" font-size="32" font-weight="600" fill="#252525">Example to review: alt=""</text><rect x="48" y="511" width="744" height="340" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="72" y="557" font-size="33" font-weight="600" fill="#252525">B. Functional / opens tracking</text><rect x="80" y="589" width="256" height="170" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><rect x="72" y="581" width="272" height="186" rx="15" fill="none" stroke="#252525" stroke-width="3" stroke-dasharray="8 5"></rect><g transform="translate(110 615) scale(.75)"><g transform="translate(0 0)" fill="none" stroke="#52645b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="160" height="100" rx="8" fill="#e7ede6"></rect><path d="M160 30 H210 L248 68 V100 H160 M183 40 V69 H235"></path><circle cx="48" cy="108" r="19" fill="#f6f7f3"></circle><circle cx="201" cy="108" r="19" fill="#f6f7f3"></circle></g></g><g transform="translate(280 696)" fill="#fff" stroke="#252525" stroke-width="3.5" stroke-linejoin="round"><path d="M0 45 V3 Q0 -5 8 -5 Q16 -5 16 3 V23 Q22 18 28 24 Q35 21 42 28 Q49 26 56 34 V58 Q54 78 41 90 H13 L-9 57 Q-15 45 -7 41 Q-3 40 0 45Z"></path></g><path d="M374 677 L447 677" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="470" y="589" width="298" height="170" rx="12" fill="#f1f1ee" stroke="#b7bcb7" stroke-width="2"></rect><text x="494" y="634" font-size="32" font-weight="600" fill="#252525">Track shipment</text><text x="494" y="683" font-size="28" font-weight="400" fill="#252525">In transit</text><path d="M499 720 H730" stroke="#858581" stroke-width="3"></path><circle cx="515" cy="720" r="7" fill="#252525"></circle><circle cx="603" cy="720" r="7" fill="#252525"></circle><circle cx="710" cy="720" r="7" fill="#fff" stroke="#858581" stroke-width="3"></circle><text x="72" y="817" font-size="32" font-weight="600" fill="#252525">Example to review: alt="Track shipment"</text><text x="48" y="909" font-size="29" font-weight="500" fill="#252525">Ask whether describing only “a truck” is enough.</text></g></svg>