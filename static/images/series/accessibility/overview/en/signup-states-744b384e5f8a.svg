<svg lang="en" xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="840" height="974" viewBox="0 0 840 974" role="img" aria-labelledby="title desc"><title id="title">Evaluating Each State of the Sign-Up Process</title><desc id="desc">From the input screen, open and close the terms dialog, then continue entering information. Observe each state: the error after submitting an invalid email address, resubmission after correction, and sign-up completion. A single check of the initial screen does not establish that this process has been evaluated.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"/></marker></defs><rect width="840" height="974" rx="16" fill="#f6f7f3"/><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 02 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">One URL, multiple evaluation states</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">A hypothetical sign-up process.</text><rect x="64" y="190" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="233" font-size="28" font-weight="600" fill="#52645b">01</text><text x="150" y="234" font-size="34" font-weight="600" fill="#252525">Input screen</text><text x="150" y="272" font-size="27" font-weight="400" fill="#535953">Check field names and input requirements</text><path d="M420 304 L420 322" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="330" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="373" font-size="28" font-weight="600" fill="#52645b">02</text><text x="150" y="374" font-size="34" font-weight="600" fill="#252525">Terms dialog</text><text x="150" y="412" font-size="27" font-weight="400" fill="#535953">Move focus → review → close and return</text><path d="M420 444 L420 462" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="470" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="513" font-size="28" font-weight="600" fill="#52645b">03</text><text x="150" y="514" font-size="34" font-weight="600" fill="#252525">Submit an invalid email</text><text x="150" y="552" font-size="27" font-weight="400" fill="#535953">Check the error field and correction guidance</text><path d="M420 584 L420 602" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="610" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="653" font-size="28" font-weight="600" fill="#52645b">04</text><text x="150" y="654" font-size="34" font-weight="600" fill="#252525">Correct and resubmit</text><text x="150" y="692" font-size="27" font-weight="400" fill="#535953">Check error resolution and the next step</text><path d="M420 724 L420 742" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="750" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="90" y="793" font-size="28" font-weight="600" fill="#52645b">05</text><text x="150" y="794" font-size="34" font-weight="600" fill="#252525">Sign-up complete</text><text x="150" y="832" font-size="27" font-weight="400" fill="#535953">Check that the result is communicated</text><text x="64" y="932" font-size="29" font-weight="500" fill="#252525">Record each state’s screen · DOM · interactions.</text></g></svg>