<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="840" height="1152" viewBox="0 0 840 1152" role="img" aria-labelledby="title desc"><title id="title">証拠に基づくAI評価の流れ</title><desc id="desc">範囲と問いを定め、証拠を収集した後、ツールとAIで検討します。根拠と判定を記録し、修正後に同じ環境で再確認します。証拠が不足する場合は収集を補い、操作の失敗は実行状態として別に記録します。この図は、実装済みのサービスではなく、評価の設計です。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"></path></marker></defs><rect width="840" height="1152" rx="16" fill="#f6f7f3"></rect><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 04 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">AI評価を証拠につなぐ</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">このシリーズで探究する評価過程の設計です。</text><rect x="64" y="190" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="233" font-size="28" font-weight="600" fill="#52645b">01</text><text x="150" y="234" font-size="34" font-weight="600" fill="#252525">範囲と問いを定める</text><text x="150" y="272" font-size="27" font-weight="400" fill="#535953">利用過程・状態・達成基準・評価環境</text><path d="M420 304 L420 322" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="330" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="373" font-size="28" font-weight="600" fill="#52645b">02</text><text x="150" y="374" font-size="34" font-weight="600" fill="#252525">証拠を収集する</text><text x="150" y="412" font-size="27" font-weight="400" fill="#535953">画面・DOM・アクセシビリティツリー・実際の操作</text><path d="M420 444 L420 462" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="470" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="513" font-size="28" font-weight="600" fill="#52645b">03</text><text x="150" y="514" font-size="34" font-weight="600" fill="#252525">ツールとAIで検討する</text><text x="150" y="552" font-size="27" font-weight="400" fill="#535953">数値測定＋文脈解釈＋操作確認</text><path d="M420 584 L420 602" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="610" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="653" font-size="28" font-weight="600" fill="#52645b">04</text><text x="150" y="654" font-size="34" font-weight="600" fill="#252525">根拠と判定を記録する</text><text x="150" y="692" font-size="27" font-weight="400" fill="#535953">満たす・満たさない・該当なし・判断保留</text><path d="M420 724 L420 742" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="750" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="793" font-size="28" font-weight="600" fill="#52645b">05</text><text x="150" y="794" font-size="34" font-weight="600" fill="#252525">修正して再確認する</text><text x="150" y="832" font-size="27" font-weight="400" fill="#535953">同じ環境と状態で再現・比較</text><rect x="48" y="917" width="744" height="138" rx="12" fill="#e7ede6" stroke="#b7bcb7" stroke-width="2"></rect><text x="72" y="963" font-size="31" font-weight="600" fill="#252525">証拠不足 → 収集段階を補う</text><text x="72" y="1014" font-size="30" font-weight="500" fill="#252525">操作失敗 → 実行状態として別に記録</text><text x="48" y="1111" font-size="28" font-weight="500" fill="#252525">未実行や証拠不足を「満たす」に変えません。</text></g></svg>