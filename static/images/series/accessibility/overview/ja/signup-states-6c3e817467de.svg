<svg lang="ja" xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="840" height="974" viewBox="0 0 840 974" role="img" aria-labelledby="title desc"><title id="title">登録過程の状態別評価</title><desc id="desc">入力画面で利用規約を開いて閉じ、入力を続けます。不正なメールアドレスを送信したエラー状態、修正後の再送信、登録完了の状態まで、それぞれ観察します。最初の画面を一度検査するだけでは、この過程を確認したとはいえません。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"></path></marker></defs><rect width="840" height="974" rx="16" fill="#f6f7f3"></rect><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 02 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">一つのURL、複数の評価状態</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">登録過程の架空の例です。</text><rect x="64" y="190" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="233" font-size="28" font-weight="600" fill="#52645b">01</text><text x="150" y="234" font-size="34" font-weight="600" fill="#252525">入力画面</text><text x="150" y="272" font-size="27" font-weight="400" fill="#535953">項目名と入力条件を確認</text><path d="M420 304 L420 322" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="330" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="373" font-size="28" font-weight="600" fill="#52645b">02</text><text x="150" y="374" font-size="34" font-weight="600" fill="#252525">利用規約ポップアップ</text><text x="150" y="412" font-size="27" font-weight="400" fill="#535953">フォーカス移動 → 内容確認 → 閉じて戻る</text><path d="M420 444 L420 462" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="470" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="513" font-size="28" font-weight="600" fill="#52645b">03</text><text x="150" y="514" font-size="34" font-weight="600" fill="#252525">不正なメールアドレスを送信</text><text x="150" y="552" font-size="27" font-weight="400" fill="#535953">エラー項目と修正案内を確認</text><path d="M420 584 L420 602" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="610" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="653" font-size="28" font-weight="600" fill="#52645b">04</text><text x="150" y="654" font-size="34" font-weight="600" fill="#252525">入力を修正して再送信</text><text x="150" y="692" font-size="27" font-weight="400" fill="#535953">エラー解消と次の段階への移動を確認</text><path d="M420 724 L420 742" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="750" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="793" font-size="28" font-weight="600" fill="#52645b">05</text><text x="150" y="794" font-size="34" font-weight="600" fill="#252525">登録完了</text><text x="150" y="832" font-size="27" font-weight="400" fill="#535953">処理結果が伝わるかを確認</text><text x="64" y="932" font-size="29" font-weight="500" fill="#252525">各状態の画面・DOM・操作記録を残します。</text></g></svg>