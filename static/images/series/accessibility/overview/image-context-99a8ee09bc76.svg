<svg xmlns="http://www.w3.org/2000/svg" width="840" height="854" viewBox="0 0 840 854" role="img" aria-labelledby="title desc"><title id="title">같은 이미지, 다른 대체 정보</title><desc id="desc">동일한 트럭 이미지라도 배송 안내 문장이 이미 모든 의미를 전달하고 장식으로만 쓰인 경우에는 빈 대체 텍스트를 검토합니다. 이미지가 배송 추적 링크의 유일한 콘텐츠라면 링크 목적을 전달하는 배송 조회 같은 대체 텍스트가 필요합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"/></marker></defs><rect width="840" height="854" rx="16" fill="#f6f7f3"/><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 03 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">같은 그림도 목적은 다릅니다</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">이미지 + 주변 문장 + 기능을 함께 봅니다.</text><rect x="48" y="191" width="744" height="264" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="236" font-size="31" font-weight="600" fill="#252525">A. 이미 설명된 내용을 꾸미는 그림</text><g transform="translate(72 270)" fill="none" stroke="#52645b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="160" height="100" rx="8" fill="#e7ede6"/><path d="M160 30 H210 L248 68 V100 H160 M183 40 V69 H235"/><circle cx="48" cy="108" r="19" fill="#f6f7f3"/><circle cx="201" cy="108" r="19" fill="#f6f7f3"/></g><text x="370" y="306" font-size="28" font-weight="400" fill="#252525">주문 후 배송을 시작합니다.</text><text x="370" y="355" font-size="28" font-weight="600" fill="#252525">추가 의미가 없는 장식</text><text x="72" y="423" font-size="32" font-weight="600" fill="#252525">검토 예: alt=""</text><rect x="48" y="483" width="744" height="278" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="530" font-size="31" font-weight="600" fill="#252525">B. 그림만 있는 배송 추적 링크</text><g transform="translate(72 568)" fill="none" stroke="#52645b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="160" height="100" rx="8" fill="#e7ede6"/><path d="M160 30 H210 L248 68 V100 H160 M183 40 V69 H235"/><circle cx="48" cy="108" r="19" fill="#f6f7f3"/><circle cx="201" cy="108" r="19" fill="#f6f7f3"/></g><text x="370" y="605" font-size="28" font-weight="400" fill="#252525">링크 목적지: 배송 조회</text><text x="370" y="654" font-size="28" font-weight="600" fill="#252525">링크의 목적을 전달</text><text x="72" y="731" font-size="32" font-weight="600" fill="#252525">검토 예: alt="배송 조회"</text><text x="48" y="813" font-size="29" font-weight="500" fill="#252525">모습만 묘사한 “트럭”으로 충분한지 묻습니다.</text></g></svg>