<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="840" height="1152" viewBox="0 0 840 1152" role="img" aria-labelledby="title desc"><title id="title">基于证据的 AI 评估流程</title><desc id="desc">确定范围与问题，收集证据，然后使用工具与 AI 检查。记录依据与判定，修正后在相同环境中重新确认。证据不足时补充收集，操作失败则作为执行状态单独记录。本图展示的是评估设计，而非已实现的服务。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"></path></marker></defs><rect width="840" height="1152" rx="16" fill="#f6f7f3"></rect><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 04 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">将 AI 评估与证据关联</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">本系列将探索的评估流程设计。</text><rect x="64" y="190" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="233" font-size="28" font-weight="600" fill="#52645b">01</text><text x="150" y="234" font-size="34" font-weight="600" fill="#252525">确定范围与问题</text><text x="150" y="272" font-size="27" font-weight="400" fill="#535953">使用过程 · 状态 · 成功准则 · 评估环境</text><path d="M420 304 L420 322" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="330" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="373" font-size="28" font-weight="600" fill="#52645b">02</text><text x="150" y="374" font-size="34" font-weight="600" fill="#252525">收集证据</text><text x="150" y="412" font-size="27" font-weight="400" fill="#535953">画面 · DOM · 无障碍树 · 实际操作</text><path d="M420 444 L420 462" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="470" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="513" font-size="28" font-weight="600" fill="#52645b">03</text><text x="150" y="514" font-size="34" font-weight="600" fill="#252525">使用工具与 AI 检查</text><text x="150" y="552" font-size="27" font-weight="400" fill="#535953">数值测量 + 上下文解读 + 交互确认</text><path d="M420 584 L420 602" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="610" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="653" font-size="28" font-weight="600" fill="#52645b">04</text><text x="150" y="654" font-size="34" font-weight="600" fill="#252525">记录依据与判定</text><text x="150" y="692" font-size="27" font-weight="400" fill="#535953">满足 · 不满足 · 不适用 · 暂缓判定</text><path d="M420 724 L420 742" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="750" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="793" font-size="28" font-weight="600" fill="#52645b">05</text><text x="150" y="794" font-size="34" font-weight="600" fill="#252525">修正并重新确认</text><text x="150" y="832" font-size="27" font-weight="400" fill="#535953">在相同环境与状态下复现、比较</text><rect x="48" y="917" width="744" height="138" rx="12" fill="#e7ede6" stroke="#b7bcb7" stroke-width="2"></rect><text x="72" y="963" font-size="31" font-weight="600" fill="#252525">证据不足 → 补充收集环节</text><text x="72" y="1014" font-size="30" font-weight="500" fill="#252525">操作失败 → 单独记录执行状态</text><text x="48" y="1111" font-size="28" font-weight="500" fill="#252525">不得将未执行或证据不足改记为“满足”。</text></g></svg>