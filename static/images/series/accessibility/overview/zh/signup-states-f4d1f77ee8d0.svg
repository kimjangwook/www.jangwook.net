<svg lang="zh" xml:lang="zh" xmlns="http://www.w3.org/2000/svg" width="840" height="974" viewBox="0 0 840 974" role="img" aria-labelledby="title desc"><title id="title">注册流程的各状态评估</title><desc id="desc">从输入页面打开并关闭条款，继续输入。分别观察提交错误邮箱后的错误状态、修改后重新提交以及注册完成状态。不能凭一次初始页面检查就声称已经检查了整个流程。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"></path></marker></defs><rect width="840" height="974" rx="16" fill="#f6f7f3"></rect><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 02 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">一个 URL，多种评估状态</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">注册流程的假设示例。</text><rect x="64" y="190" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="233" font-size="28" font-weight="600" fill="#52645b">01</text><text x="150" y="234" font-size="34" font-weight="600" fill="#252525">输入页面</text><text x="150" y="272" font-size="27" font-weight="400" fill="#535953">确认字段名称与输入要求</text><path d="M420 304 L420 322" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="330" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="373" font-size="28" font-weight="600" fill="#52645b">02</text><text x="150" y="374" font-size="34" font-weight="600" fill="#252525">条款弹窗</text><text x="150" y="412" font-size="27" font-weight="400" fill="#535953">移动焦点 → 查看内容 → 关闭并返回</text><path d="M420 444 L420 462" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="470" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="513" font-size="28" font-weight="600" fill="#52645b">03</text><text x="150" y="514" font-size="34" font-weight="600" fill="#252525">提交错误邮箱</text><text x="150" y="552" font-size="27" font-weight="400" fill="#535953">确认错误字段与修正说明</text><path d="M420 584 L420 602" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="610" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="653" font-size="28" font-weight="600" fill="#52645b">04</text><text x="150" y="654" font-size="34" font-weight="600" fill="#252525">修改后重新提交</text><text x="150" y="692" font-size="27" font-weight="400" fill="#535953">确认错误消除并进入下一步</text><path d="M420 724 L420 742" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"></path><rect x="64" y="750" width="712" height="108" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"></rect><text x="90" y="793" font-size="28" font-weight="600" fill="#52645b">05</text><text x="150" y="794" font-size="34" font-weight="600" fill="#252525">注册完成</text><text x="150" y="832" font-size="27" font-weight="400" fill="#535953">确认处理结果是否得到传达</text><text x="64" y="932" font-size="29" font-weight="500" fill="#252525">记录各状态的画面、DOM 与操作。</text></g></svg>