<svg xmlns="http://www.w3.org/2000/svg" width="840" height="954" viewBox="0 0 840 954" role="img" aria-labelledby="title desc"><title id="title">같은 이미지, 다른 대체 정보</title><desc id="desc">A는 배송 안내 문장 옆에 놓인 장식 이미지이며 이동 기능이 없습니다. B는 트럭 이미지만 들어 있는 배송 조회 링크입니다. B의 초점 테두리, 손 모양 포인터와 화살표는 이미지 링크를 선택하면 배송 조회 화면으로 이동함을 나타냅니다. A는 순수 장식인 경우 빈 대체 텍스트를, B는 링크 목적을 전달하는 배송 조회 같은 대체 텍스트를 검토합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"/></marker></defs><rect width="840" height="954" rx="16" fill="#f6f7f3"/><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 03 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">같은 그림도 목적은 다릅니다</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">이미지 + 주변 문장 + 기능을 함께 봅니다.</text><rect x="48" y="191" width="744" height="292" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="237" font-size="33" font-weight="600" fill="#252525">A. 장식 / 이동 기능 없음</text><rect x="72" y="266" width="696" height="142" rx="12" fill="#f6f7f3" stroke="#b7bcb7" stroke-width="2"/><g transform="translate(96 294) scale(.75)"><g transform="translate(0 0)" fill="none" stroke="#52645b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="160" height="100" rx="8" fill="#e7ede6"/><path d="M160 30 H210 L248 68 V100 H160 M183 40 V69 H235"/><circle cx="48" cy="108" r="19" fill="#f6f7f3"/><circle cx="201" cy="108" r="19" fill="#f6f7f3"/></g></g><text x="328" y="320" font-size="29" font-weight="400" fill="#252525">주문 후 배송을 시작합니다.</text><text x="328" y="367" font-size="29" font-weight="600" fill="#252525">정보는 이 문장으로 전달</text><text x="72" y="451" font-size="32" font-weight="600" fill="#252525">검토 예: alt=""</text><rect x="48" y="511" width="744" height="340" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="557" font-size="33" font-weight="600" fill="#252525">B. 기능 / 배송 조회로 이동</text><rect x="80" y="589" width="256" height="170" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><rect x="72" y="581" width="272" height="186" rx="15" fill="none" stroke="#252525" stroke-width="3" stroke-dasharray="8 5"/><g transform="translate(110 615) scale(.75)"><g transform="translate(0 0)" fill="none" stroke="#52645b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="160" height="100" rx="8" fill="#e7ede6"/><path d="M160 30 H210 L248 68 V100 H160 M183 40 V69 H235"/><circle cx="48" cy="108" r="19" fill="#f6f7f3"/><circle cx="201" cy="108" r="19" fill="#f6f7f3"/></g></g><g transform="translate(280 696)" fill="#fff" stroke="#252525" stroke-width="3.5" stroke-linejoin="round"><path d="M0 45 V3 Q0 -5 8 -5 Q16 -5 16 3 V23 Q22 18 28 24 Q35 21 42 28 Q49 26 56 34 V58 Q54 78 41 90 H13 L-9 57 Q-15 45 -7 41 Q-3 40 0 45Z"/></g><path d="M374 677 L447 677" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="589" width="298" height="170" rx="12" fill="#f1f1ee" stroke="#b7bcb7" stroke-width="2"/><text x="494" y="634" font-size="32" font-weight="600" fill="#252525">배송 조회</text><text x="494" y="683" font-size="28" font-weight="400" fill="#252525">배송 중</text><path d="M499 720 H730" stroke="#858581" stroke-width="3"/><circle cx="515" cy="720" r="7" fill="#252525"/><circle cx="603" cy="720" r="7" fill="#252525"/><circle cx="710" cy="720" r="7" fill="#fff" stroke="#858581" stroke-width="3"/><text x="72" y="817" font-size="32" font-weight="600" fill="#252525">검토 예: alt="배송 조회"</text><text x="48" y="909" font-size="29" font-weight="500" fill="#252525">모습만 묘사한 “트럭”으로 충분한지 묻습니다.</text></g></svg>