<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" role="img" aria-labelledby="title desc"><title id="title">WCAG의 구조와 누적 수준</title><desc id="desc">네 원칙 아래 지침, 지침 아래 성공 기준이 있습니다. 예: 인식 가능성, 1.1 텍스트 대안, 1.1.1 비텍스트 콘텐츠. AA 목표는 A와 AA 기준을 함께 포함하며 AAA 목표는 세 수준을 모두 포함합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52645b" stroke-width="1.5"/></marker></defs><rect width="840" height="760" rx="16" fill="#f6f7f3"/><g font-family="'Noto Sans KR Variable','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><text x="48" y="52" font-size="24" font-weight="600" fill="#52645b">FIG. 01 / WCAG 2.2</text><text x="48" y="108" font-size="40" font-weight="650" fill="#252525">WCAG는 어떻게 읽을까요?</text><text x="48" y="153" font-size="28" font-weight="400" fill="#535953">기준의 구조와 목표 수준을 구분합니다.</text><rect x="48" y="187" width="744" height="116" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="227" font-size="30" font-weight="600" fill="#252525">원칙</text><text x="72" y="276" font-size="32" font-weight="400" fill="#252525">인식 가능 · 운용 가능 · 이해 가능 · 견고</text><path d="M420 308 L420 335" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="350" width="744" height="84" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="402" font-size="32" font-weight="600" fill="#252525">지침  예: 1.1 텍스트 대안</text><path d="M420 440 L420 464" fill="none" stroke="#52645b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="478" width="744" height="84" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="530" font-size="32" font-weight="600" fill="#252525">성공 기준  예: 1.1.1 비텍스트 콘텐츠</text><text x="48" y="610" font-size="30" font-weight="600" fill="#252525">목표 수준은 누적됩니다</text><rect x="48" y="636" width="220" height="74" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="72" y="684" font-size="32" font-weight="600" fill="#252525">A</text><rect x="284" y="636" width="244" height="74" rx="12" fill="#e7ede6" stroke="#b7bcb7" stroke-width="2"/><text x="306" y="684" font-size="28" font-weight="600" fill="#252525">AA = A + AA</text><rect x="544" y="636" width="248" height="74" rx="12" fill="#fff" stroke="#b7bcb7" stroke-width="2"/><text x="561" y="684" font-size="28" font-weight="600" fill="#252525">AAA = 세 수준</text></g></svg>