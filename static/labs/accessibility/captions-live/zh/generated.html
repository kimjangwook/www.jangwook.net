<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex, follow"><title>区分完全由计算机生成的媒体与实时媒体</title><style>*{box-sizing:border-box}html{font-family:system-ui,sans-serif;background:#fafaf8;color:#252525}body{max-width:850px;margin:auto;padding:24px;line-height:1.8}h1{font-size:26px;line-height:1.4}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap}video,canvas{width:100%;height:auto;border:1px solid #aaa;border-radius:6px}button{font:inherit;padding:12px 20px;background:#252525;color:#fff;border:1px solid #252525;border-radius:4px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #745c41;outline-offset:4px}.notice{border-left:3px solid #8a7357;padding:12px 16px;background:#f0ede7}details{border-top:1px solid #ccc;padding:16px 0}summary{cursor:pointer;font-weight:650}table{border-collapse:collapse;width:100%}td,th{text-align:left;vertical-align:top;border-bottom:1px solid #ccc;padding:10px}code,pre{white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:14px;color:#575750}@media(max-width:500px){body{padding:18px}h1{font-size:23px}}</style></head><body><nav aria-label="练习页面"><a href="index.html">案例列表</a><a href="replay.html">录像播放</a><a href="generated.html">计算机生成</a></nav><h1>完全由计算机生成的画面和声音</h1><p class="notice">不拍摄或录制真实世界事件。画面和声音由浏览器代码生成。当前正在生成这一事实本身，并不满足 WCAG 对 live 的定义。</p><p>播放时，数字从0变到10，在第4秒时发出一次短促的声音。画面上也会显示“提示音”。不使用麦克风、摄像头或外部流。</p><canvas width="960" height="420" role="img" aria-label="由代码生成的数字画面。第4秒的提示音也通过画面上的“提示音”文字表达。"></canvas><p><button type="button" id="start">播放10秒演示</button> <output id="status">待机</output></p><p class="small">此媒体是实时生成的演示，并非实际直播记录。字幕及其他无障碍要求的评估需另行进行。</p><p><a href="/zh/series/accessibility/captions-live">返回实时字幕文章</a></p><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('#start');let raf=0,audio;window.demoEvidence={source:'fully_computer_generated',externalCapture:false,beeps:0,frames:0};function draw(t){ctx.fillStyle='#ece9e1';ctx.fillRect(0,0,960,420);ctx.fillStyle='#252525';ctx.font='28px sans-serif';ctx.fillText("计算机生成演示 · 非实际直播",60,80);ctx.font='80px sans-serif';ctx.fillText(String(t).padStart(2,'0'),60,210);ctx.font='28px sans-serif';ctx.fillText(t===4?"[提示音]":"数字画面与合成声音",60,310);window.demoEvidence.frames++;}draw(0);button.addEventListener('click',async()=>{button.disabled=true;audio=new AudioContext();await audio.resume();const start=performance.now();let previous=-1;function frame(){const t=Math.min(10,Math.floor((performance.now()-start)/1000));if(t!==previous){draw(t);status.value=t+" / 10秒";previous=t;if(t===4){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18);window.demoEvidence.beeps++;}}if(t<10){raf=requestAnimationFrame(frame);}else{button.disabled=false;audio.close();}}frame();});</script></body></html>
