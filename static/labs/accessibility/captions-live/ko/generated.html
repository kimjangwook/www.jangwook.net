<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex, follow"><title>완전 컴퓨터 생성 매체와 실시간 구분</title><style>*{box-sizing:border-box}html{font-family:system-ui,sans-serif;background:#fafaf8;color:#252525}body{max-width:850px;margin:auto;padding:24px;line-height:1.8}h1{font-size:26px;line-height:1.4}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap}video,canvas{width:100%;height:auto;border:1px solid #aaa;border-radius:6px}button{font:inherit;padding:12px 20px;background:#252525;color:#fff;border:1px solid #252525;border-radius:4px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #745c41;outline-offset:4px}.notice{border-left:3px solid #8a7357;padding:12px 16px;background:#f0ede7}details{border-top:1px solid #ccc;padding:16px 0}summary{cursor:pointer;font-weight:650}table{border-collapse:collapse;width:100%}td,th{text-align:left;vertical-align:top;border-bottom:1px solid #ccc;padding:10px}code,pre{white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:14px;color:#575750}@media(max-width:500px){body{padding:18px}h1{font-size:23px}}</style></head><body><nav aria-label="실습 페이지"><a href="index.html">사례 목록</a><a href="replay.html">녹화 재생</a><a href="generated.html">컴퓨터 생성</a></nav><h1>컴퓨터가 전부 생성하는 화면과 소리</h1><p class="notice">실세계 사건을 촬영하거나 녹음하지 않습니다. 화면과 소리는 브라우저 코드가 생성합니다. 현재 생성된다는 사실만으로 WCAG의 live 정의를 충족하지 않습니다.</p><p>재생하면 0부터 10까지 숫자가 바뀌며 4초 시점에 한 번 짧은 소리가 납니다. 화면에도 ‘알림음’이 표시됩니다. 마이크·카메라·외부 스트림을 사용하지 않습니다.</p><canvas width="960" height="420" role="img" aria-label="코드가 생성한 숫자 화면. 4초의 알림음은 화면의 알림음 문구로도 표현됩니다."></canvas><p><button type="button" id="start">10초 데모 재생</button> <output id="status">대기</output></p><p class="small">이 매체는 실시간 생성 데모이며 생중계 실적이 아닙니다. 자막과 다른 접근성 요구의 평가는 별도입니다.</p><p><a href="/series/accessibility/captions-live">실시간 자막 글로 돌아가기</a></p><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('#start');let raf=0,audio;window.demoEvidence={source:'fully_computer_generated',externalCapture:false,beeps:0,frames:0};function draw(t){ctx.fillStyle='#ece9e1';ctx.fillRect(0,0,960,420);ctx.fillStyle='#252525';ctx.font='28px sans-serif';ctx.fillText('컴퓨터 생성 데모 · 실제 생중계 아님',60,80);ctx.font='80px sans-serif';ctx.fillText(String(t).padStart(2,'0'),60,210);ctx.font='28px sans-serif';ctx.fillText(t===4?'[알림음]':'숫자 화면과 합성 소리',60,310);window.demoEvidence.frames++;}draw(0);button.addEventListener('click',async()=>{button.disabled=true;audio=new AudioContext();await audio.resume();const start=performance.now();let previous=-1;function frame(){const t=Math.min(10,Math.floor((performance.now()-start)/1000));if(t!==previous){draw(t);status.value=t+' / 10초';previous=t;if(t===4){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18);window.demoEvidence.beeps++;}}if(t<10){raf=requestAnimationFrame(frame);}else{button.disabled=false;audio.close();}}frame();});</script></body></html>
