<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex, follow"><title>完全にコンピュータが生成するメディアとライブの区別</title><style>*{box-sizing:border-box}html{font-family:system-ui,sans-serif;background:#fafaf8;color:#252525}body{max-width:850px;margin:auto;padding:24px;line-height:1.8}h1{font-size:26px;line-height:1.4}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:20px;flex-wrap:wrap}video,canvas{width:100%;height:auto;border:1px solid #aaa;border-radius:6px}button{font:inherit;padding:12px 20px;background:#252525;color:#fff;border:1px solid #252525;border-radius:4px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #745c41;outline-offset:4px}.notice{border-left:3px solid #8a7357;padding:12px 16px;background:#f0ede7}details{border-top:1px solid #ccc;padding:16px 0}summary{cursor:pointer;font-weight:650}table{border-collapse:collapse;width:100%}td,th{text-align:left;vertical-align:top;border-bottom:1px solid #ccc;padding:10px}code,pre{white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:14px;color:#575750}@media(max-width:500px){body{padding:18px}h1{font-size:23px}}</style></head><body><nav aria-label="実習ページ"><a href="index.html">事例一覧</a><a href="replay.html">録画再生</a><a href="generated.html">コンピュータ生成</a></nav><h1>コンピュータがすべて生成する画面と音</h1><p class="notice">実世界の出来事を撮影・録音しません。画面と音はブラウザーのコードが生成します。現在生成されているという事実だけでは、WCAGのliveの定義を満たしません。</p><p>再生すると0から10まで数字が変わり、4秒時点で1回短い音が鳴ります。画面にも「通知音」と表示されます。マイク・カメラ・外部ストリームは使用しません。</p><canvas width="960" height="420" role="img" aria-label="コードが生成した数字の画面。4秒時点の通知音は、画面の「通知音」という文言でも表されます。"></canvas><p><button type="button" id="start">10秒デモを再生</button> <output id="status">待機</output></p><p class="small">このメディアはリアルタイム生成デモであり、生中継の実績ではありません。キャプションとその他のアクセシビリティ要件の評価は別途行います。</p><p><a href="/ja/series/accessibility/captions-live">ライブキャプションの記事に戻る</a></p><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),button=document.querySelector('#start');let raf=0,audio;window.demoEvidence={source:'fully_computer_generated',externalCapture:false,beeps:0,frames:0};function draw(t){ctx.fillStyle='#ece9e1';ctx.fillRect(0,0,960,420);ctx.fillStyle='#252525';ctx.font='28px sans-serif';ctx.fillText("コンピュータ生成デモ · 実際の生中継ではありません",60,80);ctx.font='80px sans-serif';ctx.fillText(String(t).padStart(2,'0'),60,210);ctx.font='28px sans-serif';ctx.fillText(t===4?"[通知音]":"数字の画面と合成音",60,310);window.demoEvidence.frames++;}draw(0);button.addEventListener('click',async()=>{button.disabled=true;audio=new AudioContext();await audio.resume();const start=performance.now();let previous=-1;function frame(){const t=Math.min(10,Math.floor((performance.now()-start)/1000));if(t!==previous){draw(t);status.value=t+" / 10秒";previous=t;if(t===4){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18);window.demoEvidence.beeps++;}}if(t<10){raf=requestAnimationFrame(frame);}else{button.disabled=false;audio.close();}}frame();});</script></body></html>
