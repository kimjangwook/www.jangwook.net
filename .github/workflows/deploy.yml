name: Deploy to GitHub Pages

on:
  # 'main' 브랜치로 푸시할 때마다 워크플로를 트리거합니다.
  # 다른 브랜치 이름을 사용하시나요? `main`을 브랜치 이름으로 바꾸세요.
  push:
    branches: [main]
  # GitHub의 Actions 탭에서 이 워크플로를 수동으로 실행할 수 있습니다.
  workflow_dispatch:
  # 매일 한국 시간 00:00 (UTC 15:00 전날)에 자동 빌드하여 예약 포스트 공개
  schedule:
    - cron: "0 15 * * *"

# 이 작업이 리포지토리를 복제하고 페이지 배포를 생성하도록 허용합니다.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Tokyo' # 일본 시간대 설정 (JST, UTC+9)
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # path: . # 저장소 내 Astro 프로젝트의 루트 위치입니다. (선택 사항)
          node-version: 22 # 사이트를 빌드하는 데 사용해야 하는 특정 버전의 Node입니다. 기본값은 20입니다. (선택 사항)
          # package-manager: pnpm@latest # 종속성을 설치하고 사이트를 빌드하는 데 사용해야 하는 노드 패키지 관리자입니다. lockfile을 기반으로 자동으로 감지됩니다. (선택 사항)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # 배포 완료 후 전체 sitemap URL을 IndexNow로 송신 (Bing/Copilot 색인 갱신)
    # 배경: 2026-06-20 IndexNow 미배포로 AI Performance Citations 급락 → 재발 방지
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - << 'EOF'
          import json, re, urllib.request

          HOST = "jangwook.net"
          KEY = "fab847bedb7a40429e80d70450c31ea6"
          SITEMAPS = [f"https://{HOST}/sitemap-{lang}.xml" for lang in ("ko", "ja", "en", "zh")]

          urls = set()
          for sm in SITEMAPS:
              try:
                  body = urllib.request.urlopen(sm, timeout=30).read().decode()
                  urls.update(re.findall(r"<loc>(.*?)</loc>", body))
              except Exception as e:
                  print(f"WARN: {sm}: {e}")

          if not urls:
              raise SystemExit("ERROR: no URLs extracted from sitemaps")

          payload = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": sorted(urls),
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              res = urllib.request.urlopen(req, timeout=30)
              print(f"IndexNow: HTTP {res.status}, submitted {len(urls)} URLs")
          except urllib.error.HTTPError as e:
              print(f"IndexNow: HTTP {e.code} - {e.read().decode()}")
              # 403(검증 대기)·429(과다)로 배포 자체를 실패시키지 않음
          EOF
