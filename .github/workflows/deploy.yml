name: Deploy to Cloudflare Workers

on:
  # 'main' 브랜치로 푸시할 때마다 워크플로를 트리거합니다.
  # 다른 브랜치 이름을 사용하시나요? `main`을 브랜치 이름으로 바꾸세요.
  push:
    branches: [main]
  # GitHub의 Actions 탭에서 이 워크플로를 수동으로 실행할 수 있습니다.
  workflow_dispatch:
  # 매일 한국 시간 00:00 (UTC 15:00 전날)에 자동 빌드하여 예약 포스트 공개
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Tokyo' # 일본 시간대 설정 (JST, UTC+9)
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # assets 전용 설정은 wrangler 4 필요 (v3 액션 기본값은 3.x)
          wranglerVersion: "4.120.1"
      # 배포 완료 후 전체 sitemap URL을 IndexNow로 송신 (Bing/Copilot 색인 갱신)
      # 배경: 2026-06-20 IndexNow 미배포로 AI Performance Citations 급락 → 재발 방지
      # sitemap은 HTTP가 아닌 빌드 산출물(dist/)에서 직접 읽음 —
      # Cloudflare Bot Fight Mode가 python-urllib UA를 403으로 차단하기 때문
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - << 'EOF'
          import json, re, urllib.request
          from pathlib import Path

          HOST = "jangwook.net"
          KEY = "fab847bedb7a40429e80d70450c31ea6"

          urls = set()
          for lang in ("ko", "ja", "en", "zh"):
              sm = Path(f"dist/sitemap-{lang}.xml")
              if sm.exists():
                  urls.update(re.findall(r"<loc>(.*?)</loc>", sm.read_text()))
              else:
                  print(f"WARN: {sm} not found")

          if not urls:
              raise SystemExit("ERROR: no URLs extracted from sitemaps")

          payload = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": sorted(urls),
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              res = urllib.request.urlopen(req, timeout=30)
              print(f"IndexNow: HTTP {res.status}, submitted {len(urls)} URLs")
          except urllib.error.HTTPError as e:
              print(f"IndexNow: HTTP {e.code} - {e.read().decode()}")
              # 403(검증 대기)·429(과다)로 배포 자체를 실패시키지 않음
          EOF
